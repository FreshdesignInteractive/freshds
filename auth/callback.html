<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing you in — FreshDS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #fafafa;
    color: #1a1a2e;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #ece9fe;
    border-top-color: #7c6af7;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label {
    font-size: 14px;
    color: #666;
    font-weight: 500;
  }
  .error-msg {
    font-size: 13px;
    color: #dc2626;
    max-width: 280px;
    line-height: 1.5;
  }
  .back-link {
    font-size: 13px;
    color: #7c6af7;
    text-decoration: none;
    margin-top: 4px;
  }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="spinner"></div>
  <div class="label">Signing you in…</div>
</div>

<script type="module">
  import { supabase } from '/js/supabase-client.js'

  async function waitForSession() {
    // Try immediately first (works if session already exists)
    const { data: { session } } = await supabase.auth.getSession()
    if (session) return session

    // Otherwise wait for PKCE code exchange to complete (up to 15s)
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        subscription.unsubscribe()
        reject(new Error('Sign-in timed out. Please try again.'))
      }, 15000)

      const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          clearTimeout(timer)
          subscription.unsubscribe()
          resolve(session)
        }
      })
    })
  }

  async function handleCallback() {
    const wrap = document.getElementById('wrap')

    try {
      const session = await waitForSession()

      if (!session) throw new Error('Sign-in failed. Please try again.')

      const email = session.user.email?.toLowerCase()

      if (!email) {
        await supabase.auth.signOut()
        window.location.replace('/?signin=not-approved')
        return
      }

      // Check approval status — RLS ensures the user can only read their own record
      const { data: request, error: reqError } = await supabase
        .from('beta_requests')
        .select('status')
        .maybeSingle()

      if (reqError) throw new Error('Could not verify access. Please try again.')

      if (!request) {
        await supabase.auth.signOut()
        window.location.replace('/?signin=not-approved')
        return
      }

      if (request.status === 'approved') {
        window.location.replace('/app.html')
        return
      }

      if (request.status === 'pending') {
        await supabase.auth.signOut()
        window.location.replace('/?signin=pending')
        return
      }

      // rejected or unknown status
      await supabase.auth.signOut()
      window.location.replace('/?signin=rejected')

    } catch (err) {
      wrap.innerHTML = `
        <div class="error-msg">${err.message}</div>
        <a class="back-link" href="/">← Back to home</a>
      `
    }
  }

  handleCallback()
</script>
</body>
</html>
