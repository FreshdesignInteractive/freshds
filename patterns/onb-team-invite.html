<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Invite — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/onboarding.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="onb-page">
    <pattern-topbar logged-in></pattern-topbar>

    <div class="page-body-row">
      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>
    <div class="onb-body">
      <div class="onb-wrap">

        <div class="onb-stepper">
          <fresh-stepper step="5" steps='[
            {"label":"Role"},
            {"label":"Use case"},
            {"label":"Profile"},
            {"label":"Workspace"},
            {"label":"Team"},
            {"label":"Integrations"}
          ]'></fresh-stepper>
        </div>

        <div class="onb-eyebrow">Step 5 of 6</div>
        <h1 class="onb-title">Invite your team</h1>
        <p class="onb-sub">Collaboration works better together. Invite teammates now or skip and do it later.</p>

        <div class="invite-input-row">
          <fresh-input placeholder="colleague@company.com" type="email" clearable></fresh-input>
          <fresh-button variant="secondary"><i class="ti ti-plus"></i> Add</fresh-button>
        </div>

        <div class="invited-list">
          <div class="invited-item">
            <fresh-avatar name="Marcus Chen" size="sm"></fresh-avatar>
            <span class="invited-item-email">marcus.chen@acme.com</span>
            <span class="invited-item-role">Member</span>
            <button class="invited-item-remove" aria-label="Remove Marcus Chen">
              <i class="ti ti-x"></i>
            </button>
          </div>
          <div class="invited-item">
            <fresh-avatar name="Priya Sharma" size="sm"></fresh-avatar>
            <span class="invited-item-email">priya.sharma@acme.com</span>
            <span class="invited-item-role">Member</span>
            <button class="invited-item-remove" aria-label="Remove Priya Sharma">
              <i class="ti ti-x"></i>
            </button>
          </div>
          <div class="invited-item">
            <fresh-avatar name="Tom Okeke" size="sm"></fresh-avatar>
            <span class="invited-item-email">t.okeke@acme.com</span>
            <span class="invited-item-role">Admin</span>
            <button class="invited-item-remove" aria-label="Remove Tom Okeke">
              <i class="ti ti-x"></i>
            </button>
          </div>
        </div>

        <div class="onb-nav">
          <fresh-button variant="ghost"><i class="ti ti-arrow-left"></i> Back</fresh-button>
          <div class="onb-nav-right">
            <a class="onb-skip" href="#">Skip for now</a>
            <fresh-button variant="primary">Continue <i class="ti ti-arrow-right"></i></fresh-button>
          </div>
        </div>

      </div>
    </div>
    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/data/fresh-avatar.js"></script>
<script src="../components/navigation/fresh-stepper.js"></script>
</body>
</html>
