<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Trial — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/commerce.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()"><i class="ti ti-moon"></i></button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()"><i class="ti ti-minus"></i></button>
  </div>

  <div class="com-shell">
    <pattern-topbar logged-in></pattern-topbar>

    <div class="page-body-row">
      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>
    <div class="com-page" style="padding-top:var(--space-10);">
      <div class="com-container-sm">

        <!-- Hero -->
        <div style="text-align:center;margin-bottom:var(--space-10);">
          <div style="display:inline-flex;align-items:center;gap:var(--space-2);background:var(--color-interactive-subtle);color:var(--color-interactive-text);padding:6px 16px;border-radius:var(--radius-full);font-size:12px;font-weight:700;margin-bottom:var(--space-4);">
            <i class="ti ti-rocket"></i> 14-day free trial
          </div>
          <div class="com-page-title" style="margin-bottom:var(--space-3);">Try Acme Pro free for 14 days</div>
          <div class="com-page-subtitle" style="margin-bottom:0;">Full access. No credit card needed. Cancel anytime with one click.</div>
        </div>

        <!-- Sign-up card -->
        <div style="background:var(--surface-canvas);border:1px solid var(--surface-border);border-radius:var(--radius-xl);padding:var(--space-8);">

          <div style="display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-6);">
            <fresh-form-field label="Work email" required>
              <fresh-input  placeholder="you@company.com" type="email" value="jamie@techvault.io"></fresh-input>
            </fresh-form-field>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);">
              <fresh-form-field label="First name" required>
                <fresh-input  placeholder="First name" value="Jamie"></fresh-input>
              </fresh-form-field>
              <fresh-form-field label="Last name" required>
                <fresh-input  placeholder="Last name" value="Rivera"></fresh-input>
              </fresh-form-field>
            </div>
            <fresh-form-field label="Company name">
              <fresh-input  placeholder="Your company" value="Techvault Inc"></fresh-input>
            </fresh-form-field>
            <fresh-form-field label="Team size">
              <fresh-select >
                <option>Just me</option>
                <option selected>2–10 people</option>
                <option>11–50 people</option>
                <option>51–200 people</option>
                <option>200+ people</option>
              </fresh-select>
            </fresh-form-field>
          </div>

          <fresh-button variant="primary" style="width:100%;font-size:15px;padding:var(--space-3);">
            <i class="ti ti-rocket"></i> Start my free trial
          </fresh-button>

          <div style="text-align:center;font-size:12px;color:var(--text-tertiary);margin-top:var(--space-3);">
            By signing up, you agree to our <a href="#" style="color:var(--color-interactive-text);">Terms</a> and <a href="#" style="color:var(--color-interactive-text);">Privacy Policy</a>.
          </div>

          <!-- Divider -->
          <div style="display:flex;align-items:center;gap:var(--space-3);margin:var(--space-5) 0;">
            <div style="flex:1;height:1px;background:var(--surface-border);"></div>
            <span style="font-size:12px;color:var(--text-tertiary);">or continue with</span>
            <div style="flex:1;height:1px;background:var(--surface-border);"></div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);">
            <fresh-button variant="secondary"><i class="ti ti-brand-google"></i> Google</fresh-button>
            <fresh-button variant="secondary"><i class="ti ti-building"></i> SSO</fresh-button>
          </div>
        </div>

        <!-- Trust indicators -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);margin-top:var(--space-8);text-align:center;">
          <div>
            <div style="font-size:20px;font-weight:800;color:var(--text-primary);">14 days</div>
            <div style="font-size:12px;color:var(--text-secondary);">Full Pro access</div>
          </div>
          <div>
            <div style="font-size:20px;font-weight:800;color:var(--text-primary);">No card</div>
            <div style="font-size:12px;color:var(--text-secondary);">Required to start</div>
          </div>
          <div>
            <div style="font-size:20px;font-weight:800;color:var(--text-primary);">1 click</div>
            <div style="font-size:12px;color:var(--text-secondary);">To cancel anytime</div>
          </div>
        </div>

      </div>
    </div>
    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-select.js"></script>
<script src="../components/core/fresh-form-field.js"></script>
</body>
</html>
