<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/auth.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="auth-page">
    <pattern-topbar>
    </pattern-topbar>

    <div class="auth-body">
      <div class="auth-left" aria-hidden="true">
        <div class="auth-left-inner">
          <div class="auth-left-icon"><i class="ti ti-photo"></i></div>
          <div class="auth-left-label">Customer image</div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-form-wrap">
          <div class="auth-form">
            <h1 class="auth-title">Welcome back!</h1>
            <p class="auth-sub">Brief description comes here if needed.</p>

            <div class="field-stack">
              <div class="field">
                <label class="field-label" for="username">User name</label>
                <fresh-input id="username" autocomplete="username"></fresh-input>
              </div>
              <div class="field">
                <label class="field-label" for="password">Password</label>
                <fresh-input id="password" type="password" autocomplete="current-password"></fresh-input>
              </div>
            </div>

            <div class="auth-options">
              <fresh-checkbox label="Remember me"></fresh-checkbox>
              <a class="auth-link" href="auth-forgot-password.html">Forgot password</a>
            </div>

            <fresh-button>Login</fresh-button>
          </div>
        </div>

        <div class="auth-foot">
          Don't have an account?&nbsp;<a class="auth-link" href="auth-signup.html">Sign up</a>
        </div>
      </div>
    </div>
  </div>

</div>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-checkbox.js"></script>
<script src="../components/core/fresh-button.js"></script>
</body>
</html>
