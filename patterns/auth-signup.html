<!DOCTYPE html>
<html lang="en">
<head>
<!-- Auth guard: redirects to / if no session or unpaid -->
<script type="module" src="/js/auth-guard.js"></script>
<script type="module" src="/js/paid-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/auth.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
<style>
/* Logo dark/light switching for nav brand slot (slotted content = light DOM) */
.nav-logo-dark { display: none; }
[data-mode="dark"] .nav-logo-light { display: none; }
[data-mode="dark"] .nav-logo-dark  { display: block; }

/* ── Spec trigger button (in demo bar) ── */</style>
<link rel="stylesheet" href="../styles/spec-panel.css">
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
      <div class="demo-sep"></div>
      <button class="demo-spec-btn" onclick="spOpen()" aria-label="View pattern spec">
        <i class="ti ti-layout-sidebar-right"></i> Configure
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="auth-page">
    <fresh-navbar id="auth-topbar">
      <div slot="actions" style="display:flex;align-items:center;gap:8px;">
        <fresh-button variant="secondary" size="sm">Sign in</fresh-button>
        <fresh-button variant="primary" size="sm">Sign up</fresh-button>
      </div>
    </fresh-navbar>

    <div class="auth-body">
      <div class="auth-left" aria-hidden="true">
        <div class="auth-left-inner">
          <div class="auth-left-icon"><i class="ti ti-photo"></i></div>
          <div class="auth-left-label">Customer image</div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-form-wrap">
          <div class="auth-form">
            <a class="auth-back" href="auth-login.html">
              <i class="ti ti-arrow-left"></i> Back to sign in
            </a>

            <h1 class="auth-title">Create account</h1>
            <p class="auth-sub">Get started today. No credit card required.</p>

            <div class="field-stack">
              <div class="field-row">
                <div class="field">
                  <label class="field-label" for="fname">First name</label>
                  <fresh-input id="fname" autocomplete="given-name"></fresh-input>
                </div>
                <div class="field">
                  <label class="field-label" for="lname">Last name</label>
                  <fresh-input id="lname" autocomplete="family-name"></fresh-input>
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="email">Work email</label>
                <fresh-input id="email" type="email" icon="ti-mail" placeholder="you@company.com" autocomplete="email"></fresh-input>
              </div>
              <div class="field">
                <label class="field-label" for="password">Password</label>
                <fresh-input id="password" type="password" autocomplete="new-password"></fresh-input>
              </div>
              <div class="field">
                <label class="field-label" for="confirm">Confirm password</label>
                <fresh-input id="confirm" type="password" autocomplete="new-password"></fresh-input>
              </div>
            </div>

            <div style="margin-bottom:var(--space-5)">
              <fresh-checkbox label="I agree to the Terms of Service and Privacy Policy"></fresh-checkbox>
            </div>

            <fresh-button>Create account</fresh-button>
          </div>
        </div>

        <div class="auth-foot">
          Already have an account?&nbsp;<a class="auth-link" href="auth-login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Spec panel -- plain HTML/CSS, no DS tokens -->
<aside class="sp-panel" id="sp-panel" aria-label="Pattern spec" aria-hidden="true">
  <div class="sp-hdr">
    <span class="sp-hdr-title">Configure</span>
    <button class="sp-hdr-close" onclick="spClose()" aria-label="Close spec">
      <i class="ti ti-x"></i>
    </button>
  </div>
  <div class="sp-body">
    <div class="sp-section">
      <div class="sp-section-label">ZONES</div>
      <div id="sp-zones"></div>
    </div>
    <div class="sp-section">
      <div class="sp-section-label">GLOBAL TEMPLATE RULES</div>
      <div class="sp-rules-hdr">
        <i class="ti ti-sparkles sp-rules-hdr-icon"></i>
        <span class="sp-rules-hdr-name">AI RULES: SIGN UP</span>
        <span class="sp-rules-hdr-hint">Click to edit</span>
      </div>
      <div id="sp-cats"></div>
    </div>
  </div>
  <div class="sp-bottom">
    <button class="sp-btn sp-btn-icon" id="sp-share-btn" onclick="spShare()" title="Share builder link" aria-label="Share builder link">
      <i class="ti ti-link"></i>
    </button>
    <button class="sp-btn sp-btn-primary" onclick="spStartBuilding()">
      Configure <i class="ti ti-arrow-right"></i>
    </button>
  </div>
</aside>

<!-- Prompt modal -->
<div class="sp-modal-backdrop" id="sp-modal-backdrop" onclick="spCloseModal()">
  <div class="sp-modal" onclick="event.stopPropagation()">
    <div class="sp-modal-hdr">
      <span>Claude Code Prompt</span>
      <button class="sp-modal-close" onclick="spCloseModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="sp-modal-body">
      <pre class="sp-modal-pre" id="sp-modal-pre"></pre>
    </div>
    <div class="sp-modal-foot">
      <span class="sp-copy-ok" id="sp-copy-ok">Copied to clipboard</span>
      <button class="sp-btn sp-btn-primary" onclick="spCopyPrompt()">
        <i class="ti ti-copy"></i> Copy prompt
      </button>
    </div>
  </div>
</div>

<script src="../components/navigation/fresh-navbar.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-checkbox.js"></script>
<script src="../components/core/fresh-button.js"></script>
<script src="../js/freshds-nav-apply.js"></script>
<script>
/* ── Zone toggle functions ───────────────────────────────── */

function _zoneBrandPanel(on) {
  var left = document.querySelector('.auth-left');
  if (left) left.style.display = on ? '' : 'none';
}

/* ── Spec panel data ─────────────────────────────────────── */

var SP_ZONES = [
  { id: 'brand-panel', name: 'Brand Panel', required: false, on: true, onToggle: _zoneBrandPanel }
];

var SP_ZONE_COLORS = ['#e85454'];

var SP_RULES = {
  'LAYOUT': [
    'Form container max-width is 380px, centered vertically in the right panel.',
    'Brand panel is 50% viewport width. Disable it to give the form full-page width.',
    'Brand panel is always hidden below 768px regardless of zone setting.'
  ],
  'FORM FIELDS': [
    'First name and last name sit side by side on desktop, stacked on mobile.',
    'Work email field uses the mail icon slot (icon="ti-mail") and email autocomplete.',
    'Password field always shows a reveal-plaintext toggle.',
    'Confirm password field must match the password field before submission.'
  ],
  'VALIDATION': [
    'Validate fields on blur, not on submit, to surface errors early.',
    'Show an inline password strength indicator once the user starts typing.',
    'Display a clear mismatch error on the confirm field if passwords do not match.',
    'Minimum password length is 8 characters.'
  ],
  'CONSENT': [
    'Terms of Service checkbox must be checked before the Create account button is enabled.',
    'Link "Terms of Service" and "Privacy Policy" inline within the checkbox label.'
  ]
};

/* ── Open / close ────────────────────────────────────────── */

function _spApplyAllZones() {
  SP_ZONES.forEach(function(z) { if (z.onToggle) z.onToggle(z.on); });
}

function spOpen() {
  document.getElementById('sp-panel').classList.add('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'false');
  _spRenderZones();
  _spRenderCats();
  _spApplyAllZones();
  var u = new URL(location.href);
  u.searchParams.set('spec', 'open');
  history.replaceState(null, '', u.toString());
}

function spClose() {
  document.getElementById('sp-panel').classList.remove('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'true');
  var u = new URL(location.href);
  u.searchParams.delete('spec');
  history.replaceState(null, '', u.toString());
}

/* ── Zones ───────────────────────────────────────────────── */

function _spRenderZones() {
  var el = document.getElementById('sp-zones');
  el.innerHTML = '';
  SP_ZONES.forEach(function(z, i) {
    var color = SP_ZONE_COLORS[i % SP_ZONE_COLORS.length];
    var row = document.createElement('div');
    row.className = 'sp-zone';
    if (z.required) {
      row.innerHTML =
        '<span class="sp-zone-num">' + (i + 1) + '</span>' +
        '<span class="sp-zone-dot" style="background:' + color + '"></span>' +
        '<span class="sp-zone-name">' + _spEsc(z.name) + '</span>' +
        '<span class="sp-zone-badge sp-req">Required</span>';
    } else {
      var uid = 'spt-' + z.id;
      row.innerHTML =
        '<span class="sp-zone-num">' + (i + 1) + '</span>' +
        '<span class="sp-zone-dot" style="background:' + color + '"></span>' +
        '<span class="sp-zone-name">' + _spEsc(z.name) + '</span>' +
        '<span class="sp-zone-badge">Optional</span>' +
        '<label class="sp-toggle" aria-label="Toggle ' + _spEsc(z.name) + '">' +
          '<input type="checkbox" id="' + uid + '"' + (z.on ? ' checked' : '') + '>' +
          '<span class="sp-toggle-track"></span>' +
        '</label>';
      (function(zone) {
        row.querySelector('input[type="checkbox"]').addEventListener('change', function(e) {
          zone.on = e.target.checked;
          if (zone.onToggle) zone.onToggle(zone.on);
        });
      })(z);
    }
    el.appendChild(row);
  });
}

/* ── Rules ───────────────────────────────────────────────── */

function _spRenderCats() {
  var el = document.getElementById('sp-cats');
  el.innerHTML = '';
  Object.keys(SP_RULES).forEach(function(cat) {
    var wrap = document.createElement('div');
    wrap.className = 'sp-cat';
    _spBuildCat(cat, wrap);
    el.appendChild(wrap);
  });
}

function _spBuildCat(cat, wrap) {
  wrap.innerHTML = '';
  var label = document.createElement('div');
  label.className = 'sp-cat-label';
  label.textContent = cat;
  wrap.appendChild(label);
  SP_RULES[cat].forEach(function(rule, ri) {
    wrap.appendChild(_spRuleRow(cat, ri, rule, wrap));
  });
  var addBtn = document.createElement('button');
  addBtn.className = 'sp-add-rule';
  addBtn.innerHTML = '<i class="ti ti-plus"></i> Add rule';
  addBtn.addEventListener('click', function() {
    SP_RULES[cat].push('New rule');
    _spBuildCat(cat, wrap);
    var texts = wrap.querySelectorAll('.sp-rule-text');
    var last = texts[texts.length - 1];
    if (last) {
      last.focus();
      var r = document.createRange();
      r.selectNodeContents(last);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
  });
  wrap.appendChild(addBtn);
}

function _spRuleRow(cat, ri, text, wrap) {
  var row = document.createElement('div');
  row.className = 'sp-rule';
  var dot = document.createElement('span');
  dot.className = 'sp-rule-dot';
  var span = document.createElement('span');
  span.className = 'sp-rule-text';
  span.contentEditable = 'true';
  span.textContent = text;
  span.addEventListener('input', function() { SP_RULES[cat][ri] = span.textContent; });
  var del = document.createElement('button');
  del.className = 'sp-rule-del';
  del.innerHTML = '<i class="ti ti-trash"></i>';
  del.setAttribute('aria-label', 'Delete rule');
  del.addEventListener('click', function() {
    SP_RULES[cat].splice(ri, 1);
    _spBuildCat(cat, wrap);
  });
  row.appendChild(dot);
  row.appendChild(span);
  row.appendChild(del);
  return row;
}

/* ── Share ───────────────────────────────────────────────── */

function spShare() {
  var u = new URL(location.href);
  u.searchParams.set('spec', 'open');
  var btn = document.getElementById('sp-share-btn');
  navigator.clipboard.writeText(u.toString()).then(function() {
    var orig = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-check"></i> Link copied';
    setTimeout(function() { btn.innerHTML = orig; }, 1800);
  }).catch(function() {});
}

/* ── Prompt generator ────────────────────────────────────── */

function spStartBuilding() {
  var lines = ['Build a Sign Up pattern using FreshDS components and tokens.\n'];
  lines.push('ACTIVE ZONES:');
  SP_ZONES.forEach(function(z) {
    if (z.required || z.on) {
      lines.push('  - ' + z.name + ' (' + (z.required ? 'Required' : 'Optional, ON') + ')');
    }
  });
  lines.push('');
  lines.push('TEMPLATE RULES:');
  Object.keys(SP_RULES).forEach(function(cat) {
    if (!SP_RULES[cat].length) return;
    lines.push('\n  ' + cat + ':');
    SP_RULES[cat].forEach(function(r) { lines.push('  - ' + r); });
  });
  lines.push('\nCOMPONENTS TO USE:');
  lines.push('  <fresh-input> for all text and password fields');
  lines.push('  <fresh-button> for the primary create account action');
  lines.push('  <fresh-checkbox> for the terms of service consent');
  lines.push('\nReference: patterns/auth-signup.html');
  document.getElementById('sp-modal-pre').textContent = lines.join('\n');
  document.getElementById('sp-modal-backdrop').classList.add('open');
}

function spCloseModal() {
  document.getElementById('sp-modal-backdrop').classList.remove('open');
}

function spCopyPrompt() {
  var text = document.getElementById('sp-modal-pre').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var el = document.getElementById('sp-copy-ok');
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 1800);
  }).catch(function() {});
}

/* ── Helpers ─────────────────────────────────────────────── */

function _spEsc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Auto-open from URL ──────────────────────────────────── */
(function() {
  if (new URLSearchParams(location.search).get('spec') === 'open') {
    document.addEventListener('DOMContentLoaded', spOpen);
  }
})();

/* ── Keyboard shortcuts ──────────────────────────────────── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('sp-modal-backdrop').classList.contains('open')) {
      spCloseModal();
    } else if (document.getElementById('sp-panel').classList.contains('open')) {
      spClose();
    }
  }
});
</script>
</body>
</html>
