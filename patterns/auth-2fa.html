<!DOCTYPE html>
<html lang="en">
<head>
<!-- Auth guard: redirects to / if no session or unpaid -->
<script type="module" src="/js/auth-guard.js"></script>
<script type="module" src="/js/paid-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two-Factor Auth | Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/auth.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>

<style>
  .otp-input fresh-input { font-family: var(--font-mono); letter-spacing: 0.35em; }

  .backup-link {
    display: block;
    margin-top: var(--space-4);
    font-size: 13px;
    text-align: center;
    color: var(--text-secondary);
  }
  .backup-link a {
    color: var(--color-interactive-text);
    text-decoration: none;
    font-weight: 500;
  }
  .backup-link a:hover { text-decoration: underline; }

  .device-row { margin-bottom: var(--space-5); }
</style>
<link rel="stylesheet" href="../styles/spec-panel.css">
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
      <div class="demo-sep"></div>
      <button class="demo-spec-btn" onclick="spOpen()" aria-label="Configure pattern"><i class="ti ti-layout-sidebar-right"></i> Configure</button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="auth-page">
    <fresh-navbar id="auth-topbar">
      <div slot="actions" style="display:flex;align-items:center;gap:8px;">
        <fresh-button variant="ghost" size="sm">Sign in</fresh-button>
        <fresh-button variant="primary" size="sm">Sign up</fresh-button>
      </div>
    </fresh-navbar>

    <div class="auth-body">
      <div class="auth-left" aria-hidden="true">
        <div class="auth-left-inner">
          <div class="auth-left-icon"><i class="ti ti-photo"></i></div>
          <div class="auth-left-label">Customer image</div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-form-wrap">
          <div class="auth-form">
            <a class="auth-back" href="auth-login.html">
              <i class="ti ti-arrow-left"></i> Back to sign in
            </a>

            <h1 class="auth-title">Two-step verification</h1>
            <p class="auth-sub">Enter the 6-digit code from your authenticator app. The code refreshes every 30 seconds.</p>

            <div class="field-stack">
              <div class="field otp-input">
                <label class="field-label" for="totp-code">Authenticator code</label>
                <fresh-input
                  id="totp-code"
                  size="lg"
                  placeholder="000 000"
                  autocomplete="one-time-code"
                  inputmode="numeric"
                  maxlength="6"
                ></fresh-input>
              </div>
            </div>

            <div class="device-row">
              <fresh-checkbox label="Remember this device for 30 days"></fresh-checkbox>
            </div>

            <fresh-button>Verify</fresh-button>

            <p class="backup-link">
              Lost access to your app? <a href="#">Use a backup code</a>
            </p>
          </div>
        </div>

        <div class="auth-foot">
          Having trouble?&nbsp;<a class="auth-link" href="#">Contact support</a>
        </div>
      </div>
    </div>
  </div>

</div>
<script src="../components/navigation/fresh-navbar.js"></script>
<script src="../js/freshds-nav-apply.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/core/fresh-checkbox.js"></script>
</body>
</html>
