<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email | Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/auth.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>

<style>
  /* ── OTP input — single large code field ── */
  .otp-wrap {
    margin-bottom: var(--space-5);
  }

  /* Override fresh-input size for the code field */
  .otp-wrap fresh-input {
    font-family: var(--font-mono);
    letter-spacing: 0.35em;
    font-size: 22px;
  }

  /* ── Resend timer ── */
  .resend-row {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-top: var(--space-4);
    font-size: 13px;
    color: var(--text-secondary);
  }

  .resend-count {
    font-variant-numeric: tabular-nums;
    color: var(--text-tertiary);
    min-width: 3ch;
  }
</style>
<link rel="stylesheet" href="../styles/spec-panel.css">
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
      <div class="demo-sep"></div>
      <button class="demo-spec-btn" onclick="spOpen()" aria-label="Configure pattern"><i class="ti ti-layout-sidebar-right"></i> Configure</button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="auth-page">
    <fresh-navbar id="auth-topbar">
      <div slot="actions" style="display:flex;align-items:center;gap:8px;">
        <fresh-button variant="ghost" size="sm">Sign in</fresh-button>
        <fresh-button variant="primary" size="sm">Sign up</fresh-button>
      </div>
    </fresh-navbar>

    <div class="auth-body">
      <div class="auth-left" aria-hidden="true">
        <div class="auth-left-inner">
          <div class="auth-left-icon"><i class="ti ti-photo"></i></div>
          <div class="auth-left-label">Customer image</div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-form-wrap">
          <div class="auth-form">

            <!-- Email icon -->
            <div class="auth-success-icon" style="background:var(--color-interactive-subtle);border-color:var(--color-interactive-border);color:var(--color-interactive-text)" aria-hidden="true">
              <i class="ti ti-mail" style="font-size:24px"></i>
            </div>

            <h1 class="auth-title">Verify your email</h1>
            <p class="auth-sub">
              We sent a 6-digit code to <strong>your@email.com</strong>.
              Enter it below to verify your account.
            </p>

            <div class="field otp-wrap">
              <label class="field-label" for="otp-code">Verification code</label>
              <fresh-input
                id="otp-code"
                placeholder="000000"
                size="lg"
                autocomplete="one-time-code"
                inputmode="numeric"
                maxlength="6"
              ></fresh-input>
            </div>

            <div id="alert-wrap" class="auth-alert" style="display:none">
              <fresh-alert variant="danger" id="error-alert" dismissible>
                Invalid or expired code. Please try again.
              </fresh-alert>
            </div>

            <fresh-button id="verify-btn">Verify email</fresh-button>

            <div class="resend-row">
              <span>Didn't receive it?</span>
              <button class="auth-link" id="resend-btn" disabled>Resend code</button>
              <span class="resend-count" id="resend-count" aria-live="polite"></span>
            </div>

          </div>
        </div>

        <div class="auth-foot">
          Wrong email?&nbsp;<a class="auth-link" href="auth-signup.html">Go back to sign up</a>
        </div>
      </div>
    </div>
  </div>

</div>
<script src="../components/navigation/fresh-navbar.js"></script>
<script src="../js/freshds-nav-apply.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/feedback/fresh-alert.js"></script>
<script>
  /* ── Resend cooldown timer ── */
  document.addEventListener('DOMContentLoaded', function () {
    var resendBtn   = document.getElementById('resend-btn');
    var countEl     = document.getElementById('resend-count');
    var alertWrap   = document.getElementById('alert-wrap');
    var COOLDOWN    = 30;
    var _timer      = null;

    function startCooldown() {
      var remaining = COOLDOWN;
      resendBtn.disabled = true;
      countEl.textContent = '(' + remaining + 's)';

      _timer = setInterval(function () {
        remaining--;
        if (remaining <= 0) {
          clearInterval(_timer);
          resendBtn.disabled = false;
          countEl.textContent = '';
        } else {
          countEl.textContent = '(' + remaining + 's)';
        }
      }, 1000);
    }

    /* Start the initial cooldown on load */
    startCooldown();

    resendBtn.addEventListener('click', function () {
      startCooldown();
      alertWrap.style.display = 'none';
    });

    /* Show error state demo on verify click with empty/short input */
    var verifyBtn = document.getElementById('verify-btn');
    var otpEl     = document.getElementById('otp-code');

    verifyBtn.addEventListener('click', function () {
      var val = otpEl.value || '';
      if (val.length < 6) {
        alertWrap.style.display = 'block';
      }
    });
  });
</script>
</body>
</html>
