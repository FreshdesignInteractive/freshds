<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Tour — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/onboarding.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
<style>
  /* ── Tour overlay shell (takes full viewport) ── */
  body { overflow: hidden; }

  .tour-shell {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    flex-direction: column;
  }

  /* ── Simulated app: topbar ── */
  .app-topbar {
    height: 52px;
    background: var(--surface-bg);
    border-bottom: 1px solid var(--surface-border);
    display: flex;
    align-items: center;
    padding: 0 var(--space-4);
    gap: var(--space-3);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .app-topbar-brand {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-right: var(--space-2);
  }
  .app-topbar-nav {
    display: flex;
    align-items: center;
    gap: var(--space-1);
  }
  .app-nav-item {
    padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  .app-nav-item.active {
    background: var(--surface-subtle);
    color: var(--text-primary);
  }
  .app-topbar-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }

  /* ── Simulated app: body ── */
  .app-body {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* ── Simulated sidebar ── */
  .app-sidebar {
    width: 220px;
    background: var(--surface-bg);
    border-right: 1px solid var(--surface-border);
    padding: var(--space-4) var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    flex-shrink: 0;
  }
  .app-sidebar-item {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .app-sidebar-item.active {
    background: var(--color-interactive-subtle);
    color: var(--color-interactive-text);
  }
  .app-sidebar-item i { font-size: 15px; }

  /* ── Simulated main content ── */
  .app-main {
    flex: 1;
    padding: var(--space-6);
    background: var(--surface-subtle);
    overflow: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto auto;
    gap: var(--space-4);
    align-content: start;
  }
  .app-card {
    background: var(--surface-canvas);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    height: 80px;
  }
  .app-card-tall {
    background: var(--surface-canvas);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    grid-column: span 2;
    height: 120px;
  }
  .app-card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    margin-bottom: var(--space-2);
  }
  .app-card-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.03em;
  }

  /* ── Tour overlay (backdrop) ── */
  .tour-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
  }

  /* Spotlight: cut-out via box-shadow covering entire screen */
  .tour-spotlight {
    position: absolute;
    border-radius: var(--radius-lg);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    pointer-events: none;
    transition: all 300ms ease;
  }

  /* ── Tour card ── */
  .tour-card {
    position: absolute;
    z-index: 200;
    width: 300px;
    background: var(--surface-canvas);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-xl);
    padding: var(--space-5);
    box-shadow: var(--elev-4);
  }
  .tour-card-step {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-interactive-text);
    margin-bottom: var(--space-2);
  }
  .tour-card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-bottom: var(--space-2);
  }
  .tour-card-body {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.55;
    margin-bottom: var(--space-5);
  }
  .tour-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tour-card-dots {
    display: flex;
    gap: var(--space-1);
  }
  .tour-dot {
    width: 6px; height: 6px;
    border-radius: var(--radius-full);
    background: var(--surface-border-strong);
    transition: background 200ms;
  }
  .tour-dot.active {
    background: var(--color-interactive);
    width: 16px;
  }
  .tour-card-actions { display: flex; align-items: center; gap: var(--space-2); }
  .tour-skip {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-tertiary);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: var(--font-sans);
  }
  .tour-skip:hover { color: var(--text-secondary); }

  /* ── Responsive: hide sidebar on narrow viewports ── */
  @media (max-width: 767px) {
    .app-sidebar { display: none; }
    .app-main { grid-template-columns: 1fr 1fr; }
    .app-card-tall { grid-column: span 2; }
    .tour-card { width: 260px; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <!-- Simulated app shell -->
  <div class="tour-shell">

    <pattern-topbar logged-in></pattern-topbar>
    </div>

    <div class="app-body">
      <aside class="app-sidebar">
        <div class="app-sidebar-item active"><i class="ti ti-home"></i> Home</div>
        <div class="app-sidebar-item"><i class="ti ti-chart-bar"></i> Analytics</div>
        <div class="app-sidebar-item"><i class="ti ti-users"></i> Team</div>
        <div class="app-sidebar-item"><i class="ti ti-settings"></i> Settings</div>
      </aside>
      <main class="app-main">
        <div class="app-card">
          <div class="app-card-title">Projects</div>
          <div class="app-card-value">12</div>
        </div>
        <div class="app-card">
          <div class="app-card-title">Tasks done</div>
          <div class="app-card-value">84</div>
        </div>
        <div class="app-card">
          <div class="app-card-title">Team members</div>
          <div class="app-card-value">7</div>
        </div>
        <div class="app-card-tall">
          <div class="app-card-title">Activity</div>
        </div>
        <div class="app-card">
          <div class="app-card-title">Pending</div>
          <div class="app-card-value">3</div>
        </div>
      </main>
    </div>

  </div><!-- /tour-shell -->

  <!-- Overlay + spotlight -->
  <div class="tour-overlay" id="tour-overlay">
    <div class="tour-spotlight" id="tour-spotlight"></div>
  </div>

  <!-- Tour card -->
  <div class="tour-card" id="tour-card">
    <div class="tour-card-step">Step 2 of 4</div>
    <div class="tour-card-title">Stay on top of notifications</div>
    <div class="tour-card-body">
      The bell icon shows you new mentions, comments, and activity in real time. Click it any time to see what's new.
    </div>
    <div class="tour-card-footer">
      <div class="tour-card-dots">
        <div class="tour-dot"></div>
        <div class="tour-dot active"></div>
        <div class="tour-dot"></div>
        <div class="tour-dot"></div>
      </div>
      <div class="tour-card-actions">
        <button class="tour-skip">Skip tour</button>
        <fresh-button variant="primary" size="sm">Next <i class="ti ti-arrow-right"></i></fresh-button>
      </div>
    </div>
  </div>

</div><!-- /#app -->

<script src="../components/core/fresh-button.js"></script>
<script src="../components/data/fresh-avatar.js"></script>
<script>
  function positionTour() {
    const target   = document.getElementById('spotlight-target');
    const card     = document.getElementById('tour-card');
    const spotlight = document.getElementById('tour-spotlight');
    if (!target || !card || !spotlight) return;

    const tr = target.getBoundingClientRect();
    const pad = 8;

    // Position spotlight around the target
    spotlight.style.top    = (tr.top  - pad) + 'px';
    spotlight.style.left   = (tr.left - pad) + 'px';
    spotlight.style.width  = (tr.width  + pad * 2) + 'px';
    spotlight.style.height = (tr.height + pad * 2) + 'px';

    // Place card below and to the left of the spotlight
    const cardW = 300;
    let cardLeft = tr.left + tr.width / 2 - cardW / 2;
    let cardTop  = tr.bottom + pad + 16;

    // Clamp horizontally
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    if (cardLeft + cardW > vw - 16) cardLeft = vw - cardW - 16;
    if (cardLeft < 16) cardLeft = 16;

    // If would go off-screen below, place above
    const cardApproxH = 200;
    if (cardTop + cardApproxH > vh) cardTop = tr.top - pad - cardApproxH - 16;

    card.style.left = cardLeft + 'px';
    card.style.top  = cardTop  + 'px';
  }

  // Run after components have registered and rendered
  requestAnimationFrame(() => { requestAnimationFrame(positionTour); });
  window.addEventListener('resize', positionTour);
</script>
</body>
</html>
