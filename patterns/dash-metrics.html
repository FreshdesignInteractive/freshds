<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metrics Overview — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/dashboard.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="dash-shell">

    <pattern-topbar logged-in></pattern-topbar>

    <div class="dash-body">

      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>

      <main class="dash-main">
        <div class="dash-page-header">
          <div>
            <div class="dash-page-title">Metrics Overview</div>
            <div class="dash-page-subtitle">Key performance indicators across your workspace.</div>
          </div>
          <div class="dash-page-actions">
            <fresh-button variant="secondary" size="sm"><i class="ti ti-calendar"></i> Last 30 days</fresh-button>
            <fresh-button variant="secondary" size="sm"><i class="ti ti-download"></i> Export</fresh-button>
          </div>
        </div>

        <div class="dash-content">

          <!-- 4 stat cards -->
          <div class="dash-stat-row">
            <fresh-stat-card value="$48,320" label="Monthly revenue" trend="12.4" trend-label="vs last month" icon="ti-currency-dollar"></fresh-stat-card>
            <fresh-stat-card value="1,847"   label="Active users"    trend="8.1"  trend-label="vs last month" icon="ti-users"></fresh-stat-card>
            <fresh-stat-card value="68ms"    label="Avg. response"   trend="-14"  trend-label="vs last month" icon="ti-bolt"></fresh-stat-card>
            <fresh-stat-card value="4.8"     label="Satisfaction"    trend="0.3"  trend-label="vs last month" icon="ti-star"></fresh-stat-card>
          </div>

          <!-- Full-width line chart -->
          <div style="margin-bottom:var(--space-4)">
            <fresh-chart id="dm-rev-fc" title="Revenue trend" description="Daily MRR over the past 30 days" height="200px"></fresh-chart>
          </div>

          <!-- Two charts side by side -->
          <div class="dash-cols-2">
            <fresh-chart id="dm-sig-fc" title="User signups" description="New accounts per week" height="160px"></fresh-chart>

            <fresh-chart id="dm-lat-fc" title="Response time" description="Average latency in ms" height="160px"></fresh-chart>
          </div>

        </div>
      </main>

    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/data/fresh-avatar.js"></script>
<script src="../components/data/fresh-stat-card.js"></script>
<script src="../components/data/fresh-chart.js"></script>
<script>
(function() {
  var _charts = {};
  function _tok(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function _rgba(hex, a) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }
  function _render() {
    Object.values(_charts).forEach(function(c) { c.destroy(); });
    _charts = {};
    var dv1 = _tok('--dv-1'), dv1s = _tok('--dv-1-subtle');
    var dv7 = _tok('--dv-7'), dv7s = _tok('--dv-7-subtle');
    var t = _tok('--text-tertiary'), b = _tok('--surface-border');
    var axTick = { color: t, font: { family: 'Inter,sans-serif', size: 11 } };

    /* Revenue trend: current + dashed previous */
    var c1 = document.getElementById('dm-rev-fc') ? document.getElementById('dm-rev-fc').chartCanvas : null;
    if (c1 && typeof Chart !== 'undefined') {
      _charts.rev = new Chart(c1, { type: 'line', data: {
        labels: ['W1','W2','W3','W4','W5','W6','W7'],
        datasets: [
          { label: 'Current', data: [38.2,40.1,41.8,43.2,44.5,46.1,48.3],
            borderColor: dv1, backgroundColor: dv1s, fill: true, tension: 0.4, borderWidth: 2,
            pointBackgroundColor: dv1, pointBorderColor: 'transparent', pointRadius: 0, pointHoverRadius: 5 },
          { label: 'Previous', data: [28.5,30.2,32.0,33.8,35.4,37.1,38.2],
            borderColor: _rgba(dv1, 0.4), backgroundColor: 'transparent', fill: false,
            tension: 0.4, borderWidth: 1.5, borderDash: [4,3], pointRadius: 0, pointHoverRadius: 0 }
        ]
      }, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { color: b }, ticks: axTick },
          y: { grid: { color: b }, ticks: Object.assign({}, axTick, { callback: function(v) { return '$'+v+'k'; } }) }
        }
      }});
    }

    /* User signups: bar */
    var c2 = document.getElementById('dm-sig-fc') ? document.getElementById('dm-sig-fc').chartCanvas : null;
    if (c2 && typeof Chart !== 'undefined') {
      _charts.sig = new Chart(c2, { type: 'bar', data: {
        labels: ['W1','W2','W3','W4','W5','W6'],
        datasets: [{ label: 'Signups', data: [42,58,68,51,78,89],
          backgroundColor: dv1s, borderColor: dv1, borderWidth: 1.5, borderRadius: 4 }]
      }, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false }, ticks: axTick },
          y: { grid: { color: b }, ticks: axTick } }
      }});
    }

    /* Response time: area */
    var c3 = document.getElementById('dm-lat-fc') ? document.getElementById('dm-lat-fc').chartCanvas : null;
    if (c3 && typeof Chart !== 'undefined') {
      _charts.lat = new Chart(c3, { type: 'line', data: {
        labels: ['W1','W2','W3','W4','W5','W6'],
        datasets: [{ label: 'ms', data: [180,162,155,168,148,142],
          borderColor: dv7, backgroundColor: dv7s, fill: true, tension: 0.4, borderWidth: 2,
          pointBackgroundColor: dv7, pointBorderColor: 'transparent', pointRadius: 0, pointHoverRadius: 5 }]
      }, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { color: b }, ticks: axTick },
          y: { grid: { color: b }, ticks: Object.assign({}, axTick, { callback: function(v) { return v+'ms'; } }) }
        }
      }});
    }
  }
  new MutationObserver(_render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-mode'] });
  requestAnimationFrame(_render);
}());
</script>
</body>
</html>
