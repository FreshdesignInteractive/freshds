<script>
(function() {
  var _charts = {};
  function _tok(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function _rgba(hex, a) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }
  function _render() {
    Object.values(_charts).forEach(function(c) { c.destroy(); });
    _charts = {};
    var dv1 = _tok('--dv-1'), dv1s = _tok('--dv-1-subtle');
    var dv7 = _tok('--dv-7'), dv7s = _tok('--dv-7-subtle');
    var t = _tok('--text-tertiary'), b = _tok('--surface-border');
    var axTick = { color: t, font: { family: 'Inter,sans-serif', size: 11 } };

    /* Revenue trend: current + dashed previous */
    var c1 = document.getElementById('dm-rev-fc') ? document.getElementById('dm-rev-fc').chartCanvas : null;
    if (c1 && typeof Chart !== 'undefined') {
      _charts.rev = new Chart(c1, { type: 'line', data: {
        labels: ['W1','W2','W3','W4','W5','W6','W7'],
        datasets: [
          { label: 'Current', data: [38.2,40.1,41.8,43.2,44.5,46.1,48.3],
            borderColor: dv1, backgroundColor: dv1s, fill: true, tension: 0.4, borderWidth: 2,
            pointBackgroundColor: dv1, pointBorderColor: 'transparent', pointRadius: 0, pointHoverRadius: 5 },
          { label: 'Previous', data: [28.5,30.2,32.0,33.8,35.4,37.1,38.2],
            borderColor: _rgba(dv1, 0.4), backgroundColor: 'transparent', fill: false,
            tension: 0.4, borderWidth: 1.5, borderDash: [4,3], pointRadius: 0, pointHoverRadius: 0 }
        ]
      }, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { color: b }, ticks: axTick },
          y: { grid: { color: b }, ticks: Object.assign({}, axTick, { callback: function(v) { return '$'+v+'k'; } }) }
        }
      }});
    }

    /* User signups: bar */
    var c2 = document.getElementById('dm-sig-fc') ? document.getElementById('dm-sig-fc').chartCanvas : null;
    if (c2 && typeof Chart !== 'undefined') {
      _charts.sig = new Chart(c2, { type: 'bar', data: {
        labels: ['W1','W2','W3','W4','W5','W6'],
        datasets: [{ label: 'Signups', data: [42,58,68,51,78,89],
          backgroundColor: dv1s, borderColor: dv1, borderWidth: 1.5, borderRadius: 4 }]
      }, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false }, ticks: axTick },
          y: { grid: { color: b }, ticks: axTick } }
      }});
    }

    /* Response time: area */
    var c3 = document.getElementById('dm-lat-fc') ? document.getElementById('dm-lat-fc').chartCanvas : null;
    if (c3 && typeof Chart !== 'undefined') {
      _charts.lat = new Chart(c3, { type: 'line', data: {
        labels: ['W1','W2','W3','W4','W5','W6'],
        datasets: [{ label: 'ms', data: [180,162,155,168,148,142],
          borderColor: dv7, backgroundColor: dv7s, fill: true, tension: 0.4, borderWidth: 2,
          pointBackgroundColor: dv7, pointBorderColor: 'transparent', pointRadius: 0, pointHoverRadius: 5 }]
      }, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: { color: b }, ticks: axTick },
          y: { grid: { color: b }, ticks: Object.assign({}, axTick, { callback: function(v) { return v+'ms'; } }) }
        }
      }});
    }
  }
  new MutationObserver(_render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-mode'] });
  requestAnimationFrame(_render);
}());
</script>

<script>
var _currentPattern='persistent-sidebar',_flyoutIdx=-1;
function _readNavCfg(){var cfg={nav_pattern:'persistent-sidebar',taxonomy:[]};try{var s=localStorage.getItem('freshds-nav-cfg');if(s)Object.assign(cfg,JSON.parse(s));}catch(e){}return cfg;}
function _getTax(cfg){return(Array.isArray(cfg.taxonomy)&&cfg.taxonomy.length>0)?cfg.taxonomy:(typeof DEFAULT_TAXONOMY!=='undefined'?DEFAULT_TAXONOMY:[]);}
function _buildIconRail(tax){var html='<fresh-nav-group label="Nav" open>';tax.forEach(function(item,idx){var ic=item.icon?' icon="'+item.icon+'"':'';html+='<fresh-nav-item'+ic+(idx===0?' active':'')+' data-tax-idx="'+idx+'">'+(item.label||'')+'</fresh-nav-item>';});return html+'</fresh-nav-group>';}
function _applyNavPattern(){var cfg=_readNavCfg();var tax=_getTax(cfg);_currentPattern=cfg.nav_pattern||'persistent-sidebar';var navbar=document.getElementById('dme-topbar');var sidebar=document.getElementById('dme-sidebar');var tabStrip=document.getElementById('dme-tab-strip');sidebar.style.display='none';tabStrip.style.display='none';sidebar.removeAttribute('collapsed');navbar.removeAttribute('hamburger');_closeFlyout();document.getElementById('dme-tab-dropdown').classList.remove('open');if(_currentPattern==='persistent-sidebar'){sidebar.style.display='';document.getElementById('dme-nav-content').innerHTML=buildSidebarHtml(tax);}else if(_currentPattern==='collapsible-sidebar'){sidebar.style.display='';navbar.setAttribute('hamburger','');sidebar.setAttribute('collapsed','');document.getElementById('dme-nav-content').innerHTML=_buildIconRail(tax);}else if(_currentPattern==='top-nav-tabs'){tabStrip.style.display='';var tabsEl=document.getElementById('dme-top-tabs');tabsEl.setAttribute('tabs',buildTabsJson(tax));if(tax[0])tabsEl.setAttribute('active',tax[0].id);}}
function _closeFlyout(){_flyoutIdx=-1;document.getElementById('dme-icon-flyout').classList.remove('open');}
function _openFlyout(idx,anchorEl){var cfg=_readNavCfg();var tax=_getTax(cfg);var section=tax[idx];var kids=(section&&section.children)||[];if(!kids.length){_closeFlyout();return;}_flyoutIdx=idx;document.getElementById('dme-flyout-label').textContent=section.label||'';document.getElementById('dme-flyout-items').innerHTML=kids.map(function(child,ci){return'<div class="dme-flyout-item'+(ci===0?' active':'')+'">'+( child.label||'')+'</div>';}).join('');var rect=anchorEl.getBoundingClientRect();var flyout=document.getElementById('dme-icon-flyout');flyout.style.top=rect.top+'px';flyout.classList.add('open');requestAnimationFrame(function(){var fh=flyout.offsetHeight,vh=window.innerHeight;if(rect.top+fh>vh-8)flyout.style.top=Math.max(8,vh-fh-8)+'px';});}
var _tabDropKey=null,_tabPrevActive='',_tabClickX=0;
function _closeTabDrop(){_tabDropKey=null;document.getElementById('dme-tab-dropdown').classList.remove('open');}
function _openTabDrop(key,x){var cfg=_readNavCfg();var tax=_getTax(cfg);var item=null;for(var i=0;i<tax.length;i++){if(tax[i].id===key){item=tax[i];break;}}var kids=(item&&item.children)||[];if(!kids.length){_closeTabDrop();return;}_tabDropKey=key;var drop=document.getElementById('dme-tab-dropdown');var stripBot=document.getElementById('dme-tab-strip').getBoundingClientRect().bottom;drop.innerHTML=kids.map(function(child,ci){return'<div class="dme-tab-drop-item'+(ci===0?' active':'')+'">'+( child.label||'')+'</div>';}).join('');drop.style.top=stripBot+'px';drop.style.left='0';drop.classList.add('open');requestAnimationFrame(function(){var w=drop.offsetWidth,vw=window.innerWidth;drop.style.left=Math.max(8,Math.min(x-w/2,vw-w-8))+'px';});}
document.addEventListener('DOMContentLoaded',function(){_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();document.getElementById('dme-topbar').addEventListener('hamburger-click',function(){if(_currentPattern!=='collapsible-sidebar')return;var sb=document.getElementById('dme-sidebar');var tax=_getTax(_readNavCfg());if(sb.hasAttribute('collapsed')){sb.removeAttribute('collapsed');document.getElementById('dme-nav-content').innerHTML=buildSidebarHtml(tax);_closeFlyout();}else{sb.setAttribute('collapsed','');document.getElementById('dme-nav-content').innerHTML=_buildIconRail(tax);}});document.getElementById('dme-nav-content').addEventListener('nav-click',function(e){if(_currentPattern!=='collapsible-sidebar')return;var sb=document.getElementById('dme-sidebar');if(!sb.hasAttribute('collapsed'))return;var item=e.target;if(!item||item.tagName.toLowerCase()!=='fresh-nav-item')return;var idx=parseInt(item.dataset.taxIdx,10);if(isNaN(idx))return;Array.prototype.slice.call(document.querySelectorAll('#dme-nav-content fresh-nav-item')).forEach(function(el,i){if(i===idx)el.setAttribute('active','');else el.removeAttribute('active');});if(idx===_flyoutIdx){_closeFlyout();return;}_openFlyout(idx,item);});document.getElementById('dme-nav-content').addEventListener('click',function(e){e.stopPropagation();});document.getElementById('dme-icon-flyout').addEventListener('click',function(e){e.stopPropagation();});document.getElementById('dme-top-tabs').addEventListener('click',function(e){if(_currentPattern!=='top-nav-tabs')return;e.stopPropagation();var activeNow=this.getAttribute('active');var _btn=this.shadowRoot&&this.shadowRoot.querySelector('[data-key="'+activeNow+'"]');_tabClickX=_btn?_btn.getBoundingClientRect().left+_btn.getBoundingClientRect().width/2:e.clientX;if(activeNow!==_tabPrevActive){_tabPrevActive=activeNow;_openTabDrop(activeNow,_tabClickX);}else{if(_tabDropKey===activeNow)_closeTabDrop();else _openTabDrop(activeNow,_tabClickX);}});document.getElementById('dme-tab-dropdown').addEventListener('click',function(e){e.stopPropagation();});document.addEventListener('click',function(){_closeFlyout();_closeTabDrop();});document.addEventListener('keydown',function(e){if(e.key==='Escape'){_closeFlyout();_closeTabDrop();spClose();spCloseModal();}});});
window.addEventListener('storage',function(e){if(e.key!=='freshds-nav-cfg')return;_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();});
var _lastNavCfgStr=null;(function _poll(){var s=localStorage.getItem('freshds-nav-cfg')||'';if(s!==_lastNavCfgStr){_lastNavCfgStr=s;_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();}setTimeout(_poll,400);}());
window.addEventListener('pageshow',function(e){if(e.persisted){_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();}});
var SP_ZONES=[{key:'header',label:'Page header',el:'dme-header',on:true},{key:'content',label:'Page content',el:'dme-content',on:true}];
var SP_RULES={'LAYOUT':['Full app shell: dash-shell with fresh-navbar + fresh-sidebar from nav config.','dash-main: flex:1, overflow-y:auto, padding var(--space-5) var(--space-6).'],'PAGE HEADER':['dash-page-header: flex row, space-between, border-bottom. Title left, actions right.','Use fresh-button with appropriate variants for header actions.'],'CONTENT':['Wrap content sections in dash-card with dash-card-title.','Use FreshDS tokens for all spacing, color, and typography.']};
function spOpen(){document.getElementById('sp-panel').classList.add('open');document.getElementById('sp-panel').setAttribute('aria-hidden','false');_spRenderZones();_spRenderCats();var u=new URL(location.href);u.searchParams.set('spec','open');history.replaceState(null,'',u.toString());}
function spClose(){document.getElementById('sp-panel').classList.remove('open');document.getElementById('sp-panel').setAttribute('aria-hidden','true');var u=new URL(location.href);u.searchParams.delete('spec');history.replaceState(null,'',u.toString());}
function _spRenderZones(){var el=document.getElementById('sp-zones');el.innerHTML='';SP_ZONES.forEach(function(z){var row=document.createElement('div');row.className='sp-zone-row';row.innerHTML='<span class="sp-zone-label">'+z.label+'</span><label class="sp-toggle"><input type="checkbox"'+(z.on?' checked':'')+'><span class="sp-toggle-track"></span><span class="sp-toggle-thumb"></span></label>';row.querySelector('input').addEventListener('change',function(){z.on=this.checked;var t=document.getElementById(z.el);if(t)t.style.display=z.on?'':'none';});el.appendChild(row);});}
function _spRenderCats(){var el=document.getElementById('sp-cats');el.innerHTML='';Object.keys(SP_RULES).forEach(function(cat){var wrap=document.createElement('div');wrap.className='sp-cat';_spBuildCat(cat,wrap);el.appendChild(wrap);});}
function _spBuildCat(cat,wrap){wrap.innerHTML='';var label=document.createElement('div');label.className='sp-cat-label';label.textContent=cat;wrap.appendChild(label);SP_RULES[cat].forEach(function(rule,ri){wrap.appendChild(_spRuleRow(cat,ri,rule,wrap));});var addBtn=document.createElement('button');addBtn.className='sp-add-rule';addBtn.innerHTML='<i class="ti ti-plus"></i> Add rule';addBtn.addEventListener('click',function(){SP_RULES[cat].push('New rule');_spBuildCat(cat,wrap);var texts=wrap.querySelectorAll('.sp-rule-text');var last=texts[texts.length-1];if(last){last.focus();var r=document.createRange();r.selectNodeContents(last);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}});wrap.appendChild(addBtn);}
function _spRuleRow(cat,ri,text,wrap){var row=document.createElement('div');row.className='sp-rule';var dot=document.createElement('span');dot.className='sp-rule-dot';var span=document.createElement('span');span.className='sp-rule-text';span.contentEditable='true';span.textContent=text;span.addEventListener('input',function(){SP_RULES[cat][ri]=span.textContent;});var del=document.createElement('button');del.className='sp-rule-del';del.innerHTML='<i class="ti ti-trash"></i>';del.setAttribute('aria-label','Delete rule');del.addEventListener('click',function(){SP_RULES[cat].splice(ri,1);_spBuildCat(cat,wrap);});row.appendChild(dot);row.appendChild(span);row.appendChild(del);return row;}
function spShare(){var u=new URL(location.href);u.searchParams.set('spec','open');var btn=document.getElementById('sp-share-btn');navigator.clipboard.writeText(u.toString()).then(function(){var orig=btn.innerHTML;btn.innerHTML='<i class="ti ti-check"></i>';setTimeout(function(){btn.innerHTML=orig;},1800);}).catch(function(){});}
function spStartBuilding(){var lines=['Build this page using the FreshDS design system.',''];Object.keys(SP_RULES).forEach(function(cat){lines.push('## '+cat);SP_RULES[cat].forEach(function(rule){lines.push('- '+rule);});lines.push('');});lines.push('## ACTIVE ZONES');SP_ZONES.forEach(function(z){lines.push('- '+z.label+': '+(z.on?'SHOWN':'HIDDEN'));});document.getElementById('sp-modal-pre').textContent=lines.join('\n');document.getElementById('sp-modal-backdrop').classList.add('open');}
function spCloseModal(){document.getElementById('sp-modal-backdrop').classList.remove('open');}
function spCopyPrompt(){navigator.clipboard.writeText(document.getElementById('sp-modal-pre').textContent).then(function(){var ok=document.getElementById('sp-copy-ok');ok.classList.add('show');setTimeout(function(){ok.classList.remove('show');},1800);}).catch(function(){});}
if(new URL(location.href).searchParams.get('spec')==='open'){document.addEventListener('DOMContentLoaded',spOpen);}
</script>
</body>
</html>
