<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Deep-dive — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/dashboard.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
<style>
  /* Metric selector pills */
  .metric-pills {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
    margin-bottom: var(--space-5);
  }
  .metric-pill {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-full);
    border: 1.5px solid var(--surface-border);
    background: var(--surface-canvas);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 150ms;
  }
  .metric-pill.active {
    border-color: var(--color-interactive);
    background: var(--color-interactive-subtle);
    color: var(--color-interactive-text);
  }
  .metric-pill-dot {
    width: 8px; height: 8px;
    border-radius: var(--radius-full);
    background: currentColor;
    opacity: 0.7;
  }

  /* breakdown table-like list */
  .breakdown-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-2) 0;
  }
  .breakdown-label { font-size: 13px; color: var(--text-primary); flex: 1; }
  .breakdown-bar-wrap { width: 120px; height: 6px; background: var(--surface-border); border-radius: var(--radius-full); overflow: hidden; }
  .breakdown-bar { height: 100%; border-radius: var(--radius-full); background: var(--dv-1); }
  .breakdown-value { font-size: 13px; font-weight: 600; color: var(--text-primary); min-width: 48px; text-align: right; }
  .breakdown-pct { font-size: 11px; color: var(--text-tertiary); min-width: 36px; text-align: right; }
</style>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="dash-shell">

    <pattern-topbar logged-in></pattern-topbar>

    <div class="dash-body">

      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>

      <main class="dash-main">
        <div class="dash-page-header">
          <div>
            <div class="dash-page-title">Analytics Deep-dive</div>
            <div class="dash-page-subtitle">Detailed analysis of your product usage and growth.</div>
          </div>
          <div class="dash-page-actions">
            <fresh-button variant="secondary" size="sm"><i class="ti ti-calendar"></i> Last 90 days</fresh-button>
            <fresh-button variant="secondary" size="sm"><i class="ti ti-download"></i> Export CSV</fresh-button>
          </div>
        </div>

        <div class="dash-content">

          <!-- Metric selector -->
          <div class="metric-pills">
            <div class="metric-pill active"><span class="metric-pill-dot" style="color:var(--dv-1)"></span> Revenue</div>
            <div class="metric-pill"><span class="metric-pill-dot" style="color:var(--dv-2)"></span> Active users</div>
            <div class="metric-pill"><span class="metric-pill-dot" style="color:var(--dv-3)"></span> Signups</div>
            <div class="metric-pill"><span class="metric-pill-dot" style="color:var(--dv-4)"></span> Churn</div>
          </div>

          <!-- Main chart full-width -->
          <div style="margin-bottom:var(--space-4)">
            <fresh-chart title="Revenue — last 90 days" description="Compared against previous period (dashed)" height="220px">
              <svg viewBox="0 0 600 150" style="width:100%;height:100%;display:block;" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="a-rev-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--dv-1)" stop-opacity="0.18"/>
                    <stop offset="100%" stop-color="var(--dv-1)" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <!-- grid lines -->
                <line x1="0" y1="30"  x2="600" y2="30"  stroke="var(--surface-border)" stroke-width="1"/>
                <line x1="0" y1="70"  x2="600" y2="70"  stroke="var(--surface-border)" stroke-width="1"/>
                <line x1="0" y1="110" x2="600" y2="110" stroke="var(--surface-border)" stroke-width="1"/>
                <!-- fill -->
                <path d="M0,110 C40,105 80,98 120,90 C160,82 200,75 240,65 C280,55 320,50 360,42 C400,34 440,30 480,24 C520,18 560,15 600,10 L600,150 L0,150 Z" fill="url(#a-rev-grad)"/>
                <!-- line -->
                <path d="M0,110 C40,105 80,98 120,90 C160,82 200,75 240,65 C280,55 320,50 360,42 C400,34 440,30 480,24 C520,18 560,15 600,10" fill="none" stroke="var(--dv-1)" stroke-width="2.5" stroke-linecap="round"/>
                <!-- prev period dashed -->
                <path d="M0,125 C40,122 80,118 120,112 C160,106 200,100 240,95 C280,90 320,86 360,82 C400,78 440,75 480,70 C520,65 560,60 600,56" fill="none" stroke="var(--dv-1)" stroke-width="1.5" stroke-dasharray="5 3" stroke-linecap="round" opacity="0.4"/>
                <!-- y-axis labels -->
                <text x="4" y="28"  font-size="8" fill="var(--text-tertiary)">$60k</text>
                <text x="4" y="68"  font-size="8" fill="var(--text-tertiary)">$40k</text>
                <text x="4" y="108" font-size="8" fill="var(--text-tertiary)">$20k</text>
              </svg>
            </fresh-chart>
          </div>

          <!-- Breakdown + second chart -->
          <div class="dash-cols-2">
            <div class="dash-card">
              <div class="dash-card-title">Revenue by plan</div>
              <div class="dash-card-sub">Breakdown of total MRR by subscription tier</div>
              <div class="breakdown-row">
                <div class="breakdown-label">Enterprise</div>
                <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:72%"></div></div>
                <div class="breakdown-value">$34,790</div>
                <div class="breakdown-pct">72%</div>
              </div>
              <div class="breakdown-row">
                <div class="breakdown-label">Pro</div>
                <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:19%;opacity:0.7"></div></div>
                <div class="breakdown-value">$9,180</div>
                <div class="breakdown-pct">19%</div>
              </div>
              <div class="breakdown-row">
                <div class="breakdown-label">Starter</div>
                <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:9%;opacity:0.5"></div></div>
                <div class="breakdown-value">$4,350</div>
                <div class="breakdown-pct">9%</div>
              </div>
            </div>

            <fresh-chart title="User engagement" description="DAU / MAU ratio over 90 days" height="180px">
              <svg viewBox="0 0 300 120" style="width:100%;height:100%;display:block;" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="eng-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--dv-7)" stop-opacity="0.18"/>
                    <stop offset="100%" stop-color="var(--dv-7)" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <path d="M0,90 C30,85 60,80 90,72 C120,64 150,58 180,52 C210,46 240,42 300,36 L300,120 L0,120 Z" fill="url(#eng-grad)"/>
                <path d="M0,90 C30,85 60,80 90,72 C120,64 150,58 180,52 C210,46 240,42 300,36" fill="none" stroke="var(--dv-7)" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </fresh-chart>
          </div>

        </div>
      </main>

    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/data/fresh-avatar.js"></script>
<script src="../components/data/fresh-chart.js"></script>
</body>
</html>
