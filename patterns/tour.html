<style>
/* Logo switching */
.nav-logo-dark { display: none; }
[data-mode="dark"] .nav-logo-light { display: none; }
[data-mode="dark"] .nav-logo-dark  { display: block; }

/* Sidebar footer */
.tr-sidebar-footer { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-width: 0; }
.tr-sidebar-user-info { flex: 1; min-width: 0; overflow: hidden; }
.tr-sidebar-user-name { font-size: var(--font-size-sm); font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-sidebar-user-role { font-size: var(--font-size-xs); color: var(--text-tertiary); white-space: nowrap; }
fresh-sidebar[collapsed] .tr-sidebar-user-info { display: none; }

/* Icon rail flyout */
.tr-icon-flyout {
  position: fixed; left: 57px; top: 0; width: 200px;
  background: var(--surface-canvas); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  z-index: 90; display: none; overflow: hidden;
}
.tr-icon-flyout.open { display: block; }
.tr-flyout-label {
  padding: var(--space-2) var(--space-3) var(--space-1);
  font-size: var(--font-size-xs); font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text-tertiary);
  border-bottom: 1px solid var(--surface-border);
}
.tr-flyout-item {
  display: flex; align-items: center; padding: 7px var(--space-3);
  font-size: var(--font-size-sm); font-family: var(--font-sans);
  color: var(--text-secondary); cursor: pointer;
  transition: background 100ms, color 100ms; -webkit-font-smoothing: antialiased;
}
.tr-flyout-item:hover  { background: var(--surface-subtle); color: var(--text-primary); }
.tr-flyout-item.active { background: var(--nav-active-bg); color: var(--nav-active-text); font-weight: 500; }

/* Tab strip */
.tr-tab-strip {
  background: var(--surface-nav); border-bottom: 1px solid var(--surface-border);
  padding: 0 var(--space-5); display: flex; align-items: center;
  height: 44px; flex-shrink: 0;
}
.tr-tab-dropdown {
  position: fixed; top: 0; left: 0; min-width: 168px;
  background: var(--surface-canvas); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  z-index: 90; display: none; overflow: hidden; padding: var(--space-1) 0;
}
.tr-tab-dropdown.open { display: block; }
.tr-tab-drop-item {
  display: flex; align-items: center; padding: 7px var(--space-4);
  font-size: var(--font-size-sm); font-family: var(--font-sans);
  color: var(--text-secondary); cursor: pointer;
  transition: background 100ms, color 100ms; -webkit-font-smoothing: antialiased;
}
.tr-tab-drop-item:hover  { background: var(--surface-subtle); color: var(--text-primary); }
.tr-tab-drop-item.active { color: var(--nav-active-text); background: var(--nav-active-bg); font-weight: 500; }

/* Tour scrim — dims the background app shell */
.tr-scrim {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.48);
  z-index: 100;
  pointer-events: none;
  transition: opacity 300ms;
}
.tr-scrim.hidden { opacity: 0; pointer-events: none; }

/* Tour card — floats above the scrim */
.tr-card {
  position: fixed;
  z-index: 110;
  top: 88px;
  left: 272px;
  width: 400px;
  background: var(--surface-canvas);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: 0 24px 64px rgba(0,0,0,0.28), 0 4px 16px rgba(0,0,0,0.12);
  transition: opacity 220ms, transform 220ms;
}
.tr-card.hidden { opacity: 0; pointer-events: none; transform: translateY(8px); }

/* Responsive: card stays inset on smaller screens */
@media (max-width: 767px) {
  .tr-card { left: 24px; right: 24px; width: auto; top: 80px; }
}

.tr-step-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--color-interactive-text);
  margin-bottom: var(--space-3);
}
.tr-title {
  font-size: 20px; font-weight: 700; color: var(--text-primary);
  letter-spacing: -0.03em; line-height: 1.25;
  margin-bottom: var(--space-3);
}
.tr-body {
  font-size: var(--font-size-md); color: var(--text-secondary);
  line-height: 1.6; margin-bottom: var(--space-6);
}
.tr-footer {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
}
.tr-dots { display: flex; align-items: center; gap: 6px; }
.tr-dot {
  width: 8px; height: 8px; border-radius: var(--radius-full);
  background: var(--surface-border-strong);
  transition: width 200ms, background 200ms;
}
.tr-dot.active { width: 20px; background: var(--color-interactive); }
.tr-actions { display: flex; align-items: center; gap: var(--space-3); }
.tr-skip-btn {
  font-size: var(--font-size-sm); font-weight: 500; color: var(--text-tertiary);
  background: none; border: none; cursor: pointer; padding: 0;
  font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  transition: color 150ms;
}
.tr-skip-btn:hover { color: var(--text-secondary); }

/* Spec trigger */</style>

<script>
/* ── Nav pattern router ──────────────────────────────────── */

var _currentPattern = 'persistent-sidebar';
var _flyoutIdx = -1;

function _readNavCfg() {
  var cfg = { nav_pattern: 'persistent-sidebar', taxonomy: [] };
  try { var s = localStorage.getItem('freshds-nav-cfg'); if (s) Object.assign(cfg, JSON.parse(s)); } catch(e) {}
  return cfg;
}

function _getTax(cfg) {
  return (Array.isArray(cfg.taxonomy) && cfg.taxonomy.length > 0)
    ? cfg.taxonomy
    : (typeof DEFAULT_TAXONOMY !== 'undefined' ? DEFAULT_TAXONOMY : []);
}

function _buildIconRail(tax) {
  var html = '<fresh-nav-group label="Nav" open>';
  tax.forEach(function(item, idx) {
    var ic = item.icon ? ' icon="' + item.icon + '"' : '';
    html += '<fresh-nav-item' + ic + (idx === 0 ? ' active' : '') +
            ' data-tax-idx="' + idx + '">' + (item.label || '') + '</fresh-nav-item>';
  });
  return html + '</fresh-nav-group>';
}

function _applyNavPattern() {
  var cfg  = _readNavCfg();
  var tax  = _getTax(cfg);
  _currentPattern = cfg.nav_pattern || 'persistent-sidebar';

  var navbar   = document.getElementById('tr-topbar');
  var sidebar  = document.getElementById('tr-sidebar');
  var tabStrip = document.getElementById('tr-tab-strip');

  sidebar.style.display  = 'none';
  tabStrip.style.display = 'none';
  sidebar.removeAttribute('collapsed');
  sidebar.style.position=''; sidebar.style.zIndex=''; sidebar.style.height='100%'; sidebar.style.width='';
  (function(){var b=document.getElementById('_hd-bd');if(b)b.style.display='none';})();
  navbar.removeAttribute('hamburger');
  _closeFlyout();
  document.getElementById('tr-tab-dropdown').classList.remove('open');

  if (_currentPattern === 'persistent-sidebar') {
    sidebar.style.display = '';
    document.getElementById('tr-nav-content').innerHTML = buildSidebarHtml(tax);
  } else if (_currentPattern === 'collapsible-sidebar') {
    sidebar.style.display = '';
    navbar.setAttribute('hamburger', '');
    sidebar.setAttribute('collapsed', '');
    document.getElementById('tr-nav-content').innerHTML = _buildIconRail(tax);
  } else if (_currentPattern === 'top-nav-tabs') {
    tabStrip.style.display = '';
    var tabsEl = document.getElementById('tr-top-tabs');
    tabsEl.setAttribute('tabs', buildTabsJson(tax));
    if (tax[0]) tabsEl.setAttribute('active', tax[0].id);
  } else if (_currentPattern === 'dual-level') {
    tabStrip.style.display = '';
    sidebar.style.display = '';
    var _dtabs = tabStrip.querySelector('fresh-topbar-menu');
    var _dnc   = document.getElementById(sidebar.id.replace('-sidebar','-nav-content'));
    _dtabs.setAttribute('tabs', buildTabsJson(tax));
    if (tax[0]) _dtabs.setAttribute('active', tax[0].id);
    _dnc.innerHTML = buildDualLevelSections(tax);
    var _dswitch = function(key) {
      _dnc.querySelectorAll('.section-nav').forEach(function(el) {
        el.style.display = el.id === ('snav-' + key) ? 'contents' : 'none';
      });
      var _da = _dnc.querySelector('#snav-' + key);
      sidebar.style.display = (_da && _da.dataset.hasChildren === '1') ? '' : 'none';
    };
    _dswitch(tax[0] ? tax[0].id : '');
    if (!_dtabs._dlWired) {
      _dtabs._dlWired = true;
      _dtabs.addEventListener('change', function(e) { _dswitch(e.detail.key); });
    }
  } else if (_currentPattern === 'hamburger-drawer') {
    navbar.setAttribute('hamburger', '');
    document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML = buildSidebarHtml(tax);
    (function(){var b=document.getElementById('_hd-bd');if(b)b.style.display='none';})();
  } else if (_currentPattern === 'command-palette') {
    sidebar.style.display = '';
    sidebar.setAttribute('collapsed', '');
    document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML = _buildIconRail(tax);
  } else {
    sidebar.style.display = '';
    document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML = buildSidebarHtml(tax);
  }
}

function _closeFlyout() {
  _flyoutIdx = -1;
  document.getElementById('tr-icon-flyout').classList.remove('open');
}

function _openFlyout(idx, anchorEl) {
  var cfg     = _readNavCfg();
  var tax     = _getTax(cfg);
  var section = tax[idx];
  var kids    = (section && section.children) || [];
  if (!kids.length) { _closeFlyout(); return; }
  _flyoutIdx = idx;
  document.getElementById('tr-flyout-label').textContent = section.label || '';
  document.getElementById('tr-flyout-items').innerHTML = kids.map(function(child, ci) {
    return '<div class="tr-flyout-item' + (ci === 0 ? ' active' : '') + '">' + (child.label || '') + '</div>';
  }).join('');
  var rect   = anchorEl.getBoundingClientRect();
  var flyout = document.getElementById('tr-icon-flyout');
  flyout.style.top = rect.top + 'px';
  flyout.classList.add('open');
  requestAnimationFrame(function() {
    var fh = flyout.offsetHeight, vh = window.innerHeight;
    if (rect.top + fh > vh - 8) flyout.style.top = Math.max(8, vh - fh - 8) + 'px';
  });
}

var _tabDropKey = null, _tabPrevActive = '', _tabClickX = 0;

function _closeTabDrop() {
  _tabDropKey = null;
  document.getElementById('tr-tab-dropdown').classList.remove('open');
}

function _openTabDrop(key, x) {
  var cfg  = _readNavCfg();
  var tax  = _getTax(cfg);
  var item = null;
  for (var i = 0; i < tax.length; i++) { if (tax[i].id === key) { item = tax[i]; break; } }
  var kids = (item && item.children) || [];
  if (!kids.length) { _closeTabDrop(); return; }
  _tabDropKey = key;
  var drop     = document.getElementById('tr-tab-dropdown');
  var stripBot = document.getElementById('tr-tab-strip').getBoundingClientRect().bottom;
  drop.innerHTML = kids.map(function(child, ci) {
    return '<div class="tr-tab-drop-item' + (ci === 0 ? ' active' : '') + '">' + (child.label || '') + '</div>';
  }).join('');
  drop.style.top = stripBot + 'px';
  drop.style.left = '0';
  drop.classList.add('open');
  requestAnimationFrame(function() {
    var w = drop.offsetWidth, vw = window.innerWidth;
    drop.style.left = Math.max(8, Math.min(x - w / 2, vw - w - 8)) + 'px';
  });
}

document.addEventListener('DOMContentLoaded', function() {
  _applyNavPattern();
  if (window.FreshNavApply) window.FreshNavApply.apply();

  document.getElementById('tr-topbar').addEventListener('hamburger-click', function() {
    if (_currentPattern !== 'collapsible-sidebar' && _currentPattern !== 'hamburger-drawer') return;
    var sb  = document.getElementById('tr-sidebar');
    var tax = _getTax(_readNavCfg());
    if (_currentPattern === 'hamburger-drawer') {
      var _hdbd=document.getElementById('_hd-bd');
      if (!_hdbd) {
        _hdbd=document.createElement('div');_hdbd.id='_hd-bd';
        _hdbd.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99;display:none';
        var _sbRef=sb;
        _hdbd.addEventListener('click',function(){_sbRef.style.display='none';_sbRef.style.position='';_sbRef.style.zIndex='';_sbRef.style.height='100%';_sbRef.style.width='';_hdbd.style.display='none';});
        document.body.appendChild(_hdbd);
      }
      var _hdopen=sb.style.display!=='none';
      if (_hdopen){sb.style.display='none';sb.style.position='';sb.style.zIndex='';sb.style.height='100%';sb.style.width='';_hdbd.style.display='none';}
      else{sb.style.display='';sb.style.position='fixed';sb.style.left='0';sb.style.top='0';sb.style.height='100vh';sb.style.width='var(--sidebar-w,240px)';sb.style.zIndex='100';_hdbd.style.display='';}
      return;
    }
    if (sb.hasAttribute('collapsed')) {
      sb.removeAttribute('collapsed');
      document.getElementById('tr-nav-content').innerHTML = buildSidebarHtml(tax);
      _closeFlyout();
    } else {
      sb.setAttribute('collapsed', '');
      document.getElementById('tr-nav-content').innerHTML = _buildIconRail(tax);
    }
  });

  document.getElementById('tr-nav-content').addEventListener('nav-click', function(e) {
    if (_currentPattern !== 'collapsible-sidebar' && _currentPattern !== 'command-palette') return;
    var sb = document.getElementById('tr-sidebar');
    if (!sb.hasAttribute('collapsed')) return;
    var item = e.target;
    if (!item || item.tagName.toLowerCase() !== 'fresh-nav-item') return;
    var idx = parseInt(item.dataset.taxIdx, 10);
    if (isNaN(idx)) return;
    Array.prototype.slice.call(document.querySelectorAll('#tr-nav-content fresh-nav-item'))
      .forEach(function(el, i) { if (i === idx) el.setAttribute('active', ''); else el.removeAttribute('active'); });
    if (idx === _flyoutIdx) { _closeFlyout(); return; }
    _openFlyout(idx, item);
  });
  document.getElementById('tr-nav-content').addEventListener('click', function(e) { e.stopPropagation(); });
  document.getElementById('tr-icon-flyout').addEventListener('click', function(e) { e.stopPropagation(); });

  document.getElementById('tr-top-tabs').addEventListener('mousedown', function(e) { _tabClickX = e.clientX; });
  document.getElementById('tr-top-tabs').addEventListener('click', function(e) {
    if (_currentPattern !== 'top-nav-tabs') return;
    e.stopPropagation();
    var activeNow = this.getAttribute('active');
    var _btn = this.shadowRoot && this.shadowRoot.querySelector('[data-key="' + activeNow + '"]');
    _tabClickX = _btn ? _btn.getBoundingClientRect().left + _btn.getBoundingClientRect().width / 2 : e.clientX;
    if (activeNow !== _tabPrevActive) {
      _tabPrevActive = activeNow;
      _openTabDrop(activeNow, _tabClickX);
    } else {
      if (_tabDropKey === activeNow) _closeTabDrop();
      else _openTabDrop(activeNow, _tabClickX);
    }
  });
  document.getElementById('tr-tab-dropdown').addEventListener('click', function(e) { e.stopPropagation(); });

  document.addEventListener('click', function() { _closeFlyout(); _closeTabDrop(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { _closeFlyout(); _closeTabDrop(); spClose(); spCloseModal(); }
  });

  tourRender();
});

window.addEventListener('storage', function(e) {
  if (e.key !== 'freshds-nav-cfg') return;
  _applyNavPattern();
  if (window.FreshNavApply) window.FreshNavApply.apply();
});

var _lastNavCfgStr = null;
(function _poll() {
  var s = localStorage.getItem('freshds-nav-cfg') || '';
  if (s !== _lastNavCfgStr) {
    _lastNavCfgStr = s;
    _applyNavPattern();
    if (window.FreshNavApply) window.FreshNavApply.apply();
  }
  setTimeout(_poll, 400);
}());

window.addEventListener('pageshow', function(e) {
  if (e.persisted) {
    _applyNavPattern();
    if (window.FreshNavApply) window.FreshNavApply.apply();
  }
});

/* ── Tour logic ──────────────────────────────────────────── */

var TR_STEPS = [
  {
    title: 'Welcome to your workspace',
    body: 'Here\'s a quick look at how things work. We\'ll walk you through the key parts of Acme — it only takes a minute.'
  },
  {
    title: 'Stay on top of notifications',
    body: 'The bell icon shows you new mentions, comments, and activity in real time. Click it any time to see what\'s new.'
  },
  {
    title: 'Invite your team',
    body: 'Collaboration works best with everyone on board. Head to Settings to invite teammates and assign the right roles.'
  },
  {
    title: 'Customise your workspace',
    body: 'Adjust your layout, nav pattern, and theme from the navigation designer. Changes apply instantly across all pages.'
  }
];

var _tourStep = 0;

function tourRender() {
  var total = TR_STEPS.length;
  var step  = TR_STEPS[_tourStep];

  document.getElementById('tr-step-label').textContent = 'STEP ' + (_tourStep + 1) + ' OF ' + total;
  document.getElementById('tr-title').textContent = step.title;
  document.getElementById('tr-body').textContent  = step.body;

  /* Dots */
  var dotsEl = document.getElementById('tr-dots');
  dotsEl.innerHTML = '';
  for (var i = 0; i < total; i++) {
    var d = document.createElement('div');
    d.className = 'tr-dot' + (i === _tourStep ? ' active' : '');
    dotsEl.appendChild(d);
  }

  /* Buttons */
  var skipBtn = document.getElementById('tr-skip-btn');
  var nextBtn = document.getElementById('tr-next-btn');
  var isLast  = _tourStep === total - 1;
  skipBtn.style.display = isLast ? 'none' : '';
  nextBtn.innerHTML = isLast
    ? 'Done <i class="ti ti-check"></i>'
    : 'Next <i class="ti ti-arrow-right"></i>';
}

function tourNext() {
  if (_tourStep < TR_STEPS.length - 1) {
    _tourStep++;
    tourRender();
  } else {
    tourDismiss();
  }
}

function tourSkip() { tourDismiss(); }

function tourDismiss() {
  document.getElementById('tr-card').classList.add('hidden');
  document.getElementById('tr-scrim').classList.add('hidden');
}

/* ── Spec panel ──────────────────────────────────────────── */

var SP_ZONES = [
  { key: 'scrim',   label: 'Background scrim',  el: 'tr-scrim', on: true },
  { key: 'card',    label: 'Tour card',          el: 'tr-card',  on: true }
];

var SP_RULES = {
  'LAYOUT': [
    'The tour card floats above a semi-transparent scrim that dims the full app shell.',
    'The card is fixed-positioned at top: 88px, left: 272px — clear of the navbar (52px) and sidebar (240px) with 32px breathing room from each.',
    'Card width is 400px. On mobile (below 768px), it stretches edge to edge with 24px inset on both sides.',
    'The card must never touch any viewport edge — maintain at least 24px from all borders.'
  ],
  'SCRIM': [
    'Use rgba(0,0,0,0.48) for the scrim overlay. This value dims the background without fully hiding it.',
    'The scrim covers the full viewport (position: fixed; inset: 0) at z-index: 100.',
    'Do not make the scrim clickable — the tour card controls dismissal via Skip and Done buttons only.'
  ],
  'TOUR CARD': [
    'Step label: uppercase, 11px, 700 weight, letter-spacing 0.09em, color-interactive-text.',
    'Title: 20px, 700 weight, letter-spacing -0.03em, text-primary.',
    'Body: md font size, text-secondary, line-height 1.6.',
    'Footer: progress dots on the left, [Skip tour] text + [Next →] primary button on the right.',
    'On the final step, hide Skip tour and change the button label to Done with a checkmark icon.',
    'Progress dots: inactive = 8x8px circle in surface-border-strong. Active = 20px wide pill in color-interactive.'
  ],
  'STEPS': [
    'Keep step count between 3 and 6. More than 6 steps significantly reduces completion rates.',
    'Each step should focus on a single feature or action — one idea per card.',
    'Order steps from most general (welcome, orientation) to most specific (single feature callouts).',
    'The final step should be affirming and signal completion, not introduce new information.'
  ]
};

function spOpen() {
  document.getElementById('sp-panel').classList.add('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'false');
  _spRenderZones();
  _spRenderCats();
  var u = new URL(location.href); u.searchParams.set('spec', 'open');
  history.replaceState(null, '', u.toString());
}

function spClose() {
  document.getElementById('sp-panel').classList.remove('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'true');
  var u = new URL(location.href); u.searchParams.delete('spec');
  history.replaceState(null, '', u.toString());
}

function _spRenderZones() {
  var el = document.getElementById('sp-zones'); el.innerHTML = '';
  SP_ZONES.forEach(function(z) {
    var row = document.createElement('div'); row.className = 'sp-zone-row';
    row.innerHTML = '<span class="sp-zone-label">' + z.label + '</span>' +
      '<label class="sp-toggle"><input type="checkbox"' + (z.on ? ' checked' : '') + '>' +
      '<span class="sp-toggle-track"></span><span class="sp-toggle-thumb"></span></label>';
    row.querySelector('input').addEventListener('change', function() {
      z.on = this.checked;
      var t = document.getElementById(z.el); if (t) t.style.display = z.on ? '' : 'none';
    });
    el.appendChild(row);
  });
}

function _spRenderCats() {
  var el = document.getElementById('sp-cats'); el.innerHTML = '';
  Object.keys(SP_RULES).forEach(function(cat) {
    var wrap = document.createElement('div'); wrap.className = 'sp-cat';
    _spBuildCat(cat, wrap); el.appendChild(wrap);
  });
}

function _spBuildCat(cat, wrap) {
  wrap.innerHTML = '';
  var label = document.createElement('div'); label.className = 'sp-cat-label'; label.textContent = cat;
  wrap.appendChild(label);
  SP_RULES[cat].forEach(function(rule, ri) { wrap.appendChild(_spRuleRow(cat, ri, rule, wrap)); });
  var addBtn = document.createElement('button'); addBtn.className = 'sp-add-rule';
  addBtn.innerHTML = '<i class="ti ti-plus"></i> Add rule';
  addBtn.addEventListener('click', function() {
    SP_RULES[cat].push('New rule'); _spBuildCat(cat, wrap);
    var texts = wrap.querySelectorAll('.sp-rule-text'); var last = texts[texts.length - 1];
    if (last) { last.focus(); var r = document.createRange(); r.selectNodeContents(last); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
  wrap.appendChild(addBtn);
}

function _spRuleRow(cat, ri, text, wrap) {
  var row  = document.createElement('div'); row.className = 'sp-rule';
  var dot  = document.createElement('span'); dot.className = 'sp-rule-dot';
  var span = document.createElement('span'); span.className = 'sp-rule-text';
  span.contentEditable = 'true'; span.textContent = text;
  span.addEventListener('input', function() { SP_RULES[cat][ri] = span.textContent; });
  var del  = document.createElement('button'); del.className = 'sp-rule-del';
  del.innerHTML = '<i class="ti ti-trash"></i>'; del.setAttribute('aria-label', 'Delete rule');
  del.addEventListener('click', function() { SP_RULES[cat].splice(ri, 1); _spBuildCat(cat, wrap); });
  row.appendChild(dot); row.appendChild(span); row.appendChild(del);
  return row;
}

function spShare() {
  var u = new URL(location.href); u.searchParams.set('spec', 'open');
  var btn = document.getElementById('sp-share-btn');
  navigator.clipboard.writeText(u.toString()).then(function() {
    var orig = btn.innerHTML; btn.innerHTML = '<i class="ti ti-check"></i>';
    setTimeout(function() { btn.innerHTML = orig; }, 1800);
  }).catch(function() {});
}

function spStartBuilding() {
  var lines = ['Build a product tour overlay using the FreshDS design system.', ''];
  Object.keys(SP_RULES).forEach(function(cat) {
    lines.push('## ' + cat);
    SP_RULES[cat].forEach(function(rule) { lines.push('- ' + rule); });
    lines.push('');
  });
  lines.push('## ACTIVE ZONES');
  SP_ZONES.forEach(function(z) { lines.push('- ' + z.label + ': ' + (z.on ? 'SHOWN' : 'HIDDEN')); });
  document.getElementById('sp-modal-pre').textContent = lines.join('\n');
  document.getElementById('sp-modal-backdrop').classList.add('open');
}

function spCloseModal() { document.getElementById('sp-modal-backdrop').classList.remove('open'); }

function spCopyPrompt() {
  navigator.clipboard.writeText(document.getElementById('sp-modal-pre').textContent).then(function() {
    var ok = document.getElementById('sp-copy-ok'); ok.classList.add('show');
    setTimeout(function() { ok.classList.remove('show'); }, 1800);
  }).catch(function() {});
}

if (new URL(location.href).searchParams.get('spec') === 'open') {
  document.addEventListener('DOMContentLoaded', spOpen);
}
</script>
</body>
</html>
