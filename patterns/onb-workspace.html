<div id="app">

  <div class="demo-bar" id="demo-bar">

        <div slot="footer" class="ows-sidebar-footer">

          <div class="ows-sidebar-user-info">

            <div class="ows-sidebar-user-role">Admin</div>

        <div class="ows-flyout-label" id="ows-flyout-label"></div>
        <div id="ows-flyout-items"></div>
      </div>
    <div class="onb-body">
      <div class="onb-wrap">

        <div class="onb-stepper">
          <fresh-stepper step="4" steps='[
            {"label":"Role"},
            {"label":"Use case"},
            {"label":"Profile"},
            {"label":"Workspace"},
            {"label":"Team"},
            {"label":"Integrations"}
          ]'></fresh-stepper>
        </div>

        <div class="onb-eyebrow">Step 4 of 6</div>
        <h1 class="onb-title">Set up your workspace</h1>
        <p class="onb-sub">This is your team's home in Acme. You can always change this later.</p>

        <div class="onb-field-stack">
          <div class="onb-field">
            <label class="onb-label" for="workspace-name">Workspace name</label>
            <fresh-input id="workspace-name" value="Acme Design Team" autocomplete="organization"></fresh-input>
          </div>

          <div class="onb-field">
            <label class="onb-label" for="workspace-slug">Workspace URL</label>
            <div class="slug-row">
              <span class="slug-prefix">acme.app/</span>
              <input class="slug-input" id="workspace-slug" type="text" value="acme-design" placeholder="your-workspace" spellcheck="false" autocomplete="off">
            </div>
            <div class="onb-field-hint">Only lowercase letters, numbers, and hyphens.</div>
          </div>

          <div class="onb-field-row">
            <div class="onb-field">
              <label class="onb-label" for="team-size">Team size</label>
              <fresh-select id="team-size">
                <option value="">Select…</option>
                <option value="1" selected>Just me</option>
                <option value="2-10">2–10 people</option>
                <option value="11-50">11–50 people</option>
                <option value="51-200">51–200 people</option>
                <option value="200+">200+ people</option>
              </fresh-select>
            </div>
            <div class="onb-field">
              <label class="onb-label" for="industry">Industry</label>
              <fresh-select id="industry">
                <option value="">Select…</option>
                <option value="tech" selected>Technology / SaaS</option>
                <option value="fintech">Fintech</option>
                <option value="healthcare">Healthcare</option>
                <option value="ecommerce">E-commerce</option>
                <option value="media">Media / Publishing</option>
                <option value="edu">Education</option>
                <option value="agency">Agency / Consulting</option>
                <option value="other">Other</option>
              </fresh-select>
            </div>
          </div>
        </div>

        <div class="onb-nav">
          <fresh-button variant="ghost"><i class="ti ti-arrow-left"></i> Back</fresh-button>
          <fresh-button variant="primary">Continue <i class="ti ti-arrow-right"></i></fresh-button>
        </div>

      </div>
    </div>
    </div>
  </div>

<script>
var _currentPattern='persistent-sidebar',_flyoutIdx=-1;
function _readNavCfg(){var cfg={nav_pattern:'persistent-sidebar',taxonomy:[]};try{var s=localStorage.getItem('freshds-nav-cfg');if(s)Object.assign(cfg,JSON.parse(s));}catch(e){}return cfg;}
function _getTax(cfg){return(Array.isArray(cfg.taxonomy)&&cfg.taxonomy.length>0)?cfg.taxonomy:(typeof DEFAULT_TAXONOMY!=='undefined'?DEFAULT_TAXONOMY:[]);}
function _buildIconRail(tax){var html='<fresh-nav-group label="Nav" open>';tax.forEach(function(item,idx){var ic=item.icon?' icon="'+item.icon+'"':'';html+='<fresh-nav-item'+ic+(idx===0?' active':'')+' data-tax-idx="'+idx+'">'+(item.label||'')+'</fresh-nav-item>';});return html+'</fresh-nav-group>';}
function _applyNavPattern(){var cfg=_readNavCfg();var tax=_getTax(cfg);_currentPattern=cfg.nav_pattern||'persistent-sidebar';var navbar=document.getElementById('ows-topbar');var sidebar=document.getElementById('ows-sidebar');var tabStrip=document.getElementById('ows-tab-strip');sidebar.style.display='none';tabStrip.style.display='none';sidebar.removeAttribute('collapsed');navbar.removeAttribute('hamburger');_closeFlyout();document.getElementById('ows-tab-dropdown').classList.remove('open');if(_currentPattern==='persistent-sidebar'){sidebar.style.display='';document.getElementById('ows-nav-content').innerHTML=buildSidebarHtml(tax);}else if(_currentPattern==='collapsible-sidebar'){sidebar.style.display='';navbar.setAttribute('hamburger','');document.getElementById('ows-nav-content').innerHTML=buildSidebarHtml(tax);}else if(_currentPattern==='top-nav-tabs'){tabStrip.style.display='';var tabsEl=document.getElementById('ows-top-tabs');tabsEl.setAttribute('tabs',buildTabsJson(tax));if(tax[0])tabsEl.setAttribute('active',tax[0].id);}}

function _openFlyout(idx,anchorEl){var cfg=_readNavCfg();var tax=_getTax(cfg);var section=tax[idx];var kids=(section&&section.children)||[];if(!kids.length){_closeFlyout();return;}_flyoutIdx=idx;document.getElementById('ows-flyout-label').textContent=section.label||'';document.getElementById('ows-flyout-items').innerHTML=kids.map(function(child,ci){return'<div class="ows-flyout-item'+(ci===0?' active':'')+'">'+( child.label||'')+'</div>';}).join('');var rect=anchorEl.getBoundingClientRect();var flyout=document.getElementById('ows-icon-flyout');flyout.style.top=rect.top+'px';flyout.classList.add('open');requestAnimationFrame(function(){var fh=flyout.offsetHeight,vh=window.innerHeight;if(rect.top+fh>vh-8)flyout.style.top=Math.max(8,vh-fh-8)+'px';});}
var _tabDropKey=null,_tabPrevActive='',_tabClickX=0;
function _closeTabDrop(){_tabDropKey=null;document.getElementById('ows-tab-dropdown').classList.remove('open');}
function _openTabDrop(key,x){var cfg=_readNavCfg();var tax=_getTax(cfg);var item=null;for(var i=0;i<tax.length;i++){if(tax[i].id===key){item=tax[i];break;}}var kids=(item&&item.children)||[];if(!kids.length){_closeTabDrop();return;}_tabDropKey=key;var drop=document.getElementById('ows-tab-dropdown');var stripBot=document.getElementById('ows-tab-strip').getBoundingClientRect().bottom;drop.innerHTML=kids.map(function(child,ci){return'<div class="ows-tab-drop-item'+(ci===0?' active':'')+'">'+( child.label||'')+'</div>';}).join('');drop.style.top=stripBot+'px';drop.style.left='0';drop.classList.add('open');requestAnimationFrame(function(){var w=drop.offsetWidth,vw=window.innerWidth;drop.style.left=Math.max(8,Math.min(x-w/2,vw-w-8))+'px';});}
document.addEventListener('DOMContentLoaded',function(){_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();document.getElementById('ows-topbar').addEventListener('hamburger-click',function(){if(_currentPattern!=='collapsible-sidebar')return;var sb=document.getElementById('ows-sidebar');var tax=_getTax(_readNavCfg());if(sb.hasAttribute('collapsed')){sb.removeAttribute('collapsed');document.getElementById('ows-nav-content').innerHTML=buildSidebarHtml(tax);_closeFlyout();}else{sb.setAttribute('collapsed','');document.getElementById('ows-nav-content').innerHTML=_buildIconRail(tax);}});document.getElementById('ows-nav-content').addEventListener('nav-click',function(e){if(_currentPattern!=='collapsible-sidebar')return;var sb=document.getElementById('ows-sidebar');if(!sb.hasAttribute('collapsed'))return;var item=e.target;if(!item||item.tagName.toLowerCase()!=='fresh-nav-item')return;var idx=parseInt(item.dataset.taxIdx,10);if(isNaN(idx))return;Array.prototype.slice.call(document.querySelectorAll('#ows-nav-content fresh-nav-item')).forEach(function(el,i){if(i===idx)el.setAttribute('active','');else el.removeAttribute('active');});if(idx===_flyoutIdx){_closeFlyout();return;}_openFlyout(idx,item);});document.getElementById('ows-nav-content').addEventListener('click',function(e){e.stopPropagation();});document.getElementById('ows-icon-flyout').addEventListener('click',function(e){e.stopPropagation();});document.getElementById('ows-top-tabs').addEventListener('click',function(e){if(_currentPattern!=='top-nav-tabs')return;_tabClickX=e.clientX;e.stopPropagation();var activeNow=this.getAttribute('active');if(activeNow!==_tabPrevActive){_tabPrevActive=activeNow;_openTabDrop(activeNow,_tabClickX);}else{if(_tabDropKey===activeNow)_closeTabDrop();else _openTabDrop(activeNow,_tabClickX);}});document.getElementById('ows-tab-dropdown').addEventListener('click',function(e){e.stopPropagation();});document.addEventListener('click',function(){_closeFlyout();_closeTabDrop();});document.addEventListener('keydown',function(e){if(e.key==='Escape'){_closeFlyout();_closeTabDrop();spClose();spCloseModal();}});});
window.addEventListener('storage',function(e){if(e.key!=='freshds-nav-cfg')return;_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();});
var _lastNavCfgStr=null;(function _poll(){var s=localStorage.getItem('freshds-nav-cfg')||'';if(s!==_lastNavCfgStr){_lastNavCfgStr=s;_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();}setTimeout(_poll,400);}());
window.addEventListener('pageshow',function(e){if(e.persisted){_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();}});
var SP_ZONES=[{key:'header',label:'Page header',el:'ows-header',on:true},{key:'content',label:'Page content',el:'ows-content',on:true}];
var SP_RULES={'LAYOUT':['Full app shell: dash-shell with fresh-navbar + fresh-sidebar from nav config.','dash-main: flex:1, overflow-y:auto, padding var(--space-5) var(--space-6).'],'PAGE HEADER':['dash-page-header: flex row, space-between, border-bottom. Title left, actions right.','Use fresh-button with appropriate variants for header actions.'],'CONTENT':['Wrap content sections in dash-card with dash-card-title.','Use FreshDS tokens for all spacing, color, and typography.']};
function spOpen(){document.getElementById('sp-panel').classList.add('open');document.getElementById('sp-panel').setAttribute('aria-hidden','false');_spRenderZones();_spRenderCats();var u=new URL(location.href);u.searchParams.set('spec','open');history.replaceState(null,'',u.toString());}
function spClose(){document.getElementById('sp-panel').classList.remove('open');document.getElementById('sp-panel').setAttribute('aria-hidden','true');var u=new URL(location.href);u.searchParams.delete('spec');history.replaceState(null,'',u.toString());}
function _spRenderZones(){var el=document.getElementById('sp-zones');el.innerHTML='';SP_ZONES.forEach(function(z){var row=document.createElement('div');row.className='sp-zone-row';row.innerHTML='<span class="sp-zone-label">'+z.label+'</span><label class="sp-toggle"><input type="checkbox"'+(z.on?' checked':'')+'><span class="sp-toggle-track"></span><span class="sp-toggle-thumb"></span></label>';row.querySelector('input').addEventListener('change',function(){z.on=this.checked;var t=document.getElementById(z.el);if(t)t.style.display=z.on?'':'none';});el.appendChild(row);});}
function _spRenderCats(){var el=document.getElementById('sp-cats');el.innerHTML='';Object.keys(SP_RULES).forEach(function(cat){var wrap=document.createElement('div');wrap.className='sp-cat';_spBuildCat(cat,wrap);el.appendChild(wrap);});}
function _spBuildCat(cat,wrap){wrap.innerHTML='';var label=document.createElement('div');label.className='sp-cat-label';label.textContent=cat;wrap.appendChild(label);SP_RULES[cat].forEach(function(rule,ri){wrap.appendChild(_spRuleRow(cat,ri,rule,wrap));});var addBtn=document.createElement('button');addBtn.className='sp-add-rule';addBtn.innerHTML='<i class="ti ti-plus"></i> Add rule';addBtn.addEventListener('click',function(){SP_RULES[cat].push('New rule');_spBuildCat(cat,wrap);var texts=wrap.querySelectorAll('.sp-rule-text');var last=texts[texts.length-1];if(last){last.focus();var r=document.createRange();r.selectNodeContents(last);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}});wrap.appendChild(addBtn);}
function _spRuleRow(cat,ri,text,wrap){var row=document.createElement('div');row.className='sp-rule';var dot=document.createElement('span');dot.className='sp-rule-dot';var span=document.createElement('span');span.className='sp-rule-text';span.contentEditable='true';span.textContent=text;span.addEventListener('input',function(){SP_RULES[cat][ri]=span.textContent;});var del=document.createElement('button');del.className='sp-rule-del';del.innerHTML='<i class="ti ti-trash"></i>';del.setAttribute('aria-label','Delete rule');del.addEventListener('click',function(){SP_RULES[cat].splice(ri,1);_spBuildCat(cat,wrap);});row.appendChild(dot);row.appendChild(span);row.appendChild(del);return row;}
function spShare(){var u=new URL(location.href);u.searchParams.set('spec','open');var btn=document.getElementById('sp-share-btn');navigator.clipboard.writeText(u.toString()).then(function(){var orig=btn.innerHTML;btn.innerHTML='<i class="ti ti-check"></i>';setTimeout(function(){btn.innerHTML=orig;},1800);}).catch(function(){});}
function spStartBuilding(){var lines=['Build this page using the FreshDS design system.',''];Object.keys(SP_RULES).forEach(function(cat){lines.push('## '+cat);SP_RULES[cat].forEach(function(rule){lines.push('- '+rule);});lines.push('');});lines.push('## ACTIVE ZONES');SP_ZONES.forEach(function(z){lines.push('- '+z.label+': '+(z.on?'SHOWN':'HIDDEN'));});document.getElementById('sp-modal-pre').textContent=lines.join('\n');document.getElementById('sp-modal-backdrop').classList.add('open');}
function spCloseModal(){document.getElementById('sp-modal-backdrop').classList.remove('open');}
function spCopyPrompt(){navigator.clipboard.writeText(document.getElementById('sp-modal-pre').textContent).then(function(){var ok=document.getElementById('sp-copy-ok');ok.classList.add('show');setTimeout(function(){ok.classList.remove('show');},1800);}).catch(function(){});}
if(new URL(location.href).searchParams.get('spec')==='open'){document.addEventListener('DOMContentLoaded',spOpen);}
</script>
</body>
