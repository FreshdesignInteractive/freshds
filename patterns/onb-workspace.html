<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace Setup — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/onboarding.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
<style>
  .slug-row {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--surface-input);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .slug-row:focus-within {
    border-color: var(--color-interactive);
    box-shadow: 0 0 0 3px var(--color-interactive-subtle);
  }
  .slug-prefix {
    padding: 0 var(--space-3);
    font-size: var(--text-sm);
    color: var(--text-secondary);
    white-space: nowrap;
    border-right: 1px solid var(--surface-border);
    background: var(--surface-subtle);
    height: 38px;
    display: flex;
    align-items: center;
    user-select: none;
  }
  .slug-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    padding: 0 var(--space-3);
    font-size: var(--text-sm);
    font-family: var(--font-mono, 'JetBrains Mono', monospace);
    color: var(--text-primary);
    height: 38px;
  }
  .slug-input::placeholder {
    color: var(--text-tertiary);
  }
  .onb-field-hint {
    font-size: var(--text-xs);
    color: var(--text-secondary);
    margin-top: var(--space-1);
  }
</style>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="onb-page">
    <pattern-topbar logged-in></pattern-topbar>

    <div class="page-body-row">
      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>
    <div class="onb-body">
      <div class="onb-wrap">

        <div class="onb-stepper">
          <fresh-stepper step="4" steps='[
            {"label":"Role"},
            {"label":"Use case"},
            {"label":"Profile"},
            {"label":"Workspace"},
            {"label":"Team"},
            {"label":"Integrations"}
          ]'></fresh-stepper>
        </div>

        <div class="onb-eyebrow">Step 4 of 6</div>
        <h1 class="onb-title">Set up your workspace</h1>
        <p class="onb-sub">This is your team's home in Acme. You can always change this later.</p>

        <div class="onb-field-stack">
          <div class="onb-field">
            <label class="onb-label" for="workspace-name">Workspace name</label>
            <fresh-input id="workspace-name" value="Acme Design Team" autocomplete="organization"></fresh-input>
          </div>

          <div class="onb-field">
            <label class="onb-label" for="workspace-slug">Workspace URL</label>
            <div class="slug-row">
              <span class="slug-prefix">acme.app/</span>
              <input class="slug-input" id="workspace-slug" type="text" value="acme-design" placeholder="your-workspace" spellcheck="false" autocomplete="off">
            </div>
            <div class="onb-field-hint">Only lowercase letters, numbers, and hyphens.</div>
          </div>

          <div class="onb-field-row">
            <div class="onb-field">
              <label class="onb-label" for="team-size">Team size</label>
              <fresh-select id="team-size">
                <option value="">Select…</option>
                <option value="1" selected>Just me</option>
                <option value="2-10">2–10 people</option>
                <option value="11-50">11–50 people</option>
                <option value="51-200">51–200 people</option>
                <option value="200+">200+ people</option>
              </fresh-select>
            </div>
            <div class="onb-field">
              <label class="onb-label" for="industry">Industry</label>
              <fresh-select id="industry">
                <option value="">Select…</option>
                <option value="tech" selected>Technology / SaaS</option>
                <option value="fintech">Fintech</option>
                <option value="healthcare">Healthcare</option>
                <option value="ecommerce">E-commerce</option>
                <option value="media">Media / Publishing</option>
                <option value="edu">Education</option>
                <option value="agency">Agency / Consulting</option>
                <option value="other">Other</option>
              </fresh-select>
            </div>
          </div>
        </div>

        <div class="onb-nav">
          <fresh-button variant="ghost"><i class="ti ti-arrow-left"></i> Back</fresh-button>
          <fresh-button variant="primary">Continue <i class="ti ti-arrow-right"></i></fresh-button>
        </div>

      </div>
    </div>
    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-select.js"></script>
<script src="../components/navigation/fresh-stepper.js"></script>
</body>
</html>
