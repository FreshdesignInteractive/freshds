<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule Builder — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/dashboard.css">
<link rel="stylesheet" href="../styles/patterns/workflow.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="dash-shell">

    <pattern-topbar logged-in></pattern-topbar>

    <div class="dash-body">

      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>

      <main class="dash-main">

        <div class="dash-page-header" style="flex-shrink:0;">
          <div>
            <div class="dash-page-title">Lead Scoring Rule</div>
            <div class="dash-page-subtitle">Automatically score leads based on activity and attributes</div>
          </div>
          <div class="dash-page-actions">
            <fresh-badge variant="success">Active</fresh-badge>
            <fresh-button variant="secondary" size="sm"><i class="ti ti-player-pause"></i> Pause</fresh-button>
            <fresh-button variant="primary" size="sm"><i class="ti ti-device-floppy"></i> Save</fresh-button>
          </div>
        </div>

        <div class="wf-rules-wrap">

          <!-- Rule metadata -->
          <div class="wf-step-card">
            <div class="wf-form-grid">
              <div>
                <fresh-form-field label="Rule name" required>
                  <fresh-input slot="input" value="Lead Scoring Rule"></fresh-input>
                </fresh-form-field>
              </div>
              <div>
                <fresh-form-field label="Object type">
                  <fresh-select slot="input">
                    <option selected>Contact</option>
                    <option>Deal</option>
                    <option>Company</option>
                  </fresh-select>
                </fresh-form-field>
              </div>
              <div class="wf-form-full">
                <fresh-form-field label="Description">
                  <fresh-input slot="input" value="Score leads based on firmographics, intent signals, and engagement."></fresh-input>
                </fresh-form-field>
              </div>
            </div>
          </div>

          <!-- IF section -->
          <div class="wf-rule-section">
            <div class="wf-rule-section-header">
              <span class="wf-rule-section-label"><i class="ti ti-git-fork" style="margin-right:var(--space-1);"></i> IF — Conditions</span>
              <fresh-button variant="ghost" size="sm"><i class="ti ti-plus"></i> Add group</fresh-button>
            </div>
            <div class="wf-rule-section-body">

              <!-- Group 1: Firmographic -->
              <div class="wf-condition-group">
                <div class="wf-condition-group-header">
                  <span style="font-size:11px;font-weight:600;color:var(--text-secondary);">Group 1 — Firmographic</span>
                  <button class="wf-condition-logic-badge">ALL</button>
                  <span style="font-size:11px;color:var(--text-tertiary);">must match</span>
                  <fresh-button variant="ghost" size="sm" style="margin-left:auto;"><i class="ti ti-trash" style="color:var(--color-danger-text);"></i></fresh-button>
                </div>
                <div class="wf-condition-row">
                  <div class="wf-condition-field">
                    <fresh-select>
                      <option selected>Company size</option>
                      <option>Industry</option>
                      <option>Revenue</option>
                    </fresh-select>
                  </div>
                  <div class="wf-condition-op">
                    <fresh-select><option selected>is greater than</option><option>is</option></fresh-select>
                  </div>
                  <div class="wf-condition-val">
                    <fresh-input value="50" placeholder="Value"></fresh-input>
                  </div>
                  <button class="wf-condition-del"><i class="ti ti-x"></i></button>
                </div>
                <div class="wf-condition-connector"><span>AND</span></div>
                <div class="wf-condition-row">
                  <div class="wf-condition-field">
                    <fresh-select>
                      <option>Company size</option>
                      <option selected>Industry</option>
                    </fresh-select>
                  </div>
                  <div class="wf-condition-op">
                    <fresh-select><option selected>is one of</option><option>is not</option></fresh-select>
                  </div>
                  <div class="wf-condition-val">
                    <fresh-input value="SaaS, Fintech, Healthcare" placeholder="Values (comma separated)"></fresh-input>
                  </div>
                  <button class="wf-condition-del"><i class="ti ti-x"></i></button>
                </div>
                <div class="wf-add-condition-row">
                  <fresh-button variant="ghost" size="sm"><i class="ti ti-plus"></i> Add condition</fresh-button>
                </div>
              </div>

              <!-- Group connector -->
              <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);">
                <div style="flex:1;height:1px;background:var(--surface-border);"></div>
                <button class="wf-condition-logic-badge" style="background:var(--color-warning-subtle);color:var(--color-warning-text);">OR</button>
                <div style="flex:1;height:1px;background:var(--surface-border);"></div>
              </div>

              <!-- Group 2: Engagement -->
              <div class="wf-condition-group">
                <div class="wf-condition-group-header">
                  <span style="font-size:11px;font-weight:600;color:var(--text-secondary);">Group 2 — Engagement signals</span>
                  <button class="wf-condition-logic-badge">ANY</button>
                  <span style="font-size:11px;color:var(--text-tertiary);">must match</span>
                  <fresh-button variant="ghost" size="sm" style="margin-left:auto;"><i class="ti ti-trash" style="color:var(--color-danger-text);"></i></fresh-button>
                </div>
                <div class="wf-condition-row">
                  <div class="wf-condition-field">
                    <fresh-select>
                      <option selected>Page visits (30d)</option>
                      <option>Email opens</option>
                      <option>Demo requested</option>
                    </fresh-select>
                  </div>
                  <div class="wf-condition-op">
                    <fresh-select><option selected>≥</option><option>></option><option>&lt;</option></fresh-select>
                  </div>
                  <div class="wf-condition-val">
                    <fresh-input value="5" placeholder="Value"></fresh-input>
                  </div>
                  <button class="wf-condition-del"><i class="ti ti-x"></i></button>
                </div>
                <div class="wf-condition-connector"><span>OR</span></div>
                <div class="wf-condition-row">
                  <div class="wf-condition-field">
                    <fresh-select>
                      <option>Page visits</option>
                      <option selected>Demo requested</option>
                    </fresh-select>
                  </div>
                  <div class="wf-condition-op">
                    <fresh-select><option selected>is true</option></fresh-select>
                  </div>
                  <div class="wf-condition-val">
                    <fresh-input value="" placeholder="(boolean — no value needed)" disabled></fresh-input>
                  </div>
                  <button class="wf-condition-del"><i class="ti ti-x"></i></button>
                </div>
                <div class="wf-add-condition-row">
                  <fresh-button variant="ghost" size="sm"><i class="ti ti-plus"></i> Add condition</fresh-button>
                </div>
              </div>

            </div>
          </div>

          <!-- THEN section -->
          <div class="wf-rule-section">
            <div class="wf-rule-section-header">
              <span class="wf-rule-section-label"><i class="ti ti-bolt" style="margin-right:var(--space-1);"></i> THEN — Actions</span>
              <fresh-button variant="ghost" size="sm"><i class="ti ti-plus"></i> Add action</fresh-button>
            </div>
            <div class="wf-rule-section-body">

              <div class="wf-action-row">
                <div class="wf-action-num">1</div>
                <div class="wf-action-body">
                  <div class="wf-form-grid" style="grid-template-columns:1fr 1fr 1fr;">
                    <fresh-form-field label="Action type">
                      <fresh-select slot="input">
                        <option selected>Set field value</option>
                        <option>Send email</option>
                        <option>Add to sequence</option>
                      </fresh-select>
                    </fresh-form-field>
                    <fresh-form-field label="Field">
                      <fresh-select slot="input">
                        <option selected>Lead score</option>
                        <option>Status</option>
                        <option>Owner</option>
                      </fresh-select>
                    </fresh-form-field>
                    <fresh-form-field label="Value">
                      <fresh-input slot="input" value="85"></fresh-input>
                    </fresh-form-field>
                  </div>
                </div>
                <button class="wf-condition-del" style="margin-top:var(--space-4);"><i class="ti ti-x"></i></button>
              </div>

              <div class="wf-action-row">
                <div class="wf-action-num">2</div>
                <div class="wf-action-body">
                  <div class="wf-form-grid" style="grid-template-columns:1fr 1fr 1fr;">
                    <fresh-form-field label="Action type">
                      <fresh-select slot="input">
                        <option>Set field value</option>
                        <option selected>Send notification</option>
                      </fresh-select>
                    </fresh-form-field>
                    <fresh-form-field label="Notify">
                      <fresh-select slot="input">
                        <option selected>Assigned owner</option>
                        <option>Sales team</option>
                        <option>Custom user</option>
                      </fresh-select>
                    </fresh-form-field>
                    <fresh-form-field label="Template">
                      <fresh-select slot="input">
                        <option selected>High-intent lead alert</option>
                      </fresh-select>
                    </fresh-form-field>
                  </div>
                </div>
                <button class="wf-condition-del" style="margin-top:var(--space-4);"><i class="ti ti-x"></i></button>
              </div>

            </div>
          </div>

        </div>

      </main>

    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-select.js"></script>
<script src="../components/core/fresh-form-field.js"></script>
<script src="../components/feedback/fresh-badge.js"></script>
</body>
</html>
