<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Setup — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/onboarding.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="onb-page">
    <pattern-topbar logged-in></pattern-topbar>

    <div class="page-body-row">
      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>
    <div class="onb-body">
      <div class="onb-wrap">

        <div class="onb-stepper">
          <fresh-stepper step="3" steps='[
            {"label":"Role"},
            {"label":"Use case"},
            {"label":"Profile"},
            {"label":"Workspace"},
            {"label":"Team"},
            {"label":"Integrations"}
          ]'></fresh-stepper>
        </div>

        <div class="onb-eyebrow">Step 3 of 6</div>
        <h1 class="onb-title">Set up your profile</h1>
        <p class="onb-sub">Let your teammates know who they're working with.</p>

        <div class="avatar-upload" style="margin-bottom:var(--space-6)">
          <div class="avatar-upload-placeholder" aria-hidden="true">
            <i class="ti ti-user"></i>
          </div>
          <div class="avatar-upload-info">
            <div class="avatar-upload-title">Profile photo</div>
            <div class="avatar-upload-sub">JPG, PNG or GIF · Max 5 MB</div>
          </div>
          <fresh-button variant="secondary" size="sm">Upload</fresh-button>
        </div>

        <div class="onb-field-stack">
          <div class="onb-field-row">
            <div class="onb-field">
              <label class="onb-label" for="first-name">First name</label>
              <fresh-input id="first-name" value="Jamie" autocomplete="given-name"></fresh-input>
            </div>
            <div class="onb-field">
              <label class="onb-label" for="last-name">Last name</label>
              <fresh-input id="last-name" value="Rivera" autocomplete="family-name"></fresh-input>
            </div>
          </div>
          <div class="onb-field">
            <label class="onb-label" for="job-title">Job title</label>
            <fresh-input id="job-title" placeholder="e.g. Product Designer" autocomplete="organization-title"></fresh-input>
          </div>
          <div class="onb-field">
            <label class="onb-label" for="timezone">Timezone</label>
            <fresh-select id="timezone">
              <option value="">Select your timezone…</option>
              <option value="pst" selected>Pacific Time (PT) — UTC-8</option>
              <option value="mst">Mountain Time (MT) — UTC-7</option>
              <option value="cst">Central Time (CT) — UTC-6</option>
              <option value="est">Eastern Time (ET) — UTC-5</option>
              <option value="gmt">Greenwich Mean Time (GMT)</option>
              <option value="cet">Central European Time (CET) — UTC+1</option>
              <option value="ist">India Standard Time (IST) — UTC+5:30</option>
            </fresh-select>
          </div>
        </div>

        <div class="onb-nav">
          <fresh-button variant="ghost"><i class="ti ti-arrow-left"></i> Back</fresh-button>
          <fresh-button variant="primary">Continue <i class="ti ti-arrow-right"></i></fresh-button>
        </div>

      </div>
    </div>
    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-select.js"></script>
<script src="../components/navigation/fresh-stepper.js"></script>
</body>
</html>
