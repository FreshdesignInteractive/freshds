<style>
/* Logo dark/light switching */
.nav-logo-dark { display: none; }
[data-mode="dark"] .nav-logo-light { display: none; }
[data-mode="dark"] .nav-logo-dark  { display: block; }

/* Sidebar footer */
.ct-sidebar-footer { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-width: 0; }
.ct-sidebar-user-info { flex: 1; min-width: 0; overflow: hidden; }
.ct-sidebar-user-name { font-size: var(--font-size-sm); font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-sidebar-user-role { font-size: var(--font-size-xs); color: var(--text-tertiary); white-space: nowrap; }
fresh-sidebar[collapsed] .ct-sidebar-user-info { display: none; }

/* Icon rail flyout (collapsible sidebar mode) */
.icon-flyout {
  position: fixed;
  left: 57px;
  top: 0;
  width: 200px;
  background: var(--surface-canvas);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  z-index: 90;
  display: none;
  overflow: hidden;
}
.icon-flyout.open { display: block; }
.icon-flyout-label {
  padding: var(--space-2) var(--space-3) var(--space-1);
  font-size: var(--font-size-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--surface-border);
}
.flyout-item {
  display: flex;
  align-items: center;
  padding: 7px var(--space-3);
  font-size: var(--font-size-sm);
  font-family: var(--font-sans);
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 100ms, color 100ms;
  -webkit-font-smoothing: antialiased;
}
.flyout-item:hover  { background: var(--surface-subtle); color: var(--text-primary); }
.flyout-item.active { background: var(--nav-active-bg); color: var(--nav-active-text); font-weight: 500; }

/* ── Spec trigger button ── */
.demo-spec-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 4px;
  border: none;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 150ms, color 150ms;
  -webkit-font-smoothing: antialiased;
}
.demo-spec-btn:hover { background: var(--surface-subtle); color: var(--text-primary); }
.demo-spec-btn i { font-size: 13px; }

/* ============================================================
   Spec panel -- hardcoded, never inherits DS tokens
   ============================================================ */
.sp-panel {
  position: fixed; top: 0; right: -340px; width: 320px; height: 100vh;
  display: flex; flex-direction: column; background: #141720;
  border-left: 1px solid #242836; z-index: 300;
  transition: right 280ms cubic-bezier(0.4, 0, 0.2, 1);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; color: #e8ecf4; font-size: 13px;
}
.sp-panel.open { right: 0; }
.sp-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; height: 52px; border-bottom: 1px solid #242836;
  flex-shrink: 0; background: #0f1219;
}
.sp-hdr-title { font-size: 13px; font-weight: 600; color: #e8ecf4; letter-spacing: -0.01em; }
.sp-hdr-close {
  width: 28px; height: 28px; border: none; border-radius: 6px;
  background: transparent; color: #6b7591; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: background 150ms, color 150ms;
}
.sp-hdr-close:hover { background: #1e2333; color: #e8ecf4; }
.sp-body { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a3049 transparent; }
.sp-body::-webkit-scrollbar { width: 4px; }
.sp-body::-webkit-scrollbar-thumb { background: #2a3049; border-radius: 4px; }
.sp-section { padding: 14px 0 4px; }
.sp-section + .sp-section { border-top: 1px solid #1c2030; padding-top: 16px; }
.sp-section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; color: #7282a8; padding: 0 16px 8px; }
.sp-zone { display: flex; align-items: center; gap: 9px; padding: 7px 16px; transition: background 120ms; }
.sp-zone:hover { background: #1a1f30; }
.sp-zone-num { display: none; }
.sp-zone-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sp-zone-name { flex: 1; font-size: 13px; font-weight: 500; color: #c5cede; min-width: 0; }
.sp-zone-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: #5c6b90; flex-shrink: 0; }
.sp-zone-badge.sp-req { color: #7c74ff; }
.sp-toggle { position: relative; width: 30px; height: 17px; flex-shrink: 0; }
.sp-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.sp-toggle-track { position: absolute; inset: 0; border-radius: 9px; background: #2a3049; cursor: pointer; transition: background 200ms; }
.sp-toggle input:checked + .sp-toggle-track { background: #6c63ff; }
.sp-toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #e8ecf4; transition: transform 200ms; }
.sp-toggle input:checked + .sp-toggle-track::after { transform: translateX(13px); }
.sp-rules-hdr { display: flex; align-items: center; gap: 8px; margin: 0 12px 4px; padding: 8px 12px; background: #1a1f30; border-radius: 8px; }
.sp-rules-hdr-icon { font-size: 13px; color: #6c63ff; flex-shrink: 0; }
.sp-rules-hdr-name { flex: 1; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #8b95b4; }
.sp-rules-hdr-hint { font-size: 10px; font-weight: 500; color: #6c63ff; }
.sp-cat { padding: 10px 16px 4px; }
.sp-cat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; color: #7282a8; margin-bottom: 6px; }
.sp-rule { display: flex; align-items: flex-start; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 5px; transition: background 120ms; }
.sp-rule:hover { background: #1c2134; }
.sp-rule:focus-within { background: rgba(140, 130, 255, 0.18); }
.sp-rule-dot { width: 5px; height: 5px; border-radius: 50%; background: #6c63ff; flex-shrink: 0; margin-top: 7px; }
.sp-rule-text { flex: 1; font-size: 12px; line-height: 1.6; color: #b0bace; outline: none; word-break: break-word; min-width: 0; cursor: text; }
.sp-rule-text:focus { color: #e8ecf4; }
.sp-rule-del { width: 22px; height: 22px; border: none; border-radius: 4px; background: transparent; color: #8890c0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; opacity: 0.45; flex-shrink: 0; margin-top: 2px; transition: opacity 150ms, background 150ms, color 150ms; }
.sp-rule:hover .sp-rule-del { opacity: 1; }
.sp-rule-del:hover { background: rgba(255,80,100,0.18); color: #ff6080; }
.sp-add-rule { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 3px 0; font-size: 11px; color: #6272a0; cursor: pointer; border: none; background: transparent; font-family: inherit; -webkit-font-smoothing: antialiased; transition: color 150ms; }
.sp-add-rule:hover { color: #9490ff; }
.sp-bottom { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-top: 1px solid #242836; background: #0f1219; flex-shrink: 0; }
.sp-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 6px; border: 1px solid #242836; background: #1a1f30; color: #9aa3be; font-size: 12px; font-weight: 500; font-family: inherit; -webkit-font-smoothing: antialiased; cursor: pointer; white-space: nowrap; transition: background 150ms, color 150ms, border-color 150ms; }
.sp-btn i { font-size: 12px; }
.sp-btn:hover { background: #1e2438; color: #e8ecf4; border-color: #3a4160; }
.sp-btn-icon { width: 34px; height: 34px; padding: 0; justify-content: center; flex-shrink: 0; }
.sp-btn-primary { margin-left: auto; background: #6c63ff; border-color: #6c63ff; color: #ffffff; }
.sp-btn-primary:hover { background: #7b74ff; border-color: #7b74ff; color: #ffffff; }
.sp-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 400; align-items: center; justify-content: center; }
.sp-modal-backdrop.open { display: flex; }
.sp-modal { background: #141720; border: 1px solid #242836; border-radius: 12px; width: 600px; max-width: calc(100vw - 40px); max-height: 80vh; display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.sp-modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #242836; font-size: 13px; font-weight: 600; color: #e8ecf4; flex-shrink: 0; }
.sp-modal-close { width: 26px; height: 26px; border: none; border-radius: 5px; background: transparent; color: #6b7591; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background 150ms, color 150ms; }
.sp-modal-close:hover { background: #1e2333; color: #e8ecf4; }
.sp-modal-body { flex: 1; overflow-y: auto; padding: 14px 16px; min-height: 220px; }
.sp-modal-pre { background: #0f1219; border: 1px solid #242836; border-radius: 8px; padding: 14px; font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 12px; line-height: 1.65; color: #9aa3be; white-space: pre-wrap; word-break: break-word; margin: 0; }
.sp-modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid #242836; flex-shrink: 0; }
.sp-copy-ok { font-size: 12px; color: #6c63ff; opacity: 0; transition: opacity 200ms; }
.sp-copy-ok.show { opacity: 1; }
</style>

<script>
/* ── Sidebar + flyout ────────────────────────────────────────── */
(function() {
  var _cfg = { nav_pattern: 'persistent-sidebar', taxonomy: [] };
  try {
    var s = localStorage.getItem('freshds-nav-cfg');
    if (s) Object.assign(_cfg, JSON.parse(s));
  } catch(e) {}
  var _tax = (Array.isArray(_cfg.taxonomy) && _cfg.taxonomy.length > 0)
    ? _cfg.taxonomy : DEFAULT_TAXONOMY;
  var _isCollapsible = _cfg.nav_pattern === 'collapsible-sidebar';

  var sidebar = document.getElementById('ct-sidebar');
  var _flyoutIdx = -1;

  function _buildIconRail(tax) {
    var html = '<fresh-nav-group label="Nav" open>';
    tax.forEach(function(item, idx) {
      var iconAttr = item.icon ? ' icon="' + item.icon + '"' : '';
      html += '<fresh-nav-item' + iconAttr + (idx === 0 ? ' active' : '') +
              ' data-tax-idx="' + idx + '">' + (item.label || '') + '</fresh-nav-item>';
    });
    return html + '</fresh-nav-group>';
  }

  /* Start expanded */
  document.getElementById('ct-nav-content').innerHTML = buildSidebarHtml(_tax);

  /* Flyout */
  function _closeFlyout() {
    _flyoutIdx = -1;
    document.getElementById('ct-flyout').classList.remove('open');
  }

  function _openFlyout(idx, anchorEl) {
    var section = _tax[idx];
    var kids = (section && section.children) || [];
    if (!kids.length) { _closeFlyout(); return; }
    _flyoutIdx = idx;
    document.getElementById('ct-flyout-label').textContent = section.label || '';
    document.getElementById('ct-flyout-items').innerHTML = kids.map(function(child, ci) {
      return '<div class="flyout-item' + (ci === 0 ? ' active' : '') + '">' + (child.label || '') + '</div>';
    }).join('');
    var rect = anchorEl.getBoundingClientRect();
    var flyout = document.getElementById('ct-flyout');
    flyout.style.top = rect.top + 'px';
    flyout.classList.add('open');
    requestAnimationFrame(function() {
      var fh = flyout.offsetHeight, vh = window.innerHeight;
      if (rect.top + fh > vh - 8) flyout.style.top = Math.max(8, vh - fh - 8) + 'px';
    });
  }

  function _setRailActive(idx) {
    Array.prototype.slice.call(document.querySelectorAll('#ct-nav-content fresh-nav-item'))
      .forEach(function(el, i) {
        if (i === idx) el.setAttribute('active', '');
        else el.removeAttribute('active');
      });
  }

  document.getElementById('ct-nav-content').addEventListener('nav-click', function(e) {
    if (!sidebar.hasAttribute('collapsed')) return;
    var item = e.target;
    if (!item || item.tagName.toLowerCase() !== 'fresh-nav-item') return;
    var idx = parseInt(item.dataset.taxIdx, 10);
    if (isNaN(idx)) return;
    _setRailActive(idx);
    if (idx === _flyoutIdx) { _closeFlyout(); return; }
    _openFlyout(idx, item);
  });

  document.getElementById('ct-nav-content').addEventListener('click', function(e) { e.stopPropagation(); });
  document.getElementById('ct-flyout').addEventListener('click', function(e) { e.stopPropagation(); });
  document.addEventListener('click', _closeFlyout);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') _closeFlyout(); });

  /* Hamburger: collapse to icon rail (collapsible) or just narrow (persistent) */
  document.getElementById('ct-topbar').addEventListener('hamburger-click', function() {
    if (sidebar.hasAttribute('collapsed')) {
      sidebar.removeAttribute('collapsed');
      document.getElementById('ct-nav-content').innerHTML = buildSidebarHtml(_tax);
      _closeFlyout();
    } else {
      sidebar.setAttribute('collapsed', '');
      if (_isCollapsible) {
        document.getElementById('ct-nav-content').innerHTML = _buildIconRail(_tax);
      }
    }
  });

  /* Auto-collapse on mobile */
  var mq = window.matchMedia('(max-width: 767px)');
  function onBreakpoint(e) {
    if (e.matches) {
      sidebar.setAttribute('collapsed', '');
      if (_isCollapsible) document.getElementById('ct-nav-content').innerHTML = _buildIconRail(_tax);
      _closeFlyout();
    }
  }
  mq.addEventListener('change', onBreakpoint);
  onBreakpoint(mq);

  /* Live reload when navigation designer changes */
  window.addEventListener('storage', function(e) {
    if (e.key !== 'freshds-nav-cfg') return;
    try {
      var newCfg = JSON.parse(e.newValue || '{}');
      if (Array.isArray(newCfg.taxonomy) && newCfg.taxonomy.length > 0) _tax = newCfg.taxonomy;
      _isCollapsible = newCfg.nav_pattern === 'collapsible-sidebar';
      var isCollapsed = sidebar.hasAttribute('collapsed');
      document.getElementById('ct-nav-content').innerHTML =
        (isCollapsed && _isCollapsible) ? _buildIconRail(_tax) : buildSidebarHtml(_tax);
      _closeFlyout();
    } catch(ex) {}
  });
}());

/* ── Zone toggles ────────────────────────────────────────────── */

function _zonePageHeader(on) {
  document.getElementById('ct-page-header').style.display = on ? '' : 'none';
}

function _zoneSearch(on) {
  var t = document.getElementById('ct-table');
  if (on) t.setAttribute('searchable', '');
  else    t.removeAttribute('searchable');
}

function _zoneBulkSelect(on) {
  var t = document.getElementById('ct-table');
  if (on) t.setAttribute('selectable', '');
  else    t.removeAttribute('selectable');
}

/* ── Spec data ───────────────────────────────────────────────── */

var SP_ZONES = [
  { id: 'page-header', name: 'Page Header',  required: true,  on: true, onToggle: _zonePageHeader },
  { id: 'search',      name: 'Search Bar',   required: false, on: true, onToggle: _zoneSearch     },
  { id: 'bulk-select', name: 'Row Selection',required: false, on: true, onToggle: _zoneBulkSelect }
];

var SP_ZONE_COLORS = ['#7c74ff', '#22c55e', '#f59e0b'];

var SP_RULES = {
  'LAYOUT': [
    'The shell is dash-shell (full-height column) with a navbar pinned at top and dash-body filling remaining height.',
    'The sidebar is always visible for logged-in state; nav_pattern in freshds-nav-cfg controls persistent vs. collapsible behavior.',
    'Persistent sidebar: 240px, always expanded. Collapsible sidebar: starts expanded, hamburger collapses to 56px icon rail with flyout sub-menus.',
    'dash-main holds the page header and dash-content; do not add extra wrapper divs between them.'
  ],
  'PAGE HEADER': [
    'The page header contains the page title, a subtitle (record count and a key aggregate), and action buttons.',
    'Use secondary variant for utility actions (Columns, Export, Filter); reserve primary for the single main CTA.',
    'The page title should describe the content set; subtitle should show count and a meaningful aggregate (e.g. pipeline value).'
  ],
  'TABLE': [
    'Always use fresh-data-table with the columns and data attributes; never build a raw HTML table.',
    'searchable attribute adds the built-in search bar; remove it to hide search entirely.',
    'selectable enables row checkboxes and reveals the bulk-actions slot when rows are selected; no custom toggle logic needed.',
    'Add sortable: true only to columns with meaningful sort order (numbers, dates, names); omit for badge/status columns.'
  ],
  'BULK ACTIONS': [
    'Bulk action buttons go in the slot="bulk-actions" div inside fresh-data-table.',
    'Use secondary variant for safe operations (Reassign, Update stage); use danger variant for destructive actions (Delete).',
    'The bulk bar appears and disappears automatically based on selection; do not add custom show/hide logic.'
  ]
};

/* ── Open / close ────────────────────────────────────────────── */

function _spApplyAllZones() {
  SP_ZONES.forEach(function(z) { if (z.onToggle) z.onToggle(z.on); });
}

function spOpen() {
  document.getElementById('sp-panel').classList.add('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'false');
  _spRenderZones();
  _spRenderCats();
  _spApplyAllZones();
  var u = new URL(location.href);
  u.searchParams.set('spec', 'open');
  history.replaceState(null, '', u.toString());
}

function spClose() {
  document.getElementById('sp-panel').classList.remove('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'true');
  var u = new URL(location.href);
  u.searchParams.delete('spec');
  history.replaceState(null, '', u.toString());
}

/* ── Zones ───────────────────────────────────────────────────── */

function _spRenderZones() {
  var el = document.getElementById('sp-zones');
  el.innerHTML = '';
  SP_ZONES.forEach(function(z, i) {
    var color = SP_ZONE_COLORS[i % SP_ZONE_COLORS.length];
    var row = document.createElement('div');
    row.className = 'sp-zone';
    var uid = 'spt-' + z.id;
    row.innerHTML =
      '<span class="sp-zone-num">' + (i + 1) + '</span>' +
      '<span class="sp-zone-dot" style="background:' + color + '"></span>' +
      '<span class="sp-zone-name">' + _spEsc(z.name) + '</span>' +
      '<span class="sp-zone-badge' + (z.required ? ' sp-req' : '') + '">' + (z.required ? 'Required' : 'Optional') + '</span>' +
      '<label class="sp-toggle" aria-label="Toggle ' + _spEsc(z.name) + '">' +
        '<input type="checkbox" id="' + uid + '"' + (z.on ? ' checked' : '') + (z.required ? ' disabled' : '') + '>' +
        '<span class="sp-toggle-track"></span>' +
      '</label>';
    (function(zone) {
      row.querySelector('input[type="checkbox"]').addEventListener('change', function(e) {
        zone.on = e.target.checked;
        if (zone.onToggle) zone.onToggle(zone.on);
      });
    })(z);
    el.appendChild(row);
  });
}

/* ── Rules ───────────────────────────────────────────────────── */

function _spRenderCats() {
  var el = document.getElementById('sp-cats');
  el.innerHTML = '';
  Object.keys(SP_RULES).forEach(function(cat) {
    var wrap = document.createElement('div');
    wrap.className = 'sp-cat';
    _spBuildCat(cat, wrap);
    el.appendChild(wrap);
  });
}

function _spBuildCat(cat, wrap) {
  wrap.innerHTML = '';
  var label = document.createElement('div');
  label.className = 'sp-cat-label';
  label.textContent = cat;
  wrap.appendChild(label);
  SP_RULES[cat].forEach(function(rule, ri) {
    wrap.appendChild(_spRuleRow(cat, ri, rule, wrap));
  });
  var addBtn = document.createElement('button');
  addBtn.className = 'sp-add-rule';
  addBtn.innerHTML = '<i class="ti ti-plus"></i> Add rule';
  addBtn.addEventListener('click', function() {
    SP_RULES[cat].push('New rule');
    _spBuildCat(cat, wrap);
    var texts = wrap.querySelectorAll('.sp-rule-text');
    var last = texts[texts.length - 1];
    if (last) {
      last.focus();
      var r = document.createRange();
      r.selectNodeContents(last);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
  });
  wrap.appendChild(addBtn);
}

function _spRuleRow(cat, ri, text, wrap) {
  var row = document.createElement('div');
  row.className = 'sp-rule';
  var dot = document.createElement('span');
  dot.className = 'sp-rule-dot';
  var span = document.createElement('span');
  span.className = 'sp-rule-text';
  span.contentEditable = 'true';
  span.textContent = text;
  span.addEventListener('input', function() { SP_RULES[cat][ri] = span.textContent; });
  var del = document.createElement('button');
  del.className = 'sp-rule-del';
  del.innerHTML = '<i class="ti ti-trash"></i>';
  del.setAttribute('aria-label', 'Delete rule');
  del.addEventListener('click', function() {
    SP_RULES[cat].splice(ri, 1);
    _spBuildCat(cat, wrap);
  });
  row.appendChild(dot);
  row.appendChild(span);
  row.appendChild(del);
  return row;
}

/* ── Share ───────────────────────────────────────────────────── */

function spShare() {
  var u = new URL(location.href);
  u.searchParams.set('spec', 'open');
  var btn = document.getElementById('sp-share-btn');
  navigator.clipboard.writeText(u.toString()).then(function() {
    var orig = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-check"></i>';
    setTimeout(function() { btn.innerHTML = orig; }, 1800);
  }).catch(function() {});
}

/* ── Build prompt ────────────────────────────────────────────── */

function _spEsc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function spStartBuilding() {
  var activeZones = SP_ZONES.filter(function(z) { return z.on; }).map(function(z) { return z.name; });
  var lines = [
    'Build a data table page using the FreshDS design system.',
    '',
    'Active zones: ' + activeZones.join(', '),
    ''
  ];
  Object.keys(SP_RULES).forEach(function(cat) {
    lines.push('## ' + cat);
    SP_RULES[cat].forEach(function(rule) { lines.push('- ' + rule); });
    lines.push('');
  });
  document.getElementById('sp-modal-pre').textContent = lines.join('\n');
  document.getElementById('sp-modal-backdrop').classList.add('open');
}

function spCloseModal() {
  document.getElementById('sp-modal-backdrop').classList.remove('open');
}

function spCopyPrompt() {
  var text = document.getElementById('sp-modal-pre').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var ok = document.getElementById('sp-copy-ok');
    ok.classList.add('show');
    setTimeout(function() { ok.classList.remove('show'); }, 1800);
  }).catch(function() {});
}

/* Auto-open spec if URL param present */
if (new URL(location.href).searchParams.get('spec') === 'open') {
  document.addEventListener('DOMContentLoaded', spOpen);
}
</script>
</body>
</html>
