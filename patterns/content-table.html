<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Table | Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/dashboard.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
<style>
/* Logo switching */
.nav-logo-dark { display: none; }
[data-mode="dark"] .nav-logo-light { display: none; }
[data-mode="dark"] .nav-logo-dark  { display: block; }

/* Sidebar footer */
.ctb-sidebar-footer { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-width: 0; }
.ctb-sidebar-user-info { flex: 1; min-width: 0; overflow: hidden; }
.ctb-sidebar-user-name { font-size: var(--font-size-sm); font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctb-sidebar-user-role { font-size: var(--font-size-xs); color: var(--text-tertiary); white-space: nowrap; }
fresh-sidebar[collapsed] .ctb-sidebar-user-info { display: none; }

/* Icon rail flyout */
.ctb-icon-flyout {
  position: fixed; left: 57px; top: 0; width: 200px;
  background: var(--surface-canvas); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  z-index: 90; display: none; overflow: hidden;
}
.ctb-icon-flyout.open { display: block; }
.ctb-flyout-label {
  padding: var(--space-2) var(--space-3) var(--space-1);
  font-size: var(--font-size-xs); font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text-tertiary);
  border-bottom: 1px solid var(--surface-border);
}
.ctb-flyout-item {
  display: flex; align-items: center; padding: 7px var(--space-3);
  font-size: var(--font-size-sm); font-family: var(--font-sans);
  color: var(--text-secondary); cursor: pointer;
  transition: background 100ms, color 100ms; -webkit-font-smoothing: antialiased;
}
.ctb-flyout-item:hover  { background: var(--surface-subtle); color: var(--text-primary); }
.ctb-flyout-item.active { background: var(--nav-active-bg); color: var(--nav-active-text); font-weight: 500; }

/* Tab strip */
.ctb-tab-strip {
  background: var(--surface-nav); border-bottom: 1px solid var(--surface-border);
  padding: 0 var(--space-5); display: flex; align-items: center;
  height: 44px; flex-shrink: 0;
}
.ctb-tab-dropdown {
  position: fixed; top: 0; left: 0; min-width: 168px;
  background: var(--surface-canvas); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  z-index: 90; display: none; overflow: hidden; padding: var(--space-1) 0;
}
.ctb-tab-dropdown.open { display: block; }
.ctb-tab-drop-item {
  display: flex; align-items: center; padding: 7px var(--space-4);
  font-size: var(--font-size-sm); font-family: var(--font-sans);
  color: var(--text-secondary); cursor: pointer;
  transition: background 100ms, color 100ms; -webkit-font-smoothing: antialiased;
}
.ctb-tab-drop-item:hover  { background: var(--surface-subtle); color: var(--text-primary); }
.ctb-tab-drop-item.active { color: var(--nav-active-text); background: var(--nav-active-bg); font-weight: 500; }

/* Spec trigger */
.demo-spec-btn {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 4px;
  border: none; border-radius: var(--radius-full); background: transparent;
  color: var(--text-secondary); font-size: 12px; font-weight: 500;
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: background 150ms, color 150ms; -webkit-font-smoothing: antialiased;
}
.demo-spec-btn:hover { background: var(--surface-subtle); color: var(--text-primary); }
.demo-spec-btn i { font-size: 13px; }

/* ── Table layout ── */
.ctb-main-inner {
  flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}

/* Toolbar: search + selection inline */
.ctb-toolbar {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-5); flex-shrink: 0;
  border-bottom: 1px solid var(--surface-border);
}
.ctb-search-wrap {
  display: flex; align-items: center; gap: var(--space-2);
  background: var(--surface-canvas); border: 1px solid var(--surface-border);
  border-radius: var(--radius-full); padding: 0 var(--space-3);
  height: 34px; width: 280px; flex-shrink: 0;
  transition: border-color 150ms;
}
.ctb-search-wrap:focus-within { border-color: var(--color-interactive); }
.ctb-search-wrap i { color: var(--text-tertiary); font-size: 14px; flex-shrink: 0; }
.ctb-search-wrap input {
  border: none; outline: none; background: transparent;
  font-size: var(--font-size-sm); color: var(--text-primary);
  font-family: var(--font-sans); width: 100%;
}
.ctb-search-wrap input::placeholder { color: var(--text-tertiary); }

.ctb-sel-actions {
  display: none; align-items: center; gap: var(--space-3);
  margin-left: auto;
}
.ctb-sel-actions.visible { display: flex; }
.ctb-sel-count {
  font-size: var(--font-size-sm); font-weight: 500; color: var(--text-secondary);
}
.ctb-del-btn {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 0 var(--space-3); height: 32px;
  border: 1px solid var(--color-danger); border-radius: var(--radius-md);
  background: transparent; color: var(--color-danger-text);
  font-size: var(--font-size-sm); font-weight: 500;
  cursor: pointer; font-family: var(--font-sans);
  transition: background 150ms;
}
.ctb-del-btn:hover { background: var(--color-danger-subtle); }
.ctb-del-btn i { font-size: 13px; }

/* Table scroll wrapper */
.ctb-table-wrap {
  flex: 1; overflow: auto; min-height: 0;
}

/* Table */
.ctb-table {
  width: 100%; border-collapse: collapse; font-size: var(--font-size-sm);
  table-layout: fixed;
}
.ctb-table th,
.ctb-table td {
  text-align: left; padding: 0 var(--space-4);
  border-bottom: 1px solid var(--surface-border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  vertical-align: middle;
}
/* Checkbox col */
.ctb-table th:first-child,
.ctb-table td:first-child {
  width: 44px; padding: 0; text-align: center;
}
.ctb-table th { height: 40px; }
.ctb-table td { height: 52px; }
.ctb-table thead th {
  background: var(--surface-canvas);
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-tertiary);
  position: sticky; top: 0; z-index: 2;
  border-bottom: 1px solid var(--surface-border);
}
.ctb-table tbody tr { background: var(--surface-canvas); }
.ctb-table tbody tr:hover { background: var(--surface-subtle); }
.ctb-table tbody tr.selected { background: var(--color-interactive-subtle); }

/* Sort header button */
.ctb-sort-btn {
  display: inline-flex; align-items: center; gap: 4px;
  background: none; border: none; padding: 0;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-tertiary);
  cursor: pointer; font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
.ctb-sort-btn:hover { color: var(--text-primary); }
.ctb-sort-btn i { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
.ctb-sort-btn.asc i, .ctb-sort-btn.desc i { color: var(--color-interactive-text); }

/* Stage badge */
.ctb-stage {
  display: inline-flex; align-items: center;
  padding: 2px var(--space-2); border-radius: var(--radius-full);
  font-size: 11px; font-weight: 600;
}
.ctb-stage.proposal     { background: var(--color-info-subtle);    color: var(--color-info-text); }
.ctb-stage.negotiation  { background: var(--color-warning-subtle); color: var(--color-warning-text); }
.ctb-stage.discovery    { background: var(--surface-overlay);      color: var(--text-secondary); }
.ctb-stage.qualification{ background: var(--surface-overlay);      color: var(--text-secondary); }
.ctb-stage.closed-won   { background: var(--color-success-subtle); color: var(--color-success-text); }

/* Checkbox styling */
.ctb-check {
  width: 16px; height: 16px; cursor: pointer;
  accent-color: var(--color-interactive);
}

/* Empty state */
.ctb-empty {
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: var(--space-2);
  padding: var(--space-10); color: var(--text-tertiary);
  font-size: var(--font-size-sm);
}
.ctb-empty.visible { display: flex; }
.ctb-empty i { font-size: 28px; }

/* ── Spec panel ── */
.sp-panel { position: fixed; top: 0; right: -340px; width: 320px; height: 100vh; display: flex; flex-direction: column; background: #141720; border-left: 1px solid #242836; z-index: 300; transition: right 280ms cubic-bezier(0.4,0,0.2,1); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #e8ecf4; font-size: 13px; }
.sp-panel.open { right: 0; }
.sp-hdr { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 52px; border-bottom: 1px solid #242836; flex-shrink: 0; background: #0f1219; }
.sp-hdr-title { font-size: 13px; font-weight: 600; color: #e8ecf4; letter-spacing: -0.01em; }
.sp-hdr-close { width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #6b7591; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: background 150ms, color 150ms; }
.sp-hdr-close:hover { background: #1e2333; color: #e8ecf4; }
.sp-body { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a3049 transparent; }
.sp-body::-webkit-scrollbar { width: 4px; }
.sp-body::-webkit-scrollbar-thumb { background: #2a3049; border-radius: 4px; }
.sp-section { padding: 14px 0 4px; }
.sp-section + .sp-section { border-top: 1px solid #1c2030; padding-top: 16px; }
.sp-section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; color: #7282a8; padding: 0 16px 8px; }
.sp-zone-row { display: flex; align-items: center; gap: 10px; padding: 7px 16px; transition: background 120ms; }
.sp-zone-row:hover { background: #1a1f30; }
.sp-zone-label { flex: 1; font-size: 12px; font-weight: 500; color: #b0bace; }
.sp-toggle { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
.sp-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.sp-toggle-track { position: absolute; inset: 0; background: #2a3049; border-radius: 9px; transition: background 200ms; cursor: pointer; }
.sp-toggle input:checked + .sp-toggle-track { background: #6c63ff; }
.sp-toggle-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform 200ms; pointer-events: none; }
.sp-toggle input:checked ~ .sp-toggle-thumb { transform: translateX(14px); }
.sp-rules-hdr { display: flex; align-items: center; gap: 8px; margin: 0 12px 4px; padding: 8px 12px; background: #1a1f30; border-radius: 8px; }
.sp-rules-hdr-icon { font-size: 13px; color: #6c63ff; flex-shrink: 0; }
.sp-rules-hdr-name { flex: 1; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #8b95b4; }
.sp-rules-hdr-hint { font-size: 10px; font-weight: 500; color: #6c63ff; }
.sp-cat { padding: 10px 16px 4px; }
.sp-cat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; color: #7282a8; margin-bottom: 6px; }
.sp-rule { display: flex; align-items: flex-start; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 5px; transition: background 120ms; }
.sp-rule:hover { background: #1c2134; }
.sp-rule:focus-within { background: rgba(140,130,255,0.18); }
.sp-rule-dot { width: 5px; height: 5px; border-radius: 50%; background: #6c63ff; flex-shrink: 0; margin-top: 7px; }
.sp-rule-text { flex: 1; font-size: 12px; line-height: 1.6; color: #b0bace; outline: none; word-break: break-word; min-width: 0; cursor: text; }
.sp-rule-text:focus { color: #e8ecf4; }
.sp-rule-del { width: 22px; height: 22px; border: none; border-radius: 4px; background: transparent; color: #8890c0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; opacity: 0.45; flex-shrink: 0; margin-top: 2px; transition: opacity 150ms, background 150ms, color 150ms; }
.sp-rule:hover .sp-rule-del { opacity: 1; }
.sp-rule-del:hover { background: rgba(255,80,100,0.18); color: #ff6080; }
.sp-add-rule { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 3px 0; font-size: 11px; color: #6272a0; cursor: pointer; border: none; background: transparent; font-family: inherit; -webkit-font-smoothing: antialiased; transition: color 150ms; }
.sp-add-rule:hover { color: #9490ff; }
.sp-bottom { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-top: 1px solid #242836; background: #0f1219; flex-shrink: 0; }
.sp-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 6px; border: 1px solid #242836; background: #1a1f30; color: #9aa3be; font-size: 12px; font-weight: 500; font-family: inherit; -webkit-font-smoothing: antialiased; cursor: pointer; white-space: nowrap; transition: background 150ms, color 150ms, border-color 150ms; }
.sp-btn i { font-size: 12px; }
.sp-btn:hover { background: #1e2438; color: #e8ecf4; border-color: #3a4160; }
.sp-btn-icon { width: 34px; height: 34px; padding: 0; justify-content: center; flex-shrink: 0; }
.sp-btn-primary { margin-left: auto; background: #6c63ff; border-color: #6c63ff; color: #fff; }
.sp-btn-primary:hover { background: #7b74ff; border-color: #7b74ff; }
.sp-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 400; align-items: center; justify-content: center; }
.sp-modal-backdrop.open { display: flex; }
.sp-modal { background: #141720; border: 1px solid #242836; border-radius: 12px; width: 600px; max-width: calc(100vw - 40px); max-height: 80vh; display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.sp-modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #242836; font-size: 13px; font-weight: 600; color: #e8ecf4; flex-shrink: 0; }
.sp-modal-close { width: 26px; height: 26px; border: none; border-radius: 5px; background: transparent; color: #6b7591; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background 150ms, color 150ms; }
.sp-modal-close:hover { background: #1e2333; color: #e8ecf4; }
.sp-modal-body { flex: 1; overflow-y: auto; padding: 14px 16px; min-height: 220px; }
.sp-modal-pre { background: #0f1219; border: 1px solid #242836; border-radius: 8px; padding: 14px; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.65; color: #9aa3be; white-space: pre-wrap; word-break: break-word; margin: 0; }
.sp-modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid #242836; flex-shrink: 0; }
.sp-copy-ok { font-size: 12px; color: #6c63ff; opacity: 0; transition: opacity 200ms; }
.sp-copy-ok.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
      <div class="demo-sep"></div>
      <button class="demo-spec-btn" onclick="spOpen()" aria-label="Configure pattern">
        <i class="ti ti-layout-sidebar-right"></i> Configure
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="dash-shell">

    <fresh-navbar id="ctb-topbar" data-nav-logged-in>
      <div slot="actions" data-nav-actions-logged-in></div>
    </fresh-navbar>

    <div id="ctb-tab-strip" class="ctb-tab-strip" style="display:none;">
      <fresh-topbar-menu id="ctb-top-tabs"></fresh-topbar-menu>
    </div>
    <div class="ctb-tab-dropdown" id="ctb-tab-dropdown"></div>

    <div class="dash-body">

      <fresh-sidebar id="ctb-sidebar" style="display:none;flex-shrink:0;height:100%;overflow:hidden;">
        <div id="ctb-nav-content"></div>
        <div slot="footer" class="ctb-sidebar-footer">
          <fresh-avatar name="Jamie Rivera" size="sm"></fresh-avatar>
          <div class="ctb-sidebar-user-info">
            <div class="ctb-sidebar-user-name">Jamie Rivera</div>
            <div class="ctb-sidebar-user-role">Admin</div>
          </div>
        </div>
      </fresh-sidebar>

      <div class="ctb-icon-flyout" id="ctb-icon-flyout">
        <div class="ctb-flyout-label" id="ctb-flyout-label"></div>
        <div id="ctb-flyout-items"></div>
      </div>

      <main class="dash-main">

        <div class="dash-page-header" id="ctb-page-header">
          <div>
            <div class="dash-page-title">All deals</div>
            <div class="dash-page-subtitle">64 open deals · $2.4M pipeline value</div>
          </div>
          <div class="dash-page-actions">
            <fresh-button variant="secondary" size="sm"><i class="ti ti-columns"></i> Columns</fresh-button>
            <fresh-button variant="secondary" size="sm"><i class="ti ti-download"></i> Export</fresh-button>
            <fresh-button variant="primary" size="sm"><i class="ti ti-plus"></i> New deal</fresh-button>
          </div>
        </div>

        <div class="ctb-main-inner">

          <!-- Toolbar: search + inline selection actions -->
          <div class="ctb-toolbar" id="ctb-toolbar">
            <div class="ctb-search-wrap">
              <i class="ti ti-search"></i>
              <input type="text" id="ctb-search-input" placeholder="Search deals..." autocomplete="off">
            </div>
            <div class="ctb-sel-actions" id="ctb-sel-actions">
              <span class="ctb-sel-count" id="ctb-sel-count">0 selected</span>
              <button class="ctb-del-btn" onclick="deleteSelected()">
                <i class="ti ti-trash"></i> Delete
              </button>
            </div>
          </div>

          <!-- Table -->
          <div class="ctb-table-wrap" id="ctb-table-section">
            <table class="ctb-table" id="ctb-table">
              <colgroup>
                <col style="width:44px">
                <col style="width:22%">
                <col style="width:16%">
                <col style="width:14%">
                <col style="width:10%">
                <col style="width:14%">
                <col style="width:12%">
                <col style="width:10%">
              </colgroup>
              <thead>
                <tr>
                  <th><input type="checkbox" class="ctb-check" id="ctb-check-all" onchange="toggleAll(this)"></th>
                  <th><button class="ctb-sort-btn" data-col="name" onclick="sortBy('name')">Deal Name <i class="ti ti-arrows-sort"></i></button></th>
                  <th><button class="ctb-sort-btn" data-col="company" onclick="sortBy('company')">Company <i class="ti ti-arrows-sort"></i></button></th>
                  <th>Owner</th>
                  <th><button class="ctb-sort-btn" data-col="value_num" onclick="sortBy('value_num')">Value <i class="ti ti-arrows-sort"></i></button></th>
                  <th>Stage</th>
                  <th><button class="ctb-sort-btn" data-col="close_ts" onclick="sortBy('close_ts')">Close Date <i class="ti ti-arrows-sort"></i></button></th>
                  <th><button class="ctb-sort-btn" data-col="prob_num" onclick="sortBy('prob_num')">Probability <i class="ti ti-arrows-sort"></i></button></th>
                </tr>
              </thead>
              <tbody id="ctb-tbody"></tbody>
            </table>
            <div class="ctb-empty" id="ctb-empty">
              <i class="ti ti-search-off"></i>
              <span>No deals match your search</span>
            </div>
          </div>

        </div>

      </main>
    </div>
  </div>

</div>

<!-- Spec panel -->
<aside class="sp-panel" id="sp-panel" aria-label="Pattern spec" aria-hidden="true">
  <div class="sp-hdr">
    <span class="sp-hdr-title">Configure</span>
    <button class="sp-hdr-close" onclick="spClose()" aria-label="Close"><i class="ti ti-x"></i></button>
  </div>
  <div class="sp-body">
    <div class="sp-section">
      <div class="sp-section-label">ZONES</div>
      <div id="sp-zones"></div>
    </div>
    <div class="sp-section">
      <div class="sp-section-label">GLOBAL TEMPLATE RULES</div>
      <div class="sp-rules-hdr">
        <i class="ti ti-sparkles sp-rules-hdr-icon"></i>
        <span class="sp-rules-hdr-name">AI RULES: DATA TABLE</span>
        <span class="sp-rules-hdr-hint">Click to edit</span>
      </div>
      <div id="sp-cats"></div>
    </div>
  </div>
  <div class="sp-bottom">
    <button class="sp-btn sp-btn-icon" id="sp-share-btn" onclick="spShare()" title="Share link" aria-label="Share link">
      <i class="ti ti-link"></i>
    </button>

<script>
/* ── Table data ───────────────────────────────────────────── */

var DEALS = [
  { id:1,  name:'Enterprise Expansion Q3',  company:'Techvault Inc',   owner:'Priya Sharma',  value:'$128,000', value_num:128000, stage:'Proposal',      close_date:'Jul 15, 2026', close_ts:20260715, prob:'65%',  prob_num:65 },
  { id:2,  name:'Platform License Renewal', company:'Luminate Health', owner:'Marcus Chen',   value:'$84,500',  value_num:84500,  stage:'Negotiation',   close_date:'Jun 30, 2026', close_ts:20260630, prob:'80%',  prob_num:80 },
  { id:3,  name:'API Integration Suite',    company:'FinCore',         owner:'Jamie Rivera',  value:'$42,000',  value_num:42000,  stage:'Discovery',     close_date:'Aug 10, 2026', close_ts:20260810, prob:'35%',  prob_num:35 },
  { id:4,  name:'AI Copilot Rollout',       company:'Orbis Labs',      owner:'Priya Sharma',  value:'$210,000', value_num:210000, stage:'Proposal',      close_date:'Jul 28, 2026', close_ts:20260728, prob:'55%',  prob_num:55 },
  { id:5,  name:'Data Warehouse Migration', company:'Arctus Systems',  owner:'Tom Okeke',     value:'$67,000',  value_num:67000,  stage:'Closed Won',    close_date:'Jun 5, 2026',  close_ts:20260605, prob:'100%', prob_num:100 },
  { id:6,  name:'Security Audit Package',   company:'Cloudspan',       owner:'Marcus Chen',   value:'$28,000',  value_num:28000,  stage:'Qualification', close_date:'Sep 1, 2026',  close_ts:20260901, prob:'25%',  prob_num:25 },
  { id:7,  name:'Dev Tools Bundle',         company:'DataStack',       owner:'Jamie Rivera',  value:'$15,500',  value_num:15500,  stage:'Discovery',     close_date:'Aug 20, 2026', close_ts:20260820, prob:'40%',  prob_num:40 },
  { id:8,  name:'SaaS Platform Upgrade',    company:'Nexus Software',  owner:'Tom Okeke',     value:'$95,000',  value_num:95000,  stage:'Negotiation',   close_date:'Jul 5, 2026',  close_ts:20260705, prob:'75%',  prob_num:75 },
  { id:9,  name:'Compliance Module Add-on', company:'Techvault Inc',   owner:'Priya Sharma',  value:'$32,000',  value_num:32000,  stage:'Proposal',      close_date:'Jun 25, 2026', close_ts:20260625, prob:'60%',  prob_num:60 },
  { id:10, name:'Analytics Dashboard Pro',  company:'Luminate Health', owner:'Marcus Chen',   value:'$54,000',  value_num:54000,  stage:'Closed Won',    close_date:'Jun 2, 2026',  close_ts:20260602, prob:'100%', prob_num:100 }
];

var _visibleData   = DEALS.slice();
var _selected      = {};
var _sortCol       = null;
var _sortDir       = 1;
var _searchQuery   = '';

function _stageClass(stage) {
  return stage.toLowerCase().replace(/\s+/g, '-');
}

function _renderTable() {
  var tbody   = document.getElementById('ctb-tbody');
  var empty   = document.getElementById('ctb-empty');
  var query   = _searchQuery.toLowerCase();
  var data    = DEALS.filter(function(d) {
    return !query ||
      d.name.toLowerCase().indexOf(query) !== -1 ||
      d.company.toLowerCase().indexOf(query) !== -1 ||
      d.owner.toLowerCase().indexOf(query) !== -1 ||
      d.stage.toLowerCase().indexOf(query) !== -1;
  });

  if (_sortCol) {
    data = data.slice().sort(function(a, b) {
      var av = a[_sortCol], bv = b[_sortCol];
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      return (av < bv ? -1 : av > bv ? 1 : 0) * _sortDir;
    });
  }

  _visibleData = data;

  if (!data.length) {
    tbody.innerHTML = '';
    empty.classList.add('visible');
  } else {
    empty.classList.remove('visible');
    tbody.innerHTML = data.map(function(d) {
      var checked = _selected[d.id] ? ' checked' : '';
      var selClass = _selected[d.id] ? ' selected' : '';
      return '<tr class="' + selClass + '" data-id="' + d.id + '">' +
        '<td><input type="checkbox" class="ctb-check" data-id="' + d.id + '"' + checked + ' onchange="toggleRow(this,' + d.id + ')"></td>' +
        '<td style="font-weight:500;color:var(--text-primary);">' + d.name + '</td>' +
        '<td>' + d.company + '</td>' +
        '<td>' + d.owner + '</td>' +
        '<td style="font-variant-numeric:tabular-nums;">' + d.value + '</td>' +
        '<td><span class="ctb-stage ' + _stageClass(d.stage) + '">' + d.stage + '</span></td>' +
        '<td>' + d.close_date + '</td>' +
        '<td style="font-variant-numeric:tabular-nums;">' + d.prob + '</td>' +
        '</tr>';
    }).join('');
  }

  _updateSelectionUI();
}

/* ── Sort ─────────────────────────────────────────────────── */

function sortBy(col) {
  if (_sortCol === col) {
    _sortDir *= -1;
  } else {
    _sortCol = col;
    _sortDir = 1;
  }
  document.querySelectorAll('.ctb-sort-btn').forEach(function(btn) {
    btn.classList.remove('asc', 'desc');
    btn.querySelector('i').className = 'ti ti-arrows-sort';
    if (btn.dataset.col === col) {
      btn.classList.add(_sortDir === 1 ? 'asc' : 'desc');
      btn.querySelector('i').className = _sortDir === 1 ? 'ti ti-sort-ascending' : 'ti ti-sort-descending';
    }
  });
  _renderTable();
}

/* ── Search ───────────────────────────────────────────────── */

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('ctb-search-input').addEventListener('input', function() {
    _searchQuery = this.value;
    _selected = {};
    _renderTable();
  });
  _renderTable();
});

/* ── Selection ────────────────────────────────────────────── */

function toggleRow(chk, id) {
  if (chk.checked) _selected[id] = true;
  else delete _selected[id];
  var row = chk.closest('tr');
  if (row) row.classList.toggle('selected', !!chk.checked);
  _updateSelectionUI();
}

function toggleAll(chk) {
  _visibleData.forEach(function(d) {
    if (chk.checked) _selected[d.id] = true;
    else delete _selected[d.id];
  });
  _renderTable();
}

function _updateSelectionUI() {
  var count    = Object.keys(_selected).length;
  var selEl    = document.getElementById('ctb-sel-actions');
  var countEl  = document.getElementById('ctb-sel-count');
  var allChk   = document.getElementById('ctb-check-all');
  var visCount = _visibleData.length;
  var selVis   = _visibleData.filter(function(d) { return _selected[d.id]; }).length;

  if (count > 0) {
    selEl.classList.add('visible');
    countEl.textContent = count + ' selected';
  } else {
    selEl.classList.remove('visible');
  }

  if (allChk) {
    allChk.checked = visCount > 0 && selVis === visCount;
    allChk.indeterminate = selVis > 0 && selVis < visCount;
  }
}

function deleteSelected() {
  var count = Object.keys(_selected).length;
  if (!count) return;
  _selected = {};
  _renderTable();
}

/* ── Nav pattern router ──────────────────────────────────── */

var _currentNavPattern = 'persistent-sidebar';
var _flyoutIdx = -1;

function _readNavCfg() {
  var cfg = { nav_pattern: 'persistent-sidebar', taxonomy: [] };
  try { var s = localStorage.getItem('freshds-nav-cfg'); if (s) Object.assign(cfg, JSON.parse(s)); } catch(e) {}
  return cfg;
}

function _getTax(cfg) {
  return (Array.isArray(cfg.taxonomy) && cfg.taxonomy.length > 0)
    ? cfg.taxonomy
    : (typeof DEFAULT_TAXONOMY !== 'undefined' ? DEFAULT_TAXONOMY : []);
}

function _buildIconRail(tax) {
  var html = '<fresh-nav-group label="Nav" open>';
  tax.forEach(function(item, idx) {
    var ic = item.icon ? ' icon="' + item.icon + '"' : '';
    html += '<fresh-nav-item' + ic + (idx === 0 ? ' active' : '') +
            ' data-tax-idx="' + idx + '">' + (item.label || '') + '</fresh-nav-item>';
  });
  return html + '</fresh-nav-group>';
}

function _applyNavPattern() {
  var cfg  = _readNavCfg();
  var tax  = _getTax(cfg);
  _currentNavPattern = cfg.nav_pattern || 'persistent-sidebar';

  var navbar   = document.getElementById('ctb-topbar');
  var sidebar  = document.getElementById('ctb-sidebar');
  var tabStrip = document.getElementById('ctb-tab-strip');

  sidebar.style.display  = 'none';
  tabStrip.style.display = 'none';
  sidebar.removeAttribute('collapsed');
  navbar.removeAttribute('hamburger');
  _closeFlyout();
  document.getElementById('ctb-tab-dropdown').classList.remove('open');

  if (_currentNavPattern === 'persistent-sidebar') {
    sidebar.style.display = '';
    document.getElementById('ctb-nav-content').innerHTML = buildSidebarHtml(tax);
  } else if (_currentNavPattern === 'collapsible-sidebar') {
    sidebar.style.display = '';
    navbar.setAttribute('hamburger', '');
    document.getElementById('ctb-nav-content').innerHTML = buildSidebarHtml(tax);
  } else if (_currentNavPattern === 'top-nav-tabs') {
    tabStrip.style.display = '';
    var tabsEl = document.getElementById('ctb-top-tabs');
    tabsEl.setAttribute('tabs', buildTabsJson(tax));
    if (tax[0]) tabsEl.setAttribute('active', tax[0].id);
  }
}

function _closeFlyout() {
  _flyoutIdx = -1;
  document.getElementById('ctb-icon-flyout').classList.remove('open');
}

function _openFlyout(idx, anchorEl) {
  var cfg     = _readNavCfg();
  var tax     = _getTax(cfg);
  var section = tax[idx];
  var kids    = (section && section.children) || [];
  if (!kids.length) { _closeFlyout(); return; }
  _flyoutIdx = idx;
  document.getElementById('ctb-flyout-label').textContent = section.label || '';
  document.getElementById('ctb-flyout-items').innerHTML = kids.map(function(child, ci) {
    return '<div class="ctb-flyout-item' + (ci === 0 ? ' active' : '') + '">' + (child.label || '') + '</div>';
  }).join('');
  var rect   = anchorEl.getBoundingClientRect();
  var flyout = document.getElementById('ctb-icon-flyout');
  flyout.style.top = rect.top + 'px';
  flyout.classList.add('open');
  requestAnimationFrame(function() {
    var fh = flyout.offsetHeight, vh = window.innerHeight;
    if (rect.top + fh > vh - 8) flyout.style.top = Math.max(8, vh - fh - 8) + 'px';
  });
}

var _tabDropKey = null, _tabPrevActive = '', _tabClickX = 0;

function _closeTabDrop() {
  _tabDropKey = null;
  document.getElementById('ctb-tab-dropdown').classList.remove('open');
}

function _openTabDrop(key, x) {
  var cfg  = _readNavCfg();
  var tax  = _getTax(cfg);
  var item = null;
  for (var i = 0; i < tax.length; i++) { if (tax[i].id === key) { item = tax[i]; break; } }
  var kids = (item && item.children) || [];
  if (!kids.length) { _closeTabDrop(); return; }
  _tabDropKey = key;
  var drop     = document.getElementById('ctb-tab-dropdown');
  var stripBot = document.getElementById('ctb-tab-strip').getBoundingClientRect().bottom;
  drop.innerHTML = kids.map(function(child, ci) {
    return '<div class="ctb-tab-drop-item' + (ci === 0 ? ' active' : '') + '">' + (child.label || '') + '</div>';
  }).join('');
  drop.style.top = stripBot + 'px';
  drop.style.left = '0';
  drop.classList.add('open');
  requestAnimationFrame(function() {
    var w = drop.offsetWidth, vw = window.innerWidth;
    drop.style.left = Math.max(8, Math.min(x - w / 2, vw - w - 8)) + 'px';
  });
}

document.addEventListener('DOMContentLoaded', function() {
  _applyNavPattern();
  if (window.FreshNavApply) window.FreshNavApply.apply();

  document.getElementById('ctb-topbar').addEventListener('hamburger-click', function() {
    if (_currentNavPattern !== 'collapsible-sidebar') return;
    var sb  = document.getElementById('ctb-sidebar');
    var tax = _getTax(_readNavCfg());
    if (sb.hasAttribute('collapsed')) {
      sb.removeAttribute('collapsed');
      document.getElementById('ctb-nav-content').innerHTML = buildSidebarHtml(tax);
      _closeFlyout();
    } else {
      sb.setAttribute('collapsed', '');
      document.getElementById('ctb-nav-content').innerHTML = _buildIconRail(tax);
    }
  });

  document.getElementById('ctb-nav-content').addEventListener('nav-click', function(e) {
    if (_currentNavPattern !== 'collapsible-sidebar') return;
    var sb = document.getElementById('ctb-sidebar');
    if (!sb.hasAttribute('collapsed')) return;
    var item = e.target;
    if (!item || item.tagName.toLowerCase() !== 'fresh-nav-item') return;
    var idx = parseInt(item.dataset.taxIdx, 10);
    if (isNaN(idx)) return;
    Array.prototype.slice.call(document.querySelectorAll('#ctb-nav-content fresh-nav-item'))
      .forEach(function(el, i) { if (i === idx) el.setAttribute('active', ''); else el.removeAttribute('active'); });
    if (idx === _flyoutIdx) { _closeFlyout(); return; }
    _openFlyout(idx, item);
  });
  document.getElementById('ctb-nav-content').addEventListener('click', function(e) { e.stopPropagation(); });
  document.getElementById('ctb-icon-flyout').addEventListener('click', function(e) { e.stopPropagation(); });

  document.getElementById('ctb-top-tabs').addEventListener('click', function(e) {
    if (_currentNavPattern !== 'top-nav-tabs') return;
    _tabClickX = e.clientX;
    e.stopPropagation();
    var activeNow = this.getAttribute('active');
    if (activeNow !== _tabPrevActive) {
      _tabPrevActive = activeNow;
      _openTabDrop(activeNow, _tabClickX);
    } else {
      if (_tabDropKey === activeNow) _closeTabDrop();
      else _openTabDrop(activeNow, _tabClickX);
    }
  });
  document.getElementById('ctb-tab-dropdown').addEventListener('click', function(e) { e.stopPropagation(); });

  document.addEventListener('click', function() { _closeFlyout(); _closeTabDrop(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { _closeFlyout(); _closeTabDrop(); spClose(); spCloseModal(); }
  });
});

/* ── Live sync ───────────────────────────────────────────── */

window.addEventListener('storage', function(e) {
  if (e.key !== 'freshds-nav-cfg') return;
  _applyNavPattern();
  if (window.FreshNavApply) window.FreshNavApply.apply();
});

var _lastNavCfgStr = null;
(function _poll() {
  var s = localStorage.getItem('freshds-nav-cfg') || '';
  if (s !== _lastNavCfgStr) {
    _lastNavCfgStr = s;
    _applyNavPattern();
    if (window.FreshNavApply) window.FreshNavApply.apply();
  }
  setTimeout(_poll, 400);
}());

window.addEventListener('pageshow', function(e) {
  if (e.persisted) {
    _applyNavPattern();
    if (window.FreshNavApply) window.FreshNavApply.apply();
  }
});

/* ── Spec panel ──────────────────────────────────────────── */

var SP_ZONES = [
  { key: 'page-header',    label: 'Page Header',    el: 'ctb-page-header',    on: true },
  { key: 'search-toolbar', label: 'Search / Toolbar', el: 'ctb-toolbar',      on: true },
  { key: 'table',          label: 'Table',           el: 'ctb-table-section', on: true }
];

var SP_RULES = {
  'LAYOUT': [
    'The page lives inside the full app shell: navbar + sidebar driven by freshds-nav-cfg.',
    'dash-main is a flex column. The table section uses flex:1 with overflow:auto so it scrolls independently without affecting the page header.',
    'Never wrap the table in an additional card or surface — it sits directly on the page background.'
  ],
  'PAGE HEADER': [
    'Title describes the content set (e.g. "All deals", "All contacts"). Subtitle shows the record count and a key aggregate metric.',
    'Utility actions (Columns, Export) use secondary variant. The single primary CTA (New deal) uses primary variant.',
    'Page header should be collapsible via spec panel zones toggle.'
  ],
  'TOOLBAR': [
    'Search input sits in the same horizontal row as the selection actions.',
    'When rows are selected, "N selected" + a Delete button appear on the right side of the toolbar row. No separate bulk action bar.',
    'No black box treatment for selection state — inline, lightweight text + danger-bordered button only.',
    'Search filters rows client-side; clear search resets selection state.'
  ],
  'TABLE': [
    'Use a custom HTML table (not a component) for full control over row selection, sort, and styling.',
    'Header row is sticky (position: sticky, top: 0) so it stays visible on scroll.',
    'Sortable columns show a sort icon; clicking toggles asc/desc on the active column.',
    'Selected rows use the color-interactive-subtle background; no outline or heavy treatment.',
    'Stage column uses status badges with semantic color tokens (proposal, negotiation, discovery, qualification, closed-won).',
    'Value and probability columns use tabular-nums for aligned reading.'
  ],
  'SELECTION': [
    'Header checkbox selects/deselects all visible rows (respects current search filter).',
    'Indeterminate state on header checkbox when some (not all) rows are selected.',
    'Delete clears selection and removes selected rows from the local data array.',
    'Selection count updates live as rows are checked/unchecked.'
  ]
};

function spOpen() {
  document.getElementById('sp-panel').classList.add('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'false');
  _spRenderZones();
  _spRenderCats();
  var u = new URL(location.href); u.searchParams.set('spec', 'open');
  history.replaceState(null, '', u.toString());
}

function spClose() {
  document.getElementById('sp-panel').classList.remove('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'true');
  var u = new URL(location.href); u.searchParams.delete('spec');
  history.replaceState(null, '', u.toString());
}

function _spRenderZones() {
  var el = document.getElementById('sp-zones'); el.innerHTML = '';
  SP_ZONES.forEach(function(z) {
    var row = document.createElement('div'); row.className = 'sp-zone-row';
    row.innerHTML = '<span class="sp-zone-label">' + z.label + '</span>' +
      '<label class="sp-toggle"><input type="checkbox"' + (z.on ? ' checked' : '') + '>' +
      '<span class="sp-toggle-track"></span><span class="sp-toggle-thumb"></span></label>';
    row.querySelector('input').addEventListener('change', function() {
      z.on = this.checked;
      var t = document.getElementById(z.el); if (t) t.style.display = z.on ? '' : 'none';
    });
    el.appendChild(row);
  });
}

function _spRenderCats() {
  var el = document.getElementById('sp-cats'); el.innerHTML = '';
  Object.keys(SP_RULES).forEach(function(cat) {
    var wrap = document.createElement('div'); wrap.className = 'sp-cat';
    _spBuildCat(cat, wrap); el.appendChild(wrap);
  });
}

function _spBuildCat(cat, wrap) {
  wrap.innerHTML = '';
  var label = document.createElement('div'); label.className = 'sp-cat-label'; label.textContent = cat;
  wrap.appendChild(label);
  SP_RULES[cat].forEach(function(rule, ri) { wrap.appendChild(_spRuleRow(cat, ri, rule, wrap)); });
  var addBtn = document.createElement('button'); addBtn.className = 'sp-add-rule';
  addBtn.innerHTML = '<i class="ti ti-plus"></i> Add rule';
  addBtn.addEventListener('click', function() {
    SP_RULES[cat].push('New rule'); _spBuildCat(cat, wrap);
    var texts = wrap.querySelectorAll('.sp-rule-text'); var last = texts[texts.length - 1];
    if (last) { last.focus(); var r = document.createRange(); r.selectNodeContents(last); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
  wrap.appendChild(addBtn);
}

function _spRuleRow(cat, ri, text, wrap) {
  var row  = document.createElement('div'); row.className = 'sp-rule';
  var dot  = document.createElement('span'); dot.className = 'sp-rule-dot';
  var span = document.createElement('span'); span.className = 'sp-rule-text';
  span.contentEditable = 'true'; span.textContent = text;
  span.addEventListener('input', function() { SP_RULES[cat][ri] = span.textContent; });
  var del  = document.createElement('button'); del.className = 'sp-rule-del';
  del.innerHTML = '<i class="ti ti-trash"></i>'; del.setAttribute('aria-label', 'Delete rule');
  del.addEventListener('click', function() { SP_RULES[cat].splice(ri, 1); _spBuildCat(cat, wrap); });
  row.appendChild(dot); row.appendChild(span); row.appendChild(del);
  return row;
}

function spShare() {
  var u = new URL(location.href); u.searchParams.set('spec', 'open');
  var btn = document.getElementById('sp-share-btn');
  navigator.clipboard.writeText(u.toString()).then(function() {
    var orig = btn.innerHTML; btn.innerHTML = '<i class="ti ti-check"></i>';
    setTimeout(function() { btn.innerHTML = orig; }, 1800);
  }).catch(function() {});
}

function spStartBuilding() {
  var lines = ['Build a data table page using the FreshDS design system.', ''];
  Object.keys(SP_RULES).forEach(function(cat) {
    lines.push('## ' + cat);
    SP_RULES[cat].forEach(function(rule) { lines.push('- ' + rule); });
    lines.push('');
  });
  lines.push('## ACTIVE ZONES');
  SP_ZONES.forEach(function(z) { lines.push('- ' + z.label + ': ' + (z.on ? 'SHOWN' : 'HIDDEN')); });
  document.getElementById('sp-modal-pre').textContent = lines.join('\n');
  document.getElementById('sp-modal-backdrop').classList.add('open');
}

function spCloseModal() { document.getElementById('sp-modal-backdrop').classList.remove('open'); }

function spCopyPrompt() {
  navigator.clipboard.writeText(document.getElementById('sp-modal-pre').textContent).then(function() {
    var ok = document.getElementById('sp-copy-ok'); ok.classList.add('show');
    setTimeout(function() { ok.classList.remove('show'); }, 1800);
  }).catch(function() {});
}

if (new URL(location.href).searchParams.get('spec') === 'open') {
  document.addEventListener('DOMContentLoaded', spOpen);
}
</script>
