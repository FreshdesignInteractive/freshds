<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Table — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/dashboard.css">
<link rel="stylesheet" href="../styles/patterns/content.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="dash-shell">

    <pattern-topbar logged-in></pattern-topbar>

    <div class="dash-body">

      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>

      <main class="dash-main">
        <div class="dash-page-header">
          <div>
            <div class="dash-page-title">All deals</div>
            <div class="dash-page-subtitle">64 open deals · $2.4M pipeline value</div>
          </div>
          <div class="dash-page-actions">
            <fresh-button variant="secondary" size="sm"><i class="ti ti-columns"></i> Columns</fresh-button>
            <fresh-button variant="secondary" size="sm"><i class="ti ti-download"></i> Export</fresh-button>
            <fresh-button variant="primary" size="sm"><i class="ti ti-plus"></i> New deal</fresh-button>
          </div>
        </div>

        <div class="dash-content">
          <fresh-data-table
            searchable
            selectable
            search-placeholder="Search deals…"
            columns='[
              {"key":"name",       "label":"Deal name",   "sortable":true},
              {"key":"company",    "label":"Company",     "sortable":true},
              {"key":"owner",      "label":"Owner",       "sortable":false},
              {"key":"value",      "label":"Value",       "sortable":true},
              {"key":"stage",      "label":"Stage",       "sortable":false},
              {"key":"close_date", "label":"Close date",  "sortable":true},
              {"key":"probability","label":"Probability", "sortable":true}
            ]'
            data='[
              {"name":"Enterprise Expansion Q3",    "company":"Techvault Inc",   "owner":"Priya Sharma",  "value":"$128,000", "stage":"Proposal",       "close_date":"Jul 15, 2026", "probability":"65%"},
              {"name":"Platform License Renewal",   "company":"Luminate Health", "owner":"Marcus Chen",   "value":"$84,500",  "stage":"Negotiation",    "close_date":"Jun 30, 2026", "probability":"80%"},
              {"name":"API Integration Suite",      "company":"FinCore",         "owner":"Jamie Rivera",  "value":"$42,000",  "stage":"Discovery",      "close_date":"Aug 10, 2026", "probability":"35%"},
              {"name":"AI Copilot Rollout",         "company":"Orbis Labs",      "owner":"Priya Sharma",  "value":"$210,000", "stage":"Proposal",       "close_date":"Jul 28, 2026", "probability":"55%"},
              {"name":"Data Warehouse Migration",   "company":"Arctus Systems",  "owner":"Tom Okeke",     "value":"$67,000",  "stage":"Closed Won",     "close_date":"Jun 5, 2026",  "probability":"100%"},
              {"name":"Security Audit Package",     "company":"Cloudspan",       "owner":"Marcus Chen",   "value":"$28,000",  "stage":"Qualification",  "close_date":"Sep 1, 2026",  "probability":"25%"},
              {"name":"Dev Tools Bundle",           "company":"DataStack",       "owner":"Jamie Rivera",  "value":"$15,500",  "stage":"Discovery",      "close_date":"Aug 20, 2026", "probability":"40%"},
              {"name":"SaaS Platform Upgrade",      "company":"Nexus Software",  "owner":"Tom Okeke",     "value":"$95,000",  "stage":"Negotiation",    "close_date":"Jul 5, 2026",  "probability":"75%"},
              {"name":"Compliance Module Add-on",   "company":"Techvault Inc",   "owner":"Priya Sharma",  "value":"$32,000",  "stage":"Proposal",       "close_date":"Jun 25, 2026", "probability":"60%"},
              {"name":"Analytics Dashboard Pro",    "company":"Luminate Health", "owner":"Marcus Chen",   "value":"$54,000",  "stage":"Closed Won",     "close_date":"Jun 2, 2026",  "probability":"100%"}
            ]'>
            <div slot="bulk-actions">
              <fresh-button variant="secondary" size="sm"><i class="ti ti-user-check"></i> Reassign</fresh-button>
              <fresh-button variant="secondary" size="sm"><i class="ti ti-tag"></i> Update stage</fresh-button>
              <fresh-button variant="danger" size="sm"><i class="ti ti-trash"></i> Delete</fresh-button>
            </div>
          </fresh-data-table>
        </div>
      </main>

    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/data/fresh-avatar.js"></script>
<script src="../components/data/fresh-data-table.js"></script>
</body>
</html>
