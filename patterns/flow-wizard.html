<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step Wizard — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/dashboard.css">
<link rel="stylesheet" href="../styles/patterns/workflow.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="dash-shell">

    <pattern-topbar logged-in></pattern-topbar>

    <div class="dash-body">

      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>

      <main class="dash-main">

        <div class="dash-page-header" style="flex-shrink:0;">
          <div>
            <div class="dash-page-title">New Workflow</div>
            <div class="dash-page-subtitle">Create a workflow in 4 steps</div>
          </div>
          <div class="dash-page-actions">
            <fresh-button variant="ghost" size="sm"><i class="ti ti-x"></i> Cancel</fresh-button>
          </div>
        </div>

        <!-- Stepper -->
        <div style="padding: var(--space-4) var(--space-6) 0; flex-shrink:0;">
          <fresh-stepper current="2">
            <span slot="step">Basics</span>
            <span slot="step">Trigger</span>
            <span slot="step">Actions</span>
            <span slot="step">Review</span>
          </fresh-stepper>
        </div>

        <!-- Step content -->
        <div class="wf-wizard-wrap">

          <!-- Step 2: Trigger (current) -->
          <div class="wf-step-card">
            <div class="wf-step-card-title">Configure trigger</div>
            <div class="wf-step-card-desc">Choose what starts this workflow and set the conditions.</div>

            <div class="wf-form-grid">
              <div class="wf-form-full">
                <fresh-form-field label="Trigger event" required>
                  <fresh-select slot="input">
                    <option>Record created</option>
                    <option selected>Record updated</option>
                    <option>Record deleted</option>
                    <option>Form submitted</option>
                    <option>Webhook received</option>
                    <option>Schedule (cron)</option>
                  </fresh-select>
                </fresh-form-field>
              </div>
              <div>
                <fresh-form-field label="Object type" required>
                  <fresh-select slot="input">
                    <option>Contact</option>
                    <option selected>Deal</option>
                    <option>Company</option>
                    <option>Task</option>
                  </fresh-select>
                </fresh-form-field>
              </div>
              <div>
                <fresh-form-field label="Filter by status">
                  <fresh-select slot="input">
                    <option>Any status</option>
                    <option selected>Qualified</option>
                    <option>Proposal sent</option>
                    <option>Closed won</option>
                  </fresh-select>
                </fresh-form-field>
              </div>
              <div class="wf-form-full">
                <fresh-form-field label="Run this workflow">
                  <fresh-select slot="input">
                    <option>Every time the trigger fires</option>
                    <option selected>Once per record</option>
                    <option>Once per record per day</option>
                  </fresh-select>
                </fresh-form-field>
              </div>
            </div>
          </div>

          <!-- Additional conditions card -->
          <div class="wf-step-card">
            <div class="wf-step-card-title" style="margin-bottom:var(--space-4);">Additional conditions <fresh-badge variant="neutral" size="sm">Optional</fresh-badge></div>

            <div class="wf-condition-group">
              <div class="wf-condition-group-header">
                <span style="font-size:11px;color:var(--text-secondary);">Run only if ALL of these match</span>
                <button class="wf-condition-logic-badge">AND</button>
              </div>
              <div class="wf-condition-row">
                <div class="wf-condition-field">
                  <fresh-select>
                    <option selected>Deal value</option>
                    <option>Owner</option>
                    <option>Stage</option>
                    <option>Source</option>
                  </fresh-select>
                </div>
                <div class="wf-condition-op">
                  <fresh-select>
                    <option selected>is greater than</option>
                    <option>is less than</option>
                    <option>equals</option>
                  </fresh-select>
                </div>
                <div class="wf-condition-val">
                  <fresh-input value="10000" placeholder="Value"></fresh-input>
                </div>
                <button class="wf-condition-del" aria-label="Remove"><i class="ti ti-x"></i></button>
              </div>
              <div class="wf-condition-row">
                <div class="wf-condition-field">
                  <fresh-select>
                    <option>Deal value</option>
                    <option selected>Stage</option>
                    <option>Owner</option>
                  </fresh-select>
                </div>
                <div class="wf-condition-op">
                  <fresh-select>
                    <option selected>is one of</option>
                    <option>is not</option>
                  </fresh-select>
                </div>
                <div class="wf-condition-val">
                  <fresh-input value="Proposal, Negotiation" placeholder="Values"></fresh-input>
                </div>
                <button class="wf-condition-del" aria-label="Remove"><i class="ti ti-x"></i></button>
              </div>
              <div class="wf-add-condition-row">
                <fresh-button variant="ghost" size="sm"><i class="ti ti-plus"></i> Add condition</fresh-button>
              </div>
            </div>
          </div>

        </div>

        <!-- Wizard footer -->
        <div class="wf-wizard-footer">
          <fresh-button variant="secondary" size="sm"><i class="ti ti-arrow-left"></i> Back</fresh-button>
          <div class="wf-wizard-footer-right">
            <fresh-button variant="ghost" size="sm">Save draft</fresh-button>
            <fresh-button variant="primary" size="sm">Continue <i class="ti ti-arrow-right"></i></fresh-button>
          </div>
        </div>

      </main>

    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/core/fresh-input.js"></script>
<script src="../components/core/fresh-select.js"></script>
<script src="../components/core/fresh-form-field.js"></script>
<script src="../components/feedback/fresh-badge.js"></script>
<script src="../components/navigation/fresh-stepper.js"></script>
</body>
</html>
