<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}

.cfo-icon-flyout.open { display: block; }
.cfo-flyout-label { padding: var(--space-2) var(--space-3) var(--space-1); font-size: var(--font-size-xs); font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-tertiary); border-bottom: 1px solid var(--surface-border); }
.cfo-flyout-item { display: flex; align-items: center; padding: 7px var(--space-3); font-size: var(--font-size-sm); font-family: var(--font-sans); color: var(--text-secondary); cursor: pointer; transition: background 100ms, color 100ms; -webkit-font-smoothing: antialiased; }
.cfo-flyout-item:hover { background: var(--surface-subtle); color: var(--text-primary); }

.cfo-tab-dropdown.open { display: block; }
.cfo-tab-drop-item { display: flex; align-items: center; padding: 7px var(--space-4); font-size: var(--font-size-sm); font-family: var(--font-sans); color: var(--text-secondary); cursor: pointer; transition: background 100ms, color 100ms; -webkit-font-smoothing: antialiased; }
.cfo-tab-drop-item:hover { background: var(--surface-subtle); color: var(--text-primary); }
.cfo-tab-drop-item.active { color: var(--nav-active-text); background: var(--nav-active-bg); font-weight: 500; }
</style>');</script>

<script src="../components/navigation/fresh-navbar.js"></script>
<script src="../components/navigation/fresh-sidebar.js"></script>
<script src="../components/navigation/fresh-topbar-menu.js"></script>

<script src="../js/freshds-nav-apply.js"></script>
<script>
var _currentPattern='persistent-sidebar',_flyoutIdx=-1;
function _readNavCfg(){var cfg={nav_pattern:'persistent-sidebar',taxonomy:[]};try{var s=localStorage.getItem('freshds-nav-cfg');if(s)Object.assign(cfg,JSON.parse(s));}catch(e){}return cfg;}
function _getTax(cfg){return(Array.isArray(cfg.taxonomy)&&cfg.taxonomy.length>0)?cfg.taxonomy:(typeof DEFAULT_TAXONOMY!=='undefined'?DEFAULT_TAXONOMY:[]);}
function _buildIconRail(tax){var html='<fresh-nav-group label="Nav" open>';tax.forEach(function(item,idx){var ic=item.icon?' icon="'+item.icon+'"':'';html+='<fresh-nav-item'+ic+(idx===0?' active':'')+' data-tax-idx="'+idx+'">'+(item.label||'')+'</fresh-nav-item>';});return html+'</fresh-nav-group>';}
function _applyNavPattern(){var cfg=_readNavCfg();var tax=_getTax(cfg);_currentPattern=cfg.nav_pattern||'persistent-sidebar';var navbar=document.getElementById('cfo-topbar');var sidebar=document.getElementById('cfo-sidebar');var tabStrip=document.getElementById('cfo-tab-strip');sidebar.style.display='none';tabStrip.style.display='none';sidebar.removeAttribute('collapsed');sidebar.style.position='';sidebar.style.zIndex='';sidebar.style.height='100%';sidebar.style.width='';(function(){var b=document.getElementById('_hd-bd');if(b)b.style.display='none';})();navbar.removeAttribute('hamburger');_closeFlyout();document.getElementById('cfo-tab-dropdown').classList.remove('open');if(_currentPattern==='persistent-sidebar'){sidebar.style.display='';document.getElementById('cfo-nav-content').innerHTML=buildSidebarHtml(tax);}else if(_currentPattern==='collapsible-sidebar'){sidebar.style.display='';navbar.setAttribute('hamburger','');sidebar.setAttribute('collapsed','');document.getElementById('cfo-nav-content').innerHTML=_buildIconRail(tax);}else if(_currentPattern==='top-nav-tabs'){tabStrip.style.display='';var tabsEl=document.getElementById('cfo-top-tabs');tabsEl.setAttribute('tabs',buildTabsJson(tax));if(tax[0])tabsEl.setAttribute('active',tax[0].id);}else if(_currentPattern==='dual-level'){tabStrip.style.display='';sidebar.style.display='';var _dtabs=tabStrip.querySelector('fresh-topbar-menu');var _dnc=document.getElementById(sidebar.id.replace('-sidebar','-nav-content'));_dtabs.setAttribute('tabs',buildTabsJson(tax));if(tax[0])_dtabs.setAttribute('active',tax[0].id);_dnc.innerHTML=buildDualLevelSections(tax);var _dswitch=function(key){_dnc.querySelectorAll('.section-nav').forEach(function(el){el.style.display=el.id===('snav-'+key)?'contents':'none';});var _da=_dnc.querySelector('#snav-'+key);sidebar.style.display=(_da&&_da.dataset.hasChildren==='1')?'':'none';};_dswitch(tax[0]?tax[0].id:'');if(!_dtabs._dlWired){_dtabs._dlWired=true;_dtabs.addEventListener('change',function(e){_dswitch(e.detail.key);});}}else if(_currentPattern==='hamburger-drawer'){navbar.setAttribute('hamburger','');document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML=buildSidebarHtml(tax);(function(){var b=document.getElementById('_hd-bd');if(b)b.style.display='none';})();}else if(_currentPattern==='command-palette'){sidebar.style.display='';sidebar.setAttribute('collapsed','');document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML=_buildIconRail(tax);}else{sidebar.style.display='';document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML=buildSidebarHtml(tax);}}
function _closeFlyout(){_flyoutIdx=-1;document.getElementById('cfo-icon-flyout').classList.remove('open');}
function _openFlyout(idx,anchorEl){var cfg=_readNavCfg();var tax=_getTax(cfg);var section=tax[idx];var kids=(section&&section.children)||[];if(!kids.length){_closeFlyout();return;}_flyoutIdx=idx;document.getElementById('cfo-flyout-label').textContent=section.label||'';document.getElementById('cfo-flyout-items').innerHTML=kids.map(function(child,ci){return'<div class="cfo-flyout-item'+(ci===0?' active':'')+'">'+( child.label||'')+'</div>';}).join('');var rect=anchorEl.getBoundingClientRect();var flyout=document.getElementById('cfo-icon-flyout');flyout.style.top=rect.top+'px';flyout.classList.add('open');requestAnimationFrame(function(){var fh=flyout.offsetHeight,vh=window.innerHeight;if(rect.top+fh>vh-8)flyout.style.top=Math.max(8,vh-fh-8)+'px';});}
var _tabDropKey=null,_tabPrevActive='',_tabClickX=0;
function _closeTabDrop(){_tabDropKey=null;document.getElementById('cfo-tab-dropdown').classList.remove('open');}
function _openTabDrop(key,x){var cfg=_readNavCfg();var tax=_getTax(cfg);var item=null;for(var i=0;i<tax.length;i++){if(tax[i].id===key){item=tax[i];break;}}var kids=(item&&item.children)||[];if(!kids.length){_closeTabDrop();return;}_tabDropKey=key;var drop=document.getElementById('cfo-tab-dropdown');var stripBot=document.getElementById('cfo-tab-strip').getBoundingClientRect().bottom;drop.innerHTML=kids.map(function(child,ci){return'<div class="cfo-tab-drop-item'+(ci===0?' active':'')+'">'+( child.label||'')+'</div>';}).join('');drop.style.top=stripBot+'px';drop.style.left='0';drop.classList.add('open');requestAnimationFrame(function(){var w=drop.offsetWidth,vw=window.innerWidth;drop.style.left=Math.max(8,Math.min(x-w/2,vw-w-8))+'px';});}
document.addEventListener('DOMContentLoaded',function(){_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();document.getElementById('cfo-topbar').addEventListener('hamburger-click',function(){if(_currentPattern!=='collapsible-sidebar'&&_currentPattern!=='hamburger-drawer')return;var sb=document.getElementById('cfo-sidebar');var tax=_getTax(_readNavCfg());if(_currentPattern==='hamburger-drawer'){var _hdbd=document.getElementById('_hd-bd');if(!_hdbd){_hdbd=document.createElement('div');_hdbd.id='_hd-bd';_hdbd.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99;display:none';var _sbRef=sb;_hdbd.addEventListener('click',function(){_sbRef.style.display='none';_sbRef.style.position='';_sbRef.style.zIndex='';_sbRef.style.height='100%';_sbRef.style.width='';_hdbd.style.display='none';});document.body.appendChild(_hdbd);}var _hdopen=sb.style.display!=='none';if(_hdopen){sb.style.display='none';sb.style.position='';sb.style.zIndex='';sb.style.height='100%';sb.style.width='';_hdbd.style.display='none';}else{sb.style.display='';sb.style.position='fixed';sb.style.left='0';sb.style.top='0';sb.style.height='100vh';sb.style.width='var(--sidebar-w,240px)';sb.style.zIndex='100';_hdbd.style.display='';}return;}if(sb.hasAttribute('collapsed')){sb.removeAttribute('collapsed');document.getElementById('cfo-nav-content').innerHTML=buildSidebarHtml(tax);_closeFlyout();}else{sb.setAttribute('collapsed','');document.getElementById('cfo-nav-content').innerHTML=_buildIconRail(tax);}});document.getElementById('cfo-nav-content').addEventListener('nav-click',function(e){if(_currentPattern!=='collapsible-sidebar'&&_currentPattern!=='command-palette')return;var sb=document.getElementById('cfo-sidebar');if(!sb.hasAttribute('collapsed'))return;var item=e.target;if(!item||item.tagName.toLowerCase()!=='fresh-nav-item')return;var idx=parseInt(item.dataset.taxIdx,10);if(isNaN(idx))return;Array.prototype.slice.call(document.querySelectorAll('#cfo-nav-content fresh-nav-item')).forEach(function(el,i){if(i===idx)el.setAttribute('active','');else el.removeAttribute('active');});if(idx===_flyoutIdx){_closeFlyout();return;}_openFlyout(idx,item);});document.getElementById('cfo-nav-content').addEventListener('click',function(e){e.stopPropagation();});document.getElementById('cfo-icon-flyout').addEventListener('click',function(e){e.stopPropagation();});document.getElementById('cfo-top-tabs').addEventListener('mousedown',function(e){_tabClickX=e.clientX;});document.getElementById('cfo-top-tabs').addEventListener('click',function(e){if(_currentPattern!=='top-nav-tabs')return;e.stopPropagation();var activeNow=this.getAttribute('active');if(activeNow!==_tabPrevActive){_tabPrevActive=activeNow;_openTabDrop(activeNow,_tabClickX);}else{if(_tabDropKey===activeNow)_closeTabDrop();else _openTabDrop(activeNow,_tabClickX);}});document.getElementById('cfo-tab-dropdown').addEventListener('click',function(e){e.stopPropagation();});document.addEventListener('click',function(){_closeFlyout();_closeTabDrop();});document.addEventListener('keydown',function(e){if(e.key==='Escape'){_closeFlyout();_closeTabDrop();spClose();spCloseModal();}});});
window.addEventListener('storage',function(e){if(e.key!=='freshds-nav-cfg')return;_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();});
var _lastNavCfgStr=null;(function _poll(){var s=localStorage.getItem('freshds-nav-cfg')||'';if(s!==_lastNavCfgStr){_lastNavCfgStr=s;_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();}setTimeout(_poll,400);}());
window.addEventListener('pageshow',function(e){if(e.persisted){_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();}});
var SP_ZONES=[{key:'header',label:'Page header',el:'cfo-header',on:true},{key:'content',label:'Page content',el:'cfo-content',on:true}];
var SP_RULES={'LAYOUT':['Full app shell: dash-shell with fresh-navbar + fresh-sidebar from nav config.','dash-main: flex:1, overflow-y:auto, padding var(--space-5) var(--space-6).'],'PAGE HEADER':['dash-page-header: flex row, space-between, border-bottom. Title left, actions right.','Use fresh-button with appropriate variants for header actions.'],'CONTENT':['Wrap content sections in dash-card with dash-card-title.','Use FreshDS tokens for all spacing, color, and typography.']};
function spOpen(){document.getElementById('sp-panel').classList.add('open');document.getElementById('sp-panel').setAttribute('aria-hidden','false');_spRenderZones();_spRenderCats();var u=new URL(location.href);u.searchParams.set('spec','open');history.replaceState(null,'',u.toString());}
function spClose(){document.getElementById('sp-panel').classList.remove('open');document.getElementById('sp-panel').setAttribute('aria-hidden','true');var u=new URL(location.href);u.searchParams.delete('spec');history.replaceState(null,'',u.toString());}
function _spRenderZones(){var el=document.getElementById('sp-zones');el.innerHTML='';SP_ZONES.forEach(function(z){var row=document.createElement('div');row.className='sp-zone-row';row.innerHTML='<span class="sp-zone-label">'+z.label+'</span><label class="sp-toggle"><input type="checkbox"'+(z.on?' checked':'')+'><span class="sp-toggle-track"></span><span class="sp-toggle-thumb"></span></label>';row.querySelector('input').addEventListener('change',function(){z.on=this.checked;var t=document.getElementById(z.el);if(t)t.style.display=z.on?'':'none';});el.appendChild(row);});}
function _spRenderCats(){var el=document.getElementById('sp-cats');el.innerHTML='';Object.keys(SP_RULES).forEach(function(cat){var wrap=document.createElement('div');wrap.className='sp-cat';_spBuildCat(cat,wrap);el.appendChild(wrap);});}
function _spBuildCat(cat,wrap){wrap.innerHTML='';var label=document.createElement('div');label.className='sp-cat-label';label.textContent=cat;wrap.appendChild(label);SP_RULES[cat].forEach(function(rule,ri){wrap.appendChild(_spRuleRow(cat,ri,rule,wrap));});var addBtn=document.createElement('button');addBtn.className='sp-add-rule';addBtn.innerHTML='<i class="ti ti-plus"></i> Add rule';addBtn.addEventListener('click',function(){SP_RULES[cat].push('New rule');_spBuildCat(cat,wrap);var texts=wrap.querySelectorAll('.sp-rule-text');var last=texts[texts.length-1];if(last){last.focus();var r=document.createRange();r.selectNodeContents(last);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}});wrap.appendChild(addBtn);}
function _spRuleRow(cat,ri,text,wrap){var row=document.createElement('div');row.className='sp-rule';var dot=document.createElement('span');dot.className='sp-rule-dot';var span=document.createElement('span');span.className='sp-rule-text';span.contentEditable='true';span.textContent=text;span.addEventListener('input',function(){SP_RULES[cat][ri]=span.textContent;});var del=document.createElement('button');del.className='sp-rule-del';del.innerHTML='<i class="ti ti-trash"></i>';del.setAttribute('aria-label','Delete rule');del.addEventListener('click',function(){SP_RULES[cat].splice(ri,1);_spBuildCat(cat,wrap);});row.appendChild(dot);row.appendChild(span);row.appendChild(del);return row;}
function spShare(){var u=new URL(location.href);u.searchParams.set('spec','open');var btn=document.getElementById('sp-share-btn');navigator.clipboard.writeText(u.toString()).then(function(){var orig=btn.innerHTML;btn.innerHTML='<i class="ti ti-check"></i>';setTimeout(function(){btn.innerHTML=orig;},1800);}).catch(function(){});}
function spStartBuilding(){var lines=['Build this page using the FreshDS design system.',''];Object.keys(SP_RULES).forEach(function(cat){lines.push('## '+cat);SP_RULES[cat].forEach(function(rule){lines.push('- '+rule);});lines.push('');});lines.push('## ACTIVE ZONES');SP_ZONES.forEach(function(z){lines.push('- '+z.label+': '+(z.on?'SHOWN':'HIDDEN'));});document.getElementById('sp-modal-pre').textContent=lines.join('\n');document.getElementById('sp-modal-backdrop').classList.add('open');}
function spCloseModal(){document.getElementById('sp-modal-backdrop').classList.remove('open');}
function spCopyPrompt(){navigator.clipboard.writeText(document.getElementById('sp-modal-pre').textContent).then(function(){var ok=document.getElementById('sp-copy-ok');ok.classList.add('show');setTimeout(function(){ok.classList.remove('show');},1800);}).catch(function(){});}
if(new URL(location.href).searchParams.get('spec')==='open'){document.addEventListener('DOMContentLoaded',spOpen);}
</script>
