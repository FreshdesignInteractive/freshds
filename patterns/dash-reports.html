<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports View — Acme</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/theme.css">
<link rel="stylesheet" href="../tokens/dataviz.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/patterns/dashboard.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../js/pattern-topbar-v2.js"></script>
<script src="../js/freshds.js"></script>
<script src="../js/pattern-bar.js"></script>
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="dash-shell">

    <pattern-topbar logged-in></pattern-topbar>

    <div class="dash-body">

      <nav class="app-nav open" id="app-nav" aria-label="Main navigation">
        <div class="app-nav-inner">
          <button class="app-nav-item active"><i class="ti ti-home"></i> Home</button>
          <button class="app-nav-item"><i class="ti ti-chart-bar"></i> Analytics</button>
          <button class="app-nav-item"><i class="ti ti-activity"></i> Activity</button>
          <button class="app-nav-item"><i class="ti ti-folders"></i> Projects</button>
          <button class="app-nav-item"><i class="ti ti-check"></i> My tasks</button>
          <button class="app-nav-item"><i class="ti ti-calendar-event"></i> Calendar</button>
          <button class="app-nav-item"><i class="ti ti-users"></i> Members</button>
          <button class="app-nav-item"><i class="ti ti-settings"></i> Settings</button>
        </div>
      </nav>

      <main class="dash-main">
        <div class="dash-page-header">
          <div>
            <div class="dash-page-title">Reports</div>
            <div class="dash-page-subtitle">All saved and scheduled reports for your workspace.</div>
          </div>
          <div class="dash-page-actions">
            <fresh-button variant="secondary" size="sm"><i class="ti ti-filter"></i> Filter</fresh-button>
            <fresh-button variant="primary" size="sm"><i class="ti ti-plus"></i> New report</fresh-button>
          </div>
        </div>

        <div class="dash-content">
          <fresh-data-table
            searchable
            selectable
            search-placeholder="Search reports…"
            columns='[
              {"key":"name",      "label":"Report name",  "sortable":true},
              {"key":"type",      "label":"Type",         "sortable":true},
              {"key":"created_by","label":"Created by",   "sortable":false},
              {"key":"schedule",  "label":"Schedule",     "sortable":false},
              {"key":"last_run",  "label":"Last run",     "sortable":true},
              {"key":"status",    "label":"Status",       "sortable":false}
            ]'
            data='[
              {"name":"Q2 Revenue Summary",         "type":"Financial",   "created_by":"Priya Sharma",  "schedule":"Weekly",  "last_run":"Jun 2, 2026",  "status":"Active"},
              {"name":"User Cohort Analysis",       "type":"Analytics",   "created_by":"Marcus Chen",   "schedule":"Monthly", "last_run":"Jun 1, 2026",  "status":"Active"},
              {"name":"API Usage Report",           "type":"Technical",   "created_by":"Tom Okeke",     "schedule":"Daily",   "last_run":"Jun 3, 2026",  "status":"Active"},
              {"name":"Churn Risk Dashboard",       "type":"Analytics",   "created_by":"Jamie Rivera",  "schedule":"Weekly",  "last_run":"May 30, 2026", "status":"Active"},
              {"name":"Monthly Exec Summary",       "type":"Financial",   "created_by":"Priya Sharma",  "schedule":"Monthly", "last_run":"Jun 1, 2026",  "status":"Active"},
              {"name":"Feature Adoption Trends",    "type":"Product",     "created_by":"Marcus Chen",   "schedule":"Weekly",  "last_run":"May 27, 2026", "status":"Paused"},
              {"name":"Support Ticket Volume",      "type":"Operations",  "created_by":"Tom Okeke",     "schedule":"Daily",   "last_run":"Jun 3, 2026",  "status":"Active"},
              {"name":"Infrastructure Cost Report", "type":"Technical",   "created_by":"Tom Okeke",     "schedule":"Monthly", "last_run":"Jun 1, 2026",  "status":"Active"},
              {"name":"NPS Score Tracker",          "type":"Product",     "created_by":"Jamie Rivera",  "schedule":"Monthly", "last_run":"May 31, 2026", "status":"Active"},
              {"name":"Sales Pipeline Overview",    "type":"Financial",   "created_by":"Priya Sharma",  "schedule":"Weekly",  "last_run":"May 28, 2026", "status":"Paused"}
            ]'>
            <div slot="bulk-actions">
              <fresh-button variant="secondary" size="sm"><i class="ti ti-download"></i> Export selected</fresh-button>
              <fresh-button variant="danger" size="sm"><i class="ti ti-trash"></i> Delete</fresh-button>
            </div>
          </fresh-data-table>
        </div>
      </main>

    </div>
  </div>

</div>
<script>
  document.addEventListener('nav-toggle', function() {
    document.getElementById('app-nav').classList.toggle('open');
  });
</script>
<script src="../components/core/fresh-button.js"></script>
<script src="../components/data/fresh-avatar.js"></script>
<script src="../components/data/fresh-data-table.js"></script>
</body>
</html>
