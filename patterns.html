<style>
  /* ── Pattern library shell ── */
  .pl-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface-bg);
  }

  .pl-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-5) var(--space-8);
    border-bottom: 1px solid var(--surface-border);
    gap: var(--space-6);
    flex-shrink: 0;
  }

  .pl-search { width: 220px; flex-shrink: 0; }

  /* ── Overflow filter bar ── */
  .pl-filter-bar {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .pl-filter-track {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    overflow: hidden;
  }

  .pl-filter-tab {
    all: unset;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border-radius: var(--radius-md);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: color 150ms ease, background 150ms ease;
    -webkit-font-smoothing: antialiased;
  }
  .pl-filter-tab:hover:not(.active) {
    color: var(--text-primary);
    background: var(--surface-subtle);
  }
  .pl-filter-tab.active {
    font-weight: 600;
    color: var(--text-primary);
    background: var(--surface-overlay);
  }
  .pl-filter-tab:focus-visible {
    outline: 2px solid var(--color-interactive);
    outline-offset: 2px;
  }

  .pl-more-wrap { position: relative; flex-shrink: 0; }

  .pl-more-btn {
    all: unset;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 20px;
    transition: color 150ms ease, background 150ms ease;
  }
  .pl-more-btn:hover       { color: var(--text-primary); background: var(--surface-subtle); }
  .pl-more-btn.has-active  { color: var(--text-primary); background: var(--surface-overlay); font-weight: 600; }
  .pl-more-btn:focus-visible { outline: 2px solid var(--color-interactive); outline-offset: 2px; }

  .pl-more-menu {
    position: absolute;
    top: calc(100% + var(--space-2));
    left: 0;
    min-width: 160px;
    background: var(--surface-canvas);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-md);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    padding: var(--space-2);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .pl-more-menu[hidden] { display: none; }

  .pl-more-item {
    all: unset;
    display: flex;
    align-items: center;
    padding: 8px 12px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: color 150ms ease, background 150ms ease;
  }
  .pl-more-item:hover  { color: var(--text-primary); background: var(--surface-subtle); }
  .pl-more-item.active { font-weight: 600; color: var(--text-primary); background: var(--surface-overlay); }

  .pl-content {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-8);
  }
  .pl-content::-webkit-scrollbar { width: 4px; }
  .pl-content::-webkit-scrollbar-thumb { background: var(--surface-border-strong); border-radius: 2px; }

  /* ── Pattern grid ── */
  .pl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 280px);
    gap: var(--space-6);
  }

  /* Invisible sentinel — spans full row so the observer fires reliably */
  .pl-sentinel {
    grid-column: 1 / -1;
    height: 1px;
  }

  .pl-empty {
    grid-column: 1 / -1;
    padding: var(--space-12) 0;
    text-align: center;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--text-tertiary);
  }

  /* ── Pattern card thumbnail ── */
  .pl-thumb {
    aspect-ratio: 3 / 2;
    overflow: hidden;
    position: relative;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    background: var(--surface-subtle);
  }

  /* Scaled live iframe — scale set by JS to exactly fill card width */
  .pl-thumb-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 800px;
    border: none;
    transform-origin: top left;
    pointer-events: none;
    display: block;
    opacity: 0;
    transition: opacity 300ms ease;
  }
  .pl-thumb-frame.loaded { opacity: 1; }
</style>

    { id: 'settings-security', name: 'Security Settings',   section: 'settings',   href: 'patterns/settings-security.html', tags: ['security', 'password', '2fa', 'sessions'] },
    { id: 'settings-privacy',  name: 'Privacy Controls',    section: 'settings',   href: 'patterns/settings-privacy.html',  tags: ['privacy', 'data', 'gdpr', 'consent'] },
    { id: 'settings-danger',   name: 'Danger Zone',         section: 'settings',   href: 'patterns/settings-danger.html',   tags: ['delete', 'danger', 'destructive', 'deactivate'] },

    // ── 9. Commerce & Conversion ── monetisation layer ────────────
    { id: 'commerce-pricing',  name: 'Pricing Page',        section: 'commerce',   href: 'patterns/commerce-pricing.html',  tags: ['pricing', 'plans', 'cost', 'tiers'] },
    { id: 'commerce-compare',  name: 'Plan Comparison',     section: 'commerce',   href: 'patterns/commerce-compare.html',  tags: ['compare', 'plans', 'features', 'matrix'] },
    { id: 'commerce-trial',    name: 'Free Trial CTA',      section: 'commerce',   href: 'patterns/commerce-trial.html',    tags: ['trial', 'cta', 'free', 'conversion'] },
    { id: 'commerce-gates',    name: 'Feature Gates',       section: 'commerce',   href: 'patterns/commerce-gates.html',    tags: ['feature gate', 'paywall', 'upgrade', 'locked'] },
    { id: 'commerce-upsell',   name: 'Upsell Modal',        section: 'commerce',   href: 'patterns/commerce-upsell.html',   tags: ['upsell', 'modal', 'upgrade', 'premium'] },
    { id: 'commerce-checkout', name: 'Checkout',            section: 'commerce',   href: 'patterns/commerce-checkout.html', tags: ['checkout', 'payment', 'purchase', 'buy'] },
    { id: 'commerce-payment',  name: 'Payment Method',      section: 'commerce',   href: 'patterns/commerce-payment.html',  tags: ['payment', 'card', 'billing', 'stripe'] },
    { id: 'commerce-confirm',  name: 'Order Confirmation',  section: 'commerce',   href: 'patterns/commerce-confirm.html',  tags: ['confirmation', 'receipt', 'order', 'success'] },
    { id: 'commerce-invoice',  name: 'Invoice / Receipt',   section: 'commerce',   href: 'patterns/commerce-invoice.html',  tags: ['invoice', 'receipt', 'billing', 'document'] },

    // ── 10. Feedback & Support ── polish and edge states ──────────
    { id: 'support-empty',     name: 'Empty State',         section: 'feedback',   href: 'patterns/support-empty.html',    tags: ['empty', 'zero state', 'no results', 'blank'] },
    { id: 'support-skeleton',  name: 'Loading / Skeleton',  section: 'feedback',   href: 'patterns/support-skeleton.html',  tags: ['loading', 'skeleton', 'spinner', 'placeholder'] },
    { id: 'support-progress',  name: 'Progress Indicator',  section: 'feedback',   href: 'patterns/support-progress.html',  tags: ['progress', 'steps', 'completion', 'status'] },
    { id: 'support-success',   name: 'Success State',       section: 'feedback',   href: 'patterns/support-success.html',   tags: ['success', 'complete', 'done', 'confirmation'] },
    { id: 'support-error',     name: 'Error / 404 Page',    section: 'feedback',   href: 'patterns/support-error.html',     tags: ['error', '404', 'not found', 'broken link'] },
    { id: 'support-confirm',   name: 'Confirmation Dialog', section: 'feedback',   href: 'patterns/support-confirm.html',   tags: ['confirm', 'dialog', 'modal', 'alert'] },
    { id: 'support-toast',     name: 'Toast / Snackbar',    section: 'feedback',   href: 'patterns/support-toast.html',     tags: ['toast', 'snackbar', 'notification', 'alert'] },
    { id: 'support-tooltip',   name: 'In-app Tooltip',      section: 'feedback',   href: 'patterns/support-tooltip.html',   tags: ['tooltip', 'hint', 'contextual help', 'guidance'] },
    { id: 'support-nps',       name: 'NPS / Survey',        section: 'feedback',   href: 'patterns/support-nps.html',       tags: ['nps', 'survey', 'rating', 'satisfaction'] },
    { id: 'support-feedback',  name: 'Feedback Form',       section: 'feedback',   href: 'patterns/support-feedback.html',  tags: ['feedback', 'report', 'suggestions', 'contact'] },
    { id: 'support-help',      name: 'Help Center',         section: 'feedback',   href: 'patterns/support-help.html',      tags: ['help', 'support', 'docs', 'knowledge base'] },
  ];

  var _plSection  = 'all';
  var _plQuery    = '';
  var _plFiltered = [];          /* current filtered result set */
  var _PAGE_SIZE  = 20;

  /* Simple thumb URL — theme is pushed via postMessage after load */
  function _buildThumbSrc(href) { return href + '?thumb'; }

  /* Read current theme from localStorage and push it into a loaded iframe */
  function _pushTheme(frame) {
    var t = {};
    try { t = JSON.parse(localStorage.getItem('freshds-theme') || '{}'); } catch (e) {}
    try {
      frame.contentWindow.postMessage({
        type:         'fds-theme',
        primary:      t.primary      || '#7c6af7',
        secondary:    t.secondary    || '#2dd4bf',
        scaleDark:    t.scaleDark    || '#1f2328',
        scaleLight:   t.scaleLight   || '#ffffff',
        success:      t.success      || '#22c55e',
        warning:      t.warning      || '#f59e0b',
        danger:       t.danger       || '#f43f5e',
        info:         t.info         || '#3b82f6',
        pageBg:       t.pageBg       || '#ffffff',
        inputSurface: t.inputSurface || '#ffffff',
        mode:         t.mode         || 'light'
      }, '*');
    } catch (e) {}
  }

  /* bfcache guard — rebuild grid so iframes reload with fresh theme */
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) _renderGrid();
  });

  /* Build one card's HTML */
  function _cardHTML(p) {
    var hasLink = p.href !== '#';
    var thumb = hasLink
      ? '<div slot="thumb" class="pl-thumb"><iframe class="pl-thumb-frame" data-src="' + _buildThumbSrc(p.href) + '" scrolling="no" tabindex="-1" aria-hidden="true"></iframe></div>'
      : '<div slot="thumb" class="pl-thumb"></div>';
    return '<fresh-media-card title="' + p.name + '"'
      + (hasLink ? ' href="' + p.href + '" target="freshds-pattern"' : '')
      + '>' + thumb + '</fresh-media-card>';
  }

  /* Append a sentinel div; _sentinelObserver fires the next page load */
  function _appendSentinel(grid) {
    var s = document.createElement('div');
    s.className = 'pl-sentinel';
    grid.appendChild(s);
    _sentinelObserver.observe(s);
  }

  /* Append the next PAGE_SIZE cards to the grid */
  function _loadNextPage(grid) {
    var start = grid.querySelectorAll('fresh-media-card').length;
    var slice = _plFiltered.slice(start, start + _PAGE_SIZE);
    if (!slice.length) return;

    var tmp = document.createElement('div');
    tmp.innerHTML = slice.map(_cardHTML).join('');
    while (tmp.firstChild) grid.appendChild(tmp.firstChild);

    _observeFrames();

    if (start + slice.length < _plFiltered.length) {
      _appendSentinel(grid);
    }
  }

  /* Sentinel observer — triggers the next page when near the bottom */
  var _sentinelObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      var sentinel = entry.target;
      _sentinelObserver.unobserve(sentinel);
      sentinel.remove();
      var grid = document.getElementById('pl-grid');
      if (grid) _loadNextPage(grid);
    });
  }, { rootMargin: '300px' });

  function _renderGrid() {
    var grid = document.getElementById('pl-grid');
    if (!grid) return;

    _plFiltered = PL_PATTERNS.filter(function(p) {
      var matchSection = _plSection === 'all' || (_plSection === 'ai' && p.ai) || p.section === _plSection;
      var q = _plQuery.toLowerCase();
      var matchSearch = !_plQuery
        || p.name.toLowerCase().includes(q)
        || p.section.toLowerCase().includes(q)
        || (p.tags && p.tags.some(function(t) { return t.includes(q) || q.includes(t); }));
      return matchSection && matchSearch;
    });

    grid.innerHTML = '';

    if (_plFiltered.length === 0) {
      grid.innerHTML = '<div class="pl-empty">No patterns found.</div>';
      return;
    }

    _loadNextPage(grid);
  }

  /* Scale iframe to exactly fill its card — card and iframe are both 16:10 */
  function _scaleFrame(frame) {
    var thumb = frame.parentElement;
    if (!thumb || !thumb.offsetWidth) return;
    frame.style.transform = 'scale(' + (thumb.offsetWidth / 1280) + ')';
  }

  /* Re-scale all loaded frames on window resize */
  window.addEventListener('resize', function() {
    document.querySelectorAll('.pl-thumb-frame').forEach(_scaleFrame);
  });

  /* Lazy-load iframes as they scroll into view, fade in when ready */
  var _frameObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      var frame = entry.target;
      if (!frame.dataset.src) return;
      _scaleFrame(frame);
      frame.addEventListener('load', function() {
        _scaleFrame(frame);
        _pushTheme(frame);                         /* push theme via postMessage */
        setTimeout(function() {                    /* show after theme applies  */
          frame.classList.add('loaded');
        }, 150);
      }, { once: true });
      frame.src = frame.dataset.src;
      frame.removeAttribute('data-src');
      _frameObserver.unobserve(frame);
    });
  }, { rootMargin: '200px' });

  function _observeFrames() {
    document.querySelectorAll('.pl-thumb-frame[data-src]').forEach(function(f) {
      _frameObserver.observe(f);
    });
  }

  // ── Filter bar ──────────────────────────────────────────────────
  var PL_SECTIONS = [
    { key: 'all',        label: 'All' },
    { key: 'ai',         label: '✦ AI' },
    { key: 'auth',       label: 'Auth' },
    { key: 'onboarding', label: 'Onboarding' },
    { key: 'dashboard',  label: 'Dashboards' },
    { key: 'content',    label: 'Content' },
    { key: 'workflow',   label: 'Workflows' },
    { key: 'ai-conv',    label: 'AI & Chat' },
    { key: 'collab',     label: 'Collab' },
    { key: 'settings',   label: 'Settings' },
    { key: 'commerce',   label: 'Commerce' },
    { key: 'feedback',   label: 'Feedback' },
  ];

  var _filterTrack = document.getElementById('pl-filter-track');
  var _moreWrap    = document.getElementById('pl-more-wrap');
  var _moreBtn     = document.getElementById('pl-more-btn');
  var _moreMenu    = document.getElementById('pl-more-menu');

  // Build filter tab buttons
  PL_SECTIONS.forEach(function(s) {
    var btn = document.createElement('button');
    btn.className = 'pl-filter-tab' + (s.key === 'all' ? ' active' : '');
    btn.dataset.key = s.key;
    btn.textContent = s.label;
    btn.addEventListener('click', function() { _setSection(s.key); });
    _filterTrack.appendChild(btn);
  });

  function _setSection(key) {
    _plSection = key;
    _filterTrack.querySelectorAll('.pl-filter-tab').forEach(function(b) {
      b.classList.toggle('active', b.dataset.key === key);
    });
    _moreMenu.querySelectorAll('.pl-more-item').forEach(function(item) {
      item.classList.toggle('active', item.dataset.key === key);
    });
    var inOverflow = Array.from(_moreMenu.querySelectorAll('.pl-more-item')).some(function(i) {
      return i.dataset.key === key;
    });
    _moreBtn.classList.toggle('has-active', inOverflow);
    _renderGrid();
  }

  // More-menu toggle
  _moreBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    var opening = _moreMenu.hidden;
    _moreMenu.hidden = !opening;
    _moreBtn.setAttribute('aria-expanded', opening ? 'true' : 'false');
  });
  document.addEventListener('click', function() {
    _moreMenu.hidden = true;
    _moreBtn.setAttribute('aria-expanded', 'false');
  });
  _moreMenu.addEventListener('click', function(e) { e.stopPropagation(); });

  // Overflow measurement
  function _recalcOverflow() {
    var tabs = Array.from(_filterTrack.querySelectorAll('.pl-filter-tab'));
    var gap  = 4; // var(--space-1)

    // Reset to full-visible state
    tabs.forEach(function(t) { t.style.display = ''; });
    _moreWrap.hidden = true;
    _moreMenu.innerHTML = '';

    var barWidth = document.getElementById('pl-filter-bar').clientWidth;
    var widths   = tabs.map(function(t) { return t.offsetWidth; });
    var totalW   = widths.reduce(function(s, w, i) { return s + w + (i > 0 ? gap : 0); }, 0);

    if (totalW <= barWidth) return; // all fit

    // Reserve space for the ... button
    _moreWrap.hidden = false;
    var avail = barWidth - _moreWrap.offsetWidth - gap;

    // Find cutoff index
    var used = 0;
    var cut  = -1;
    for (var i = 0; i < tabs.length; i++) {
      used += widths[i] + (i > 0 ? gap : 0);
      if (used > avail) { cut = i; break; }
    }

    if (cut === -1) { _moreWrap.hidden = true; return; } // all fit even with button

    // Hide overflow tabs and populate dropdown
    for (var i = cut; i < tabs.length; i++) {
      tabs[i].style.display = 'none';
      var item = document.createElement('button');
      item.className = 'pl-more-item' + (tabs[i].dataset.key === _plSection ? ' active' : '');
      item.dataset.key = tabs[i].dataset.key;
      item.textContent = tabs[i].textContent;
      (function(key) {
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          _moreMenu.hidden = true;
          _moreBtn.setAttribute('aria-expanded', 'false');
          _setSection(key);
        });
      })(tabs[i].dataset.key);
      _moreMenu.appendChild(item);
    }

    _moreMenu.hidden = true;
    var inOverflow = Array.from(_moreMenu.querySelectorAll('.pl-more-item')).some(function(i) {
      return i.dataset.key === _plSection;
    });
    _moreBtn.classList.toggle('has-active', inOverflow);
  }

  new ResizeObserver(function() { _recalcOverflow(); })
    .observe(document.getElementById('pl-filter-bar'));

  // ── Search ──────────────────────────────────────────────────────
  var _plSearchEl = document.getElementById('pl-search-input');
  _plSearchEl.addEventListener('input', function(e) {
    _plQuery = (e.detail ? e.detail.value : _plSearchEl.value) || '';
    _renderGrid();
  });

  // ── Section tabs (topbar) ───────────────────────────────────────
  document.getElementById('section-tabs').addEventListener('change', function(e) {
    if (e.detail.key === 'ds') window.location.href = 'index.html';
  });

  // ── Dark mode restore ───────────────────────────────────────────
  if (ds.mode === 'dark') {
    var appEl = document.getElementById('app');
    if (appEl) appEl.setAttribute('data-mode', 'dark');
    var modeBtn = document.getElementById('mode-btn');
    if (modeBtn) modeBtn.innerHTML = '<i class="ti ti-sun"></i> Light';
  }

  // ── Reload thumbnail iframes on mode toggle ─────────────────────
  // Reload is the most reliable approach: the existing load→_pushTheme
  // path already reads the updated mode from localStorage.
  var _origToggleMode = toggleMode;
  toggleMode = function() {
    _origToggleMode(); // saves updated mode to localStorage
    document.querySelectorAll('.pl-thumb-frame').forEach(function(f) {
      if (!f.src) return; // skip frames not yet loaded
      var src = f.src;
      f.classList.remove('loaded'); // hide while reloading
      f.addEventListener('load', function() {
        _pushTheme(f);
        setTimeout(function() { f.classList.add('loaded'); }, 150);
      }, { once: true });
      f.src = src; // trigger reload
    });
  };

  _renderGrid();
</script>
