<style>
  /* ── Pattern library shell ── */
  /* Freeze all configurable DS tokens so theme customisations only affect thumbnails */
  .pl-body {
    --radius-sm:  4px;
    --radius-md:  8px;
    --radius-lg:  12px;
    --radius-xl:  20px;
    --radius-full: 9999px;
    --font-sans:  'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:  'JetBrains Mono', 'Fira Code', monospace;
    --space-1:  4px;
    --space-2:  8px;
    --space-3:  12px;
    --space-4:  16px;
    --space-5:  20px;
    --space-6:  24px;
    --space-8:  32px;
    --space-10: 40px;
    --space-12: 48px;
  }

  .pl-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface-bg);
  }

  .pl-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-5) var(--space-8);
    border-bottom: 1px solid var(--surface-border);
    gap: var(--space-6);
    flex-shrink: 0;
  }

  .pl-search { width: 220px; flex-shrink: 0; }

  /* ── Overflow filter bar ── */
  .pl-filter-bar {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .pl-filter-track {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    overflow: hidden;
  }

  .pl-filter-tab {
    all: unset;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border-radius: var(--radius-md);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: color 150ms ease, background 150ms ease;
    -webkit-font-smoothing: antialiased;
  }
  .pl-filter-tab:hover:not(.active) {
    color: var(--text-primary);
    background: var(--surface-subtle);
  }
  .pl-filter-tab.active {
    font-weight: 600;
    color: var(--text-primary);
    background: var(--surface-overlay);
  }
  .pl-filter-tab:focus-visible {
    outline: 2px solid var(--color-interactive);
    outline-offset: 2px;
  }

  .pl-more-wrap { position: relative; flex-shrink: 0; }

  .pl-more-btn {
    all: unset;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 20px;
    transition: color 150ms ease, background 150ms ease;
  }
  .pl-more-btn:hover       { color: var(--text-primary); background: var(--surface-subtle); }
  .pl-more-btn.has-active  { color: var(--text-primary); background: var(--surface-overlay); font-weight: 600; }
  .pl-more-btn:focus-visible { outline: 2px solid var(--color-interactive); outline-offset: 2px; }

  .pl-more-menu {
    position: absolute;
    top: calc(100% + var(--space-2));
    left: 0;
    min-width: 160px;
    background: var(--surface-canvas);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-md);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    padding: var(--space-2);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .pl-more-menu[hidden] { display: none; }

  .pl-more-item {
    all: unset;
    display: flex;
    align-items: center;
    padding: 8px 12px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: color 150ms ease, background 150ms ease;
  }
  .pl-more-item:hover  { color: var(--text-primary); background: var(--surface-subtle); }
  .pl-more-item.active { font-weight: 600; color: var(--text-primary); background: var(--surface-overlay); }

  .pl-content {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-8);
    background: #f7f7f8;
  }
  .pl-content::-webkit-scrollbar { width: 4px; }
  .pl-content::-webkit-scrollbar-thumb { background: var(--surface-border-strong); border-radius: 2px; }

  /* ── Pattern grid ── */
  .pl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 280px);
    gap: var(--space-6);
  }

  /* Invisible sentinel — spans full row so the observer fires reliably */
  .pl-sentinel {
    grid-column: 1 / -1;
    height: 1px;
  }

  .pl-empty {
    grid-column: 1 / -1;
    padding: var(--space-12) 0;
    text-align: center;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    color: var(--text-tertiary);
  }

  /* ── Pattern card thumbnail ── */
  .pl-thumb {
    aspect-ratio: 3 / 2;
    overflow: hidden;
    position: relative;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    background: var(--surface-subtle);
  }

  /* Scaled live iframe — scale set by JS to exactly fill card width */
  .pl-thumb-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 800px;
    border: none;
    transform-origin: top left;
    pointer-events: none;
    display: block;
    opacity: 0;
    transition: opacity 300ms ease;
  }
  .pl-thumb-frame.loaded { opacity: 1; }
</style>

  /* Simple thumb URL — theme is pushed via postMessage after load */
  function _buildThumbSrc(href) { return href + '?thumb'; }

  /* Read current theme from localStorage and push it into a loaded iframe */
  function _themePayload() {
    var t = {};
    try { t = JSON.parse(localStorage.getItem('freshds-theme') || '{}'); } catch (e) {}
    return {
      type:         'fds-theme',
      primary:      t.primary      || ds.primary,
      secondary:    t.secondary    || ds.secondary,
      scaleDark:    t.scaleDark    || ds.scaleDark,
      scaleLight:   t.scaleLight   || ds.scaleLight,
      success:      t.success      || ds.success,
      warning:      t.warning      || ds.warning,
      danger:       t.danger       || ds.danger,
      info:         t.info         || ds.info,
      aiAction:     t.aiAction     || ds.aiAction,
      pageBg:       t.pageBg       || ds.pageBg,
      inputSurface: t.inputSurface || ds.inputSurface,
      mode:         t.mode         || ds.mode,
      radiusSm:     t.radiusSm     !== undefined ? t.radiusSm     : ds.radiusSm,
      radiusMd:     t.radiusMd     !== undefined ? t.radiusMd     : ds.radiusMd,
      radiusLg:     t.radiusLg     !== undefined ? t.radiusLg     : ds.radiusLg,
      radiusXl:     t.radiusXl     !== undefined ? t.radiusXl     : ds.radiusXl,
      fontSans:     t.fontSans     || ds.fontSans,
      fontMono:     t.fontMono     || ds.fontMono,
      density:      t.density      || ds.density
    };
  }

  function _pushTheme(frame) {
    try { frame.contentWindow.postMessage(_themePayload(), '*'); } catch (e) {}
  }

  /* React to theme changes made in the configurator (other tab) */
  window.addEventListener('storage', function(e) {
    if (e.key !== 'freshds-theme') return;
    var payload = _themePayload();
    _applyFullThemeToEl(document.documentElement, payload);
    document.querySelectorAll('.pl-thumb-frame').forEach(function(frame) {
      if (!frame.dataset.src) _pushTheme(frame);
    });
  });

  /* bfcache guard — rebuild grid so iframes reload with fresh theme */
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) _renderGrid();
  });

  /* Build one card's HTML */
  function _cardHTML(p) {
    var hasLink = p.href !== '#';
    var thumb = hasLink
      ? '<div slot="thumb" class="pl-thumb"><iframe class="pl-thumb-frame" data-src="' + _buildThumbSrc(p.href) + '" scrolling="no" tabindex="-1" aria-hidden="true"></iframe></div>'
      : '<div slot="thumb" class="pl-thumb"></div>';
    return '<fresh-media-card title="' + p.name + '"'
      + (hasLink ? ' href="' + p.href + '" target="freshds-pattern"' : '')
      + '>' + thumb + '</fresh-media-card>';
  }

  /* Append a sentinel div; _sentinelObserver fires the next page load */
  function _appendSentinel(grid) {
    var s = document.createElement('div');
    s.className = 'pl-sentinel';
    grid.appendChild(s);
    _sentinelObserver.observe(s);
  }

  /* Append the next PAGE_SIZE cards to the grid */
  function _loadNextPage(grid) {
    var start = grid.querySelectorAll('fresh-media-card').length;
    var slice = _plFiltered.slice(start, start + _PAGE_SIZE);
    if (!slice.length) return;

    var tmp = document.createElement('div');
    tmp.innerHTML = slice.map(_cardHTML).join('');
    while (tmp.firstChild) grid.appendChild(tmp.firstChild);

    _observeFrames();

    if (start + slice.length < _plFiltered.length) {
      _appendSentinel(grid);
    }
  }

  /* Sentinel observer — triggers the next page when near the bottom */
  var _sentinelObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      var sentinel = entry.target;
      _sentinelObserver.unobserve(sentinel);
      sentinel.remove();
      var grid = document.getElementById('pl-grid');
      if (grid) _loadNextPage(grid);
    });
  }, { rootMargin: '300px' });

  function _renderGrid() {
    var grid = document.getElementById('pl-grid');
    if (!grid) return;

    _plFiltered = PL_PATTERNS.filter(function(p) {
      var matchSection = _plSection === 'all' || (_plSection === 'ai' && p.ai) || p.section === _plSection;
      var q = _plQuery.toLowerCase();
      var matchSearch = !_plQuery
        || p.name.toLowerCase().includes(q)
        || p.section.toLowerCase().includes(q)
        || (p.tags && p.tags.some(function(t) { return t.includes(q) || q.includes(t); }));
      return matchSection && matchSearch;
    });

    grid.innerHTML = '';

    if (_plFiltered.length === 0) {
      grid.innerHTML = '<div class="pl-empty">No patterns found.</div>';
      return;
    }

    _loadNextPage(grid);
  }

  /* Scale iframe to exactly fill its card — card and iframe are both 16:10 */
  function _scaleFrame(frame) {
    var thumb = frame.parentElement;
    if (!thumb || !thumb.offsetWidth) return;
    frame.style.transform = 'scale(' + (thumb.offsetWidth / 1280) + ')';
  }

  /* Re-scale all loaded frames on window resize */
  window.addEventListener('resize', function() {
    document.querySelectorAll('.pl-thumb-frame').forEach(_scaleFrame);
  });

  /* Lazy-load iframes as they scroll into view, fade in when ready */
  var _frameObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      var frame = entry.target;
      if (!frame.dataset.src) return;
      _scaleFrame(frame);
      frame.addEventListener('load', function() {
        _scaleFrame(frame);
        _pushTheme(frame);                         /* push theme via postMessage */
        setTimeout(function() {                    /* show after theme applies  */
          frame.classList.add('loaded');
        }, 150);
      }, { once: true });
      frame.src = frame.dataset.src;
      frame.removeAttribute('data-src');
      _frameObserver.unobserve(frame);
    });
  }, { rootMargin: '200px' });

  function _observeFrames() {
    document.querySelectorAll('.pl-thumb-frame[data-src]').forEach(function(f) {
      _frameObserver.observe(f);
    });
  }

    _plSection = key;

      b.classList.toggle('active', b.dataset.key === key);
    });
    _moreMenu.querySelectorAll('.pl-more-item').forEach(function(item) {

    });

  // More-menu toggle

    _moreMenu.hidden = !opening;
    _moreBtn.setAttribute('aria-expanded', opening ? 'true' : 'false');
  });
  document.addEventListener('click', function() {
    _moreMenu.hidden = true;
    _moreBtn.setAttribute('aria-expanded', 'false');
  });
  _moreMenu.addEventListener('click', function(e) { e.stopPropagation(); });

  // Overflow measurement
  function _recalcOverflow() {
    var tabs = Array.from(_filterTrack.querySelectorAll('.pl-filter-tab'));
    var gap  = 4; // var(--space-1)

    // Reset to full-visible state
    tabs.forEach(function(t) { t.style.display = ''; });
    _moreWrap.hidden = true;
    _moreMenu.innerHTML = '';

    var barWidth = document.getElementById('pl-filter-bar').clientWidth;
    var widths   = tabs.map(function(t) { return t.offsetWidth; });
    var totalW   = widths.reduce(function(s, w, i) { return s + w + (i > 0 ? gap : 0); }, 0);

    if (totalW <= barWidth) return; // all fit

    // Reserve space for the ... button
    _moreWrap.hidden = false;
    var avail = barWidth - _moreWrap.offsetWidth - gap;

    // Find cutoff index
    var used = 0;
    var cut  = -1;
    for (var i = 0; i < tabs.length; i++) {
      used += widths[i] + (i > 0 ? gap : 0);
      if (used > avail) { cut = i; break; }
    }

    if (cut === -1) { _moreWrap.hidden = true; return; } // all fit even with button

    // Hide overflow tabs and populate dropdown
    for (var i = cut; i < tabs.length; i++) {
      tabs[i].style.display = 'none';
      var item = document.createElement('button');
      item.className = 'pl-more-item' + (tabs[i].dataset.key === _plSection ? ' active' : '');
      item.dataset.key = tabs[i].dataset.key;
      item.textContent = tabs[i].textContent;
      (function(key) {
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          _moreMenu.hidden = true;
          _moreBtn.setAttribute('aria-expanded', 'false');
          _setSection(key);
        });
      })(tabs[i].dataset.key);
      _moreMenu.appendChild(item);
    }

    _moreMenu.hidden = true;
    var inOverflow = Array.from(_moreMenu.querySelectorAll('.pl-more-item')).some(function(i) {
      return i.dataset.key === _plSection;
    });
    _moreBtn.classList.toggle('has-active', inOverflow);
  }

  new ResizeObserver(function() { _recalcOverflow(); })
    .observe(document.getElementById('pl-filter-bar'));

  // ── Reload thumbnail iframes on mode toggle ─────────────────────
  // Reload is the most reliable approach: the existing load→_pushTheme
  // path already reads the updated mode from localStorage.
  var _origToggleMode = toggleMode;
  toggleMode = function() {
    _origToggleMode(); // saves updated mode to localStorage
    document.querySelectorAll('.pl-thumb-frame').forEach(function(f) {
      if (!f.src) return; // skip frames not yet loaded
      var src = f.src;

      f.addEventListener('load', function() {
        _pushTheme(f);
        setTimeout(function() { f.classList.add('loaded'); }, 150);
      }, { once: true });
      f.src = src; // trigger reload

  // ── Builder open/close ───────────────────────────────────────────
  function openBuilder(id) {
    var spec = PL_SPECS[id];
    if (!spec) return;
    _pbCurrentId = id;

    _pbRuleData = {};
    Object.keys(spec.rules).forEach(function(cat) {
      _pbRuleData[cat] = spec.rules[cat].slice();
    });

    document.getElementById('pb-title').textContent = spec.label + ' Pattern';
    _renderPbZones(spec);
    _renderPbRules();

    var pattern = PL_PATTERNS.find(function(p) { return p.id === id; });
    var frame = document.getElementById('pb-frame');
    if (pattern && pattern.href !== '#') {
      frame.addEventListener('load', function onLoad() {
        frame.removeEventListener('load', onLoad);
        _scalePbFrame();
        _pushTheme(frame);
      });
      frame.src = pattern.href;
    }

    document.getElementById('pb-overlay').hidden = false;
    document.body.style.overflow = 'hidden';
    _scalePbFrame();
  }

  function closeBuilder() {
    document.getElementById('pb-overlay').hidden = true;
    document.body.style.overflow = '';
    var frame = document.getElementById('pb-frame');
    frame.src = 'about:blank';
    _pbCurrentId = null;
  }

  function _scalePbFrame() {
    var left  = document.querySelector('.pb-left');
    var frame = document.getElementById('pb-frame');
    if (!left || !frame) return;
    var scale = Math.min(left.clientWidth / 1280, left.clientHeight / 800);
    frame.style.transform = 'scale(' + scale + ')';
    frame.style.left = Math.round((left.clientWidth  - 1280 * scale) / 2) + 'px';
    frame.style.top  = Math.round((left.clientHeight - 800  * scale) / 2) + 'px';
  }

  window.addEventListener('resize', function() {
    if (document.getElementById('pb-overlay') && !document.getElementById('pb-overlay').hidden) {
      _scalePbFrame();
    }
  });

  // ── Zones ────────────────────────────────────────────────────────
  function _renderPbZones(spec) {
    var html = '<div class="pb-zone-list">';
    spec.zones.forEach(function(z) {
      html += '<div class="pb-zone-item">'
        +   '<div class="pb-zone-meta">'
        +     '<div class="pb-zone-label' + (!z.optional ? ' required' : '') + '">' + _escHtml(z.label) + '</div>'
        +     '<div class="pb-zone-desc">' + _escHtml(z.desc) + '</div>'
        +   '</div>';
      if (z.optional) {
        html += '<button class="pb-zone-toggle' + (z.on ? ' on' : '') + '" data-zone-id="' + z.id + '" aria-label="Toggle ' + _escHtml(z.label) + '"></button>';
      } else {
        html += '<button class="pb-zone-toggle on" disabled aria-label="Required"></button>';
      }
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('pb-zones').innerHTML = html;

    document.querySelectorAll('.pb-zone-toggle[data-zone-id]').forEach(function(btn) {
      btn.addEventListener('click', function() { toggleZone(btn.dataset.zoneId); });
    });
  }

  function toggleZone(zoneId) {
    var spec = PL_SPECS[_pbCurrentId];
    if (!spec) return;
    var zone = spec.zones.find(function(z) { return z.id === zoneId; });
    if (!zone || !zone.optional) return;
    zone.on = !zone.on;
    var btn = document.querySelector('.pb-zone-toggle[data-zone-id="' + zoneId + '"]');
    if (btn) btn.classList.toggle('on', zone.on);

  function _escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function _renderPbRules() {
    var html = '<div class="spec-rules-panel">';
    html += '<div class="spec-rules-topbar">'
      + '<span class="spec-rules-title">Global Template Rules</span>'
      + '<span class="spec-rules-hint">Click to edit</span>'
      + '</div>';
    Object.keys(_pbRuleData).forEach(function(cat) {
      html += '<div class="spec-rules-section">'
        + '<div class="spec-rules-section-head"><span class="spec-rules-variant">' + _escHtml(cat) + '</span></div>'
        + '<ul class="spec-rule-list">';
      _pbRuleData[cat].forEach(function(rule, idx) {
        html += '<li class="spec-rule-li">'
          + '<span class="spec-rule-bullet">·</span>'
          + '<span class="spec-rule-text" contenteditable="true" data-cat="' + _escHtml(cat) + '" data-idx="' + idx + '">' + _escHtml(rule) + '</span>'
          + '<div class="spec-rule-actions">'
          + '<button class="spec-rule-btn del" data-del-cat="' + _escHtml(cat) + '" data-del-idx="' + idx + '" title="Delete"><i class="ti ti-trash"></i></button>'
          + '</div>'
          + '</li>';
      });
      html += '</ul>'
        + '<button class="spec-add-rule" data-add-cat="' + _escHtml(cat) + '"><i class="ti ti-plus"></i> Add rule</button>'
        + '</div>';
    });
    html += '</div>';
    document.getElementById('pb-rules').innerHTML = html;

    document.querySelectorAll('.spec-rule-text[contenteditable]').forEach(function(el) {
      el.addEventListener('blur', function() {
        var cat = el.dataset.cat;
        var idx = parseInt(el.dataset.idx, 10);
        if (_pbRuleData[cat]) _pbRuleData[cat][idx] = el.textContent.trim() || _pbRuleData[cat][idx];
      });
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
    });
    document.querySelectorAll('.spec-rule-btn.del[data-del-cat]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var cat = btn.dataset.delCat;
        var idx = parseInt(btn.dataset.delIdx, 10);
        if (_pbRuleData[cat]) { _pbRuleData[cat].splice(idx, 1); _renderPbRules(); }
      });
    });
    document.querySelectorAll('.spec-add-rule[data-add-cat]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var cat = btn.dataset.addCat;
        if (!_pbRuleData[cat]) return;
        _pbRuleData[cat].push('New rule');
        _renderPbRules();
        var items = document.querySelectorAll('[data-cat="' + cat + '"]');
        var last = items[items.length - 1];
        if (last) {
          last.focus();
          var r = document.createRange();
          r.selectNodeContents(last);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        }
      });
    });
  }

  // ── Prompt modal ─────────────────────────────────────────────────
  function openPromptModal() {
    _pbEntityName = '';
    document.getElementById('pb-entity-input').value = '';
    _updatePrompt();
    document.getElementById('pb-modal-backdrop').hidden = false;
  }

  function closePromptModal() {
    document.getElementById('pb-modal-backdrop').hidden = true;
  }

  function _updatePrompt() {
    var spec = PL_SPECS[_pbCurrentId];
    if (!spec) return;
    var pattern = PL_PATTERNS.find(function(p) { return p.id === _pbCurrentId; });
    var entity  = _pbEntityName.trim() || '[your product name]';
    var activeZones = spec.zones.filter(function(z) { return z.on; }).map(function(z) { return z.label; });

    var lines = [
      'Build a Sign In page for ' + entity + ' using FreshDS.',
      '',
      'Reference pattern: ' + (pattern && pattern.href !== '#' ? pattern.href : spec.label),
      '',
      'Zones to include:',
    ];
    activeZones.forEach(function(z) { lines.push('  - ' + z); });
    lines.push('');
    lines.push('Template rules:');
    Object.keys(_pbRuleData).forEach(function(cat) {
      lines.push('');
      lines.push(cat + ':');
      _pbRuleData[cat].forEach(function(r) { lines.push('  - ' + r); });
    });
    lines.push('');
    lines.push('Use only FreshDS web components (fresh-button, fresh-input, fresh-checkbox, etc.) and DS tokens.');
    lines.push('Dark mode is required. Responsive: >= 768px uses split layout; below 768px is single column.');

    document.getElementById('pb-prompt-text').textContent = lines.join('\n');
  }

  function copyPrompt() {
    var text = document.getElementById('pb-prompt-text').textContent;
    navigator.clipboard.writeText(text).then(function() {
      var btn = document.getElementById('pb-copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.textContent = 'Copy Prompt'; }, 2000);
    });
  }

  // ── Wire up builder UI event listeners ──────────────────────────
  document.getElementById('pb-close-header').addEventListener('click', closeBuilder);
  document.getElementById('pb-start-btn').addEventListener('click', openPromptModal);
  document.getElementById('pb-close-modal').addEventListener('click', closePromptModal);
  document.getElementById('pb-cancel-btn').addEventListener('click', closePromptModal);
  document.getElementById('pb-copy-btn').addEventListener('click', copyPrompt);

  document.getElementById('pb-entity-input').addEventListener('input', function(e) {
    _pbEntityName = (e.detail ? e.detail.value : this.value) || '';
    _updatePrompt();
  });

  document.getElementById('pb-modal-backdrop').addEventListener('click', function(e) {
    if (e.target === this) closePromptModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (!document.getElementById('pb-modal-backdrop').hidden) { closePromptModal(); return; }
      if (!document.getElementById('pb-overlay').hidden) { closeBuilder(); }
    }
  });

  _renderGrid();

  // ── Apply configured logo to the navbar ─────────────────────────
  // Only inject a brand slot when a logo is configured; otherwise the
  // component's default content (Acme SVG) shows automatically.
  (function() {
    var cfg = {};
    try {
      var s = localStorage.getItem('freshds-nav-cfg');
      if (s) { var stored = JSON.parse(s); cfg = stored.navbar_cfg || stored; }
    } catch(e) {}
    var effLight = cfg.logoUrl     || cfg.logoUrlDark || '';
    var effDark  = cfg.logoUrlDark || cfg.logoUrl     || '';
    if (!effLight && !effDark) return;
    var brand = document.createElement('div');
    brand.setAttribute('slot', 'brand');
    brand.innerHTML = (effLight === effDark || !effDark)
      ? '<img src="' + effLight + '" alt="Logo" style="height:24px;max-width:140px;object-fit:contain">'
      : '<img class="pl-nav-logo-light" src="' + effLight + '" alt="Logo" style="height:24px;max-width:140px;object-fit:contain">'
        + '<img class="pl-nav-logo-dark" src="' + effDark + '" alt="Logo" style="height:24px;max-width:140px;object-fit:contain">';
    var navbar = document.getElementById('pl-navbar');
    navbar.insertBefore(brand, navbar.firstChild);
  })();
</script>
</body>
</html>
