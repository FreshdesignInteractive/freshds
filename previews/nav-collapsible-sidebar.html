<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .shell-outer {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--surface-bg);
  }

  /* Flexbox (not grid) so content area fills space freed when sidebar collapses */
  .shell-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .shell-body fresh-sidebar {
    flex-shrink: 0;
    height: 100%;
    overflow: hidden;
  }

  .shell-content {
    flex: 1;
    overflow-y: auto;
    background: var(--surface-bg);
    height: 100%;
  }

  .brand-slot { display: flex; align-items: center; gap: var(--space-2); }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: var(--radius-sm);
    background: var(--color-interactive);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
    flex-shrink: 0; letter-spacing: -0.02em;
  }
  .brand-name {
    font-size: var(--font-size-md); font-weight: 600;
    color: var(--text-primary); letter-spacing: -0.01em; white-space: nowrap;
  }

  /* Icon rail flyout */
  .icon-flyout {
    position: fixed;
    left: 57px;
    top: 0;
    width: 200px;
    background: var(--surface-canvas);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-md);
    box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
    z-index: 90;
    display: none;
    overflow: hidden;
  }
  .icon-flyout.open { display: block; }
  .icon-flyout-label {
    padding: var(--space-2) var(--space-3) var(--space-1);
    font-size: var(--font-size-xs);
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    border-bottom: 1px solid var(--surface-border);
  }
  .flyout-item {
    display: flex;
    align-items: center;
    padding: 7px var(--space-3);
    font-size: var(--font-size-sm);
    font-family: var(--font-sans);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 100ms, color 100ms;
    -webkit-font-smoothing: antialiased;
  }
  .flyout-item:hover { background: var(--surface-subtle); color: var(--text-primary); }
  .flyout-item.active { background: var(--nav-active-bg); color: var(--nav-active-text); font-weight: 500; }

  /* Command palette overlay */
  .palette-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; }
  .palette-overlay.open { display: flex; }
  .palette-box { width: 560px; max-width: calc(100vw - 32px); background: var(--surface-canvas); border-radius: var(--radius-lg); box-shadow: 0 24px 64px rgba(0,0,0,0.22), 0 0 0 1px var(--surface-border); overflow: hidden; display: flex; flex-direction: column; }
  .palette-search { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--surface-border); }
  .palette-search .ti { font-size: 18px; color: var(--text-tertiary); flex-shrink: 0; }
  .palette-input { flex: 1; border: none; outline: none; font-size: 15px; font-family: var(--font-sans); color: var(--text-primary); background: transparent; }
  .palette-input::placeholder { color: var(--text-tertiary); }
  .palette-results { max-height: 340px; overflow-y: auto; padding: 6px 0; }
  .palette-results::-webkit-scrollbar { width: 4px; }
  .palette-results::-webkit-scrollbar-thumb { background: var(--surface-border-strong); border-radius: 2px; }
  .palette-group-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); padding: 10px 18px 4px; }
  .palette-item { display: flex; align-items: center; gap: 12px; padding: 8px 18px; cursor: pointer; font-size: 13px; color: var(--text-primary); transition: background 100ms; }
  .palette-item:hover, .palette-item.active { background: var(--surface-subtle); }
  .pitem-icon { font-size: 15px; color: var(--text-secondary); width: 18px; flex-shrink: 0; }
  .pitem-group { margin-left: auto; font-size: 11px; color: var(--text-tertiary); }
  .pitem-empty { padding: 32px 18px; text-align: center; font-size: 13px; color: var(--text-tertiary); }
  .palette-footer { display: flex; align-items: center; gap: 16px; padding: 9px 18px; border-top: 1px solid var(--surface-border); font-size: 11px; color: var(--text-tertiary); }
  .palette-footer-hint { display: flex; align-items: center; gap: 5px; }
  .palette-footer-hint kbd { display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 18px; padding: 0 4px; border: 1px solid var(--surface-border-strong); border-radius: 3px; font-size: 10px; font-family: var(--font-mono); color: var(--text-tertiary); }

  /* ── Demo bar (dark/light toggle) ── */
  .demo-bar { position: fixed; bottom: var(--space-4); left: 50%; transform: translateX(-50%); z-index: 300; display: flex; align-items: center; gap: var(--space-1); background: var(--surface-canvas); border: 1px solid var(--surface-border); border-radius: var(--radius-full); padding: var(--space-1); box-shadow: var(--elev-3); white-space: nowrap; transition: padding 220ms ease, width 220ms ease, height 220ms ease; overflow: hidden; }
  .demo-inner { display: flex; align-items: center; gap: var(--space-1); opacity: 1; padding-left: 6px; transition: max-width 220ms ease, opacity 150ms ease; overflow: hidden; }
  .demo-bar.collapsed { padding: 0; width: 36px; height: 36px; gap: 0; justify-content: center; }
  .demo-bar.collapsed .demo-inner { max-width: 0; width: 0; padding: 0; margin: 0; opacity: 0; pointer-events: none; }
  .demo-bar.collapsed .demo-collapse-btn { width: 36px; height: 36px; font-size: var(--font-size-xl); color: var(--text-primary); }
  .demo-sep { width: 1px; height: 16px; background: var(--surface-border); flex-shrink: 0; margin: 0 2px; }
  .demo-mode-btn, .demo-collapse-btn { width: 28px; height: 28px; border: none; border-radius: var(--radius-full); background: transparent; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; font-size: var(--font-size-lg); flex-shrink: 0; transition: background 150ms, color 150ms; }
  .demo-mode-btn:hover, .demo-collapse-btn:hover { background: var(--surface-subtle); color: var(--text-primary); }
  .demo-collapse-btn { color: var(--text-tertiary); font-size: var(--font-size-md); }
  .logo-dark { display: none; }
  [data-mode="dark"] .logo-light { display: none; }
  [data-mode="dark"] .logo-dark { display: block; }
</style>
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="/js/pattern-bar.js"></script>
</head>

<body>

      <fresh-avatar name="Jane Smith" size="sm"></fresh-avatar>
    </div>

  <div class="shell-body">

    <fresh-sidebar id="app-sidebar">

      <!-- Navigation groups (taxonomy-driven) -->
      <div id="nav-content"></div>


</div>

<script>
  (function() {
    var DEF = {
      primary: '#1f2328', secondary: '#6b7280',
      scaleDark: '#1f2328', scaleLight: '#ffffff',
      success: '#22c55e', warning: '#f59e0b', danger: '#f43f5e',
      info: '#3b82f6', aiAction: '#0d9488',
      pageBg: '#ffffff', inputSurface: '#ffffff',
      radiusSm: '4', radiusMd: '8', radiusLg: '12', radiusXl: '20',
      fontSans: 'Inter', fontMono: 'JetBrains Mono',
      density: 'default', mode: 'light'
    };
    var DENSITY = {
      compact:     { 1:'3px', 2:'6px',  3:'10px', 4:'12px', 5:'16px', 6:'20px', 8:'28px', 10:'34px', 12:'42px' },
      default:     { 1:'4px', 2:'8px',  3:'12px', 4:'16px', 5:'20px', 6:'24px', 8:'32px', 10:'40px', 12:'48px' },
      comfortable: { 1:'5px', 2:'10px', 3:'15px', 4:'20px', 5:'26px', 6:'30px', 8:'42px', 10:'52px', 12:'62px' }
    };
    var t = DEF;
    try { var s = localStorage.getItem('freshds-theme'); if (s) t = Object.assign({}, DEF, JSON.parse(s)); } catch(e) {}

    var root = document.documentElement;
    applyScalesToElement(root, t.primary, t.secondary, t.scaleDark, t.scaleLight, t.success, t.warning, t.danger, t.info, t.aiAction);
    root.style.setProperty('--color-page-bg',       t.pageBg       || '#ffffff');
    root.style.setProperty('--color-input-surface', t.inputSurface || '#ffffff');
    if (t.radiusSm !== undefined) root.style.setProperty('--radius-sm', t.radiusSm + 'px');
    if (t.radiusMd !== undefined) root.style.setProperty('--radius-md', t.radiusMd + 'px');
    if (t.radiusLg !== undefined) root.style.setProperty('--radius-lg', t.radiusLg + 'px');
    if (t.radiusXl !== undefined) root.style.setProperty('--radius-xl', t.radiusXl + 'px');
    if (t.fontSans && typeof loadFont === 'function' && SANS_FONTS && SANS_FONTS[t.fontSans]) {
      loadFont(t.fontSans, SANS_FONTS[t.fontSans]);
      root.style.setProperty('--font-sans', "'" + t.fontSans + "', system-ui, sans-serif");
    }
    if (t.fontMono && typeof loadFont === 'function' && MONO_FONTS && MONO_FONTS[t.fontMono]) {
      loadFont(t.fontMono, MONO_FONTS[t.fontMono]);
      root.style.setProperty('--font-mono', "'" + t.fontMono + "', monospace");
    }
    var spacing = DENSITY[t.density] || DENSITY.default;
    Object.keys(spacing).forEach(function(k) { root.style.setProperty('--space-' + k, spacing[k]); });
    if (t.mode === 'dark') document.getElementById('app') && document.getElementById('app').setAttribute('data-mode', 'dark');
  })();
</script>

<!-- DS components -->
<script src="/components/core/fresh-button.js"></script>
<script src="/components/navigation/fresh-navbar.js"></script>
<script src="/components/navigation/fresh-sidebar.js"></script>
<script src="/components/data/fresh-avatar.js"></script>

<script>
  var _tax      = loadTaxonomy();
  var sidebar   = document.getElementById('app-sidebar');
  var _flyoutIdx = -1;

  /* Build icon rail: top-level taxonomy items as nav-items with section icons */
  function _buildIconRail(tax) {
    var html = '<fresh-nav-group label="Nav" open>';
    tax.forEach(function(item, idx) {
      var iconAttr = item.icon ? ' icon="' + item.icon + '"' : '';
      html += '<fresh-nav-item' + iconAttr + (idx === 0 ? ' active' : '') +
              ' data-tax-idx="' + idx + '">' + (item.label || '') + '</fresh-nav-item>';
    });
    html += '</fresh-nav-group>';
    return html;
  }

  /* Initialize as expanded full sidebar */
  document.getElementById('nav-content').innerHTML = buildSidebarHtml(_tax);

  /* ── Flyout ── */
  function _railItems() {
    return Array.prototype.slice.call(document.querySelectorAll('#nav-content fresh-nav-item'));
  }

  function _setRailActive(idx) {
    _railItems().forEach(function(el, i) {
      if (i === idx) el.setAttribute('active', '');
      else           el.removeAttribute('active');
    });
  }

  function _closeFlyout() {
    _flyoutIdx = -1;
    document.getElementById('icon-flyout').classList.remove('open');
  }

  function _openFlyout(idx, anchorEl) {
    var section = _tax[idx];
    var kids    = (section && section.children) || [];
    if (kids.length === 0) { _closeFlyout(); return; }

    _flyoutIdx = idx;
    document.getElementById('icon-flyout-label').textContent = section.label || '';
    document.getElementById('icon-flyout-items').innerHTML = kids.map(function(child, ci) {
      return '<div class="flyout-item' + (ci === 0 ? ' active' : '') + '">' + (child.label || '') + '</div>';
    }).join('');

    var rect   = anchorEl.getBoundingClientRect();
    var flyout = document.getElementById('icon-flyout');
    flyout.style.top = rect.top + 'px';
    flyout.classList.add('open');

    requestAnimationFrame(function() {
      var fh = flyout.offsetHeight;
      var vh = window.innerHeight;
      if (rect.top + fh > vh - 8) flyout.style.top = Math.max(8, vh - fh - 8) + 'px';
    });
  }

  /* nav-click on icon rail items */
  document.getElementById('nav-content').addEventListener('nav-click', function(e) {
    if (!sidebar.hasAttribute('collapsed')) return;
    var item = e.target;
    if (!item || item.tagName.toLowerCase() !== 'fresh-nav-item') return;
    var idx = parseInt(item.dataset.taxIdx, 10);
    if (isNaN(idx)) return;
    _setRailActive(idx);
    if (idx === _flyoutIdx) { _closeFlyout(); return; }
    _openFlyout(idx, item);
  });

  document.getElementById('nav-content').addEventListener('click', function(e) { e.stopPropagation(); });
  document.getElementById('icon-flyout').addEventListener('click', function(e) { e.stopPropagation(); });
  document.addEventListener('click', _closeFlyout);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') _closeFlyout(); });

  /* ── Hamburger: toggle collapsed + swap content ── */
  document.getElementById('app-navbar').addEventListener('hamburger-click', function() {
    if (sidebar.hasAttribute('collapsed')) {
      sidebar.removeAttribute('collapsed');
      document.getElementById('nav-content').innerHTML = buildSidebarHtml(_tax);
      _closeFlyout();
    } else {
      sidebar.setAttribute('collapsed', '');
      document.getElementById('nav-content').innerHTML = _buildIconRail(_tax);
    }
  });

  /* Auto-collapse to icon rail at mobile breakpoint */
  var mq = window.matchMedia('(max-width: 767px)');
  function onBreakpoint(e) {
    if (e.matches) {
      sidebar.setAttribute('collapsed', '');
      document.getElementById('nav-content').innerHTML = _buildIconRail(_tax);
      _closeFlyout();
    }
  }
  mq.addEventListener('change', onBreakpoint);
  onBreakpoint(mq);
</script>

<script>
  (function() {
    var NB_ICONS = [
      { key: 'search',    icon: 'ti-search',         label: 'Search' },
      { key: 'bell',      icon: 'ti-bell',           label: 'Notifications' },
      { key: 'help',      icon: 'ti-help-circle',    label: 'Help' },
      { key: 'plus',      icon: 'ti-circle-plus',    label: 'New' },
      { key: 'grid',      icon: 'ti-grid-dots',      label: 'Apps' },
      { key: 'settings',  icon: 'ti-settings-2',     label: 'Settings' },
      { key: 'messages',  icon: 'ti-message-circle', label: 'Messages' },
      { key: 'bookmark',  icon: 'ti-bookmark',       label: 'Saved' }
    ];

    var cfg = { logoUrl: '', logoUrlDark: '', activeIcons: ['search', 'bell'] };
    try {
      var s = localStorage.getItem('freshds-nav-cfg');
      if (s) { var stored = JSON.parse(s); cfg = Object.assign(cfg, stored.navbar_cfg || stored); }
    } catch(e) {}

    var brand = document.getElementById('nb-brand');
    if (brand) {
      var _effectiveLight = cfg.logoUrl    || cfg.logoUrlDark;
      var _effectiveDark  = cfg.logoUrlDark || cfg.logoUrl;
      if (_effectiveLight || _effectiveDark) {
        brand.setAttribute('slot', 'brand');
        var logoHtml;
        if (_effectiveLight === _effectiveDark) {
          logoHtml = '<img src="' + _effectiveLight.replace(/"/g, '&quot;') + '" alt="Logo" style="height:28px;max-width:140px;object-fit:contain">';
        } else {
          logoHtml = '<img class="logo-light" src="' + _effectiveLight.replace(/"/g, '&quot;') + '" alt="Logo" style="height:28px;max-width:140px;object-fit:contain">' +
                     '<img class="logo-dark"  src="' + _effectiveDark.replace(/"/g, '&quot;')  + '" alt="Logo" style="height:28px;max-width:140px;object-fit:contain">';
        }
        brand.innerHTML = logoHtml;
      } else {
        brand.removeAttribute('slot');
        brand.innerHTML = '';
      }
    }

    var actions = document.getElementById('nb-actions');
    if (actions) {
      /* Filter 'search' — navbar handles it via the search attribute */
      var iconsHtml = (cfg.activeIcons || []).filter(function(key) { return key !== 'search'; }).map(function(key) {
        var ic = NB_ICONS.filter(function(i) { return i.key === key; })[0];
        return ic ? '<fresh-button variant="ghost" icon-only size="sm" aria-label="' + ic.label + '"><i class="ti ' + ic.icon + '"></i></fresh-button>' : '';
      }).join('');
      actions.innerHTML = iconsHtml + '<fresh-avatar name="Jane Smith" size="sm"></fresh-avatar>';
    }
  })();
</script>

<!-- Command palette -->
<div class="palette-overlay" id="palette-overlay">
  <div class="palette-box">
    <div class="palette-search">
      <i class="ti ti-search"></i>
      <input class="palette-input" id="palette-input" placeholder="Search pages, actions..." autocomplete="off" spellcheck="false">
    </div>
    <div class="palette-results" id="palette-results"></div>
    <div class="palette-footer">
      <span class="palette-footer-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span class="palette-footer-hint"><kbd>↵</kbd> select</span>
      <span class="palette-footer-hint"><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<script>
  var NAV_ITEMS = buildPaletteItems(loadTaxonomy());
  var _activeIdx = 0, _filtered = NAV_ITEMS.slice();

  function openPalette() {
    document.getElementById('palette-overlay').classList.add('open');
    document.getElementById('palette-input').value = '';
    renderResults('');
    setTimeout(function() { document.getElementById('palette-input').focus(); }, 30);
  }
  function closePalette() { document.getElementById('palette-overlay').classList.remove('open'); _activeIdx = 0; }

  function renderResults(query) {
    var q = query.toLowerCase().trim();
    _filtered = q ? NAV_ITEMS.filter(function(i) { return i.label.toLowerCase().indexOf(q) !== -1 || i.group.toLowerCase().indexOf(q) !== -1; }) : NAV_ITEMS.slice();
    _activeIdx = _filtered.length > 0 ? 0 : -1;
    var html = '';
    if (_filtered.length === 0) {
      html = '<div class="pitem-empty">No results for "' + query + '"</div>';
    } else if (q) {
      html = _filtered.map(function(item, i) { return '<div class="palette-item' + (i === 0 ? ' active' : '') + '" onclick="selectItem(' + i + ')"><i class="ti ' + item.icon + ' pitem-icon"></i><span>' + item.label + '</span><span class="pitem-group">' + item.group + '</span></div>'; }).join('');
    } else {
      var groups = []; _filtered.forEach(function(item) { if (groups.indexOf(item.group) === -1) groups.push(item.group); });
      var fi = 0; groups.forEach(function(group) { html += '<div class="palette-group-label">' + group + '</div>'; _filtered.filter(function(i) { return i.group === group; }).forEach(function(item) { var idx = fi++; html += '<div class="palette-item' + (idx === 0 ? ' active' : '') + '" onclick="selectItem(' + idx + ')"><i class="ti ' + item.icon + ' pitem-icon"></i><span>' + item.label + '</span></div>'; }); });
    }
    document.getElementById('palette-results').innerHTML = html;
  }
  function setActive(idx) {
    _activeIdx = Math.max(0, Math.min(idx, _filtered.length - 1));
    document.querySelectorAll('.palette-item').forEach(function(el, i) { el.classList.toggle('active', i === _activeIdx); });
    var a = document.querySelectorAll('.palette-item')[_activeIdx]; if (a) a.scrollIntoView({ block: 'nearest' });
  }
  function selectItem(idx) { closePalette(); }

  document.getElementById('palette-input').addEventListener('input', function() { renderResults(this.value); });
  document.getElementById('palette-input').addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(_activeIdx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(_activeIdx - 1); }
    else if (e.key === 'Enter')  { if (_activeIdx >= 0) selectItem(_activeIdx); }
    else if (e.key === 'Escape') { closePalette(); }
  });
  document.getElementById('palette-overlay').addEventListener('click', function(e) { if (e.target === this) closePalette(); });
  document.getElementById('app-navbar').addEventListener('search-open', openPalette);
  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('palette-overlay').classList.contains('open') ? closePalette() : openPalette(); }
  });
</script>

</body>
</html>
