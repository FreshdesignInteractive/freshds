<!DOCTYPE html>
<html lang="en">
<head>
<!-- Auth guard: redirects to / if no session or unpaid -->
<script type="module" src="/js/auth-guard.js"></script>
<script type="module" src="/js/paid-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accept Invitation | Acme</title>
<link rel="icon" type="image/svg+xml" href="../../systems/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../../systems/tokens/primitives.css">
<link rel="stylesheet" href="../../systems/tokens/theme.css">
<link rel="stylesheet" href="../../systems/tokens/dataviz.css">
<link rel="stylesheet" href="../../systems/styles/reset.css">
<link rel="stylesheet" href="../../systems/styles/patterns/auth.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../../systems/js/freshds.js"></script>
<script src="../../systems/js/pattern-bar.js"></script>

<style>
  .invite-card {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4);
    background: var(--surface-canvas);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg);
    margin-bottom: var(--space-6);
  }

  .invite-card-text { flex: 1; min-width: 0; }

  .invite-card-label {
    font-size: 12px;
    color: var(--text-tertiary);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--space-1);
  }

  .invite-card-who {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .invite-card-team {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
<link rel="stylesheet" href="../../systems/styles/spec-panel.css">
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
      <div class="demo-sep"></div>
      <button class="demo-spec-btn" onclick="spOpen()" aria-label="Configure pattern"><i class="ti ti-layout-sidebar-right"></i> Configure</button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="auth-page">
    <fresh-navbar id="auth-topbar">
      <div slot="actions" style="display:flex;align-items:center;gap:8px;">
        <fresh-button variant="ghost" size="sm">Sign in</fresh-button>
        <fresh-button variant="primary" size="sm">Sign up</fresh-button>
      </div>
    </fresh-navbar>

    <div class="auth-body">
      <div class="auth-left" aria-hidden="true">
        <div class="auth-left-inner">
          <div class="auth-left-icon"><i class="ti ti-photo"></i></div>
          <div class="auth-left-label">Customer image</div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-form-wrap">
          <div class="auth-form">

            <h1 class="auth-title">You've been invited</h1>
            <p class="auth-sub">Create your account to join the team. Your email is already confirmed.</p>

            <div class="invite-card">
              <fresh-avatar name="Sarah Chen" size="lg"></fresh-avatar>
              <div class="invite-card-text">
                <div class="invite-card-label">Invited by</div>
                <div class="invite-card-who">Sarah Chen</div>
                <div class="invite-card-team">Acme · Growth Team</div>
              </div>
            </div>

            <div class="field-stack">
              <div class="field-row">
                <div class="field">
                  <label class="field-label" for="first-name">First name</label>
                  <fresh-input id="first-name" autocomplete="given-name"></fresh-input>
                </div>
                <div class="field">
                  <label class="field-label" for="last-name">Last name</label>
                  <fresh-input id="last-name" autocomplete="family-name"></fresh-input>
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="inv-email">Email</label>
                <fresh-input id="inv-email" type="email" value="jamie@acmecorp.com" disabled></fresh-input>
              </div>
              <div class="field">
                <label class="field-label" for="inv-password">Create password</label>
                <fresh-input id="inv-password" type="password" autocomplete="new-password"></fresh-input>
              </div>
            </div>

            <fresh-button>Accept invitation</fresh-button>

          </div>
        </div>

        <div class="auth-foot">
          Already have an account?&nbsp;<a class="auth-link" href="auth-login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

</div>
<script src="../../systems/components/navigation/fresh-navbar.js"></script>
<script src="../../systems/js/freshds-nav-apply.js"></script>
<script src="../../systems/components/core/fresh-input.js"></script>
<script src="../../systems/components/core/fresh-button.js"></script>
<script src="../../systems/components/data/fresh-avatar.js"></script>
</body>
</html>
