<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}

.opf-icon-flyout { position: fixed; left: 57px; top: 0; width: 200px; background: var(--surface-canvas); border: 1px solid var(--surface-border); border-radius: var(--radius-md); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06); z-index: 90; display: none; overflow: hidden; }

<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
      <div class="demo-sep"></div>

      <i class="ti ti-minus"></i>

  </div>

  <div class="onb-page" style="height:100vh;min-height:unset;overflow:hidden;">
    <fresh-navbar id="opf-topbar" data-nav-logged-in>
      <div slot="actions" data-nav-actions-logged-in></div>
    </fresh-navbar>

    <div id="opf-tab-strip" class="opf-tab-strip" style="display:none;">
      <fresh-topbar-menu id="opf-top-tabs"></fresh-topbar-menu>
    </div>
    <div class="opf-tab-dropdown" id="opf-tab-dropdown"></div>

    <div class="page-body-row">

      <div class="opf-icon-flyout" id="opf-icon-flyout">

        <div id="opf-flyout-items"></div>
      </div>
    <div class="onb-body">
      <div class="onb-wrap">

        <div class="onb-stepper">
          <fresh-stepper step="3" steps='[
            {"label":"Role"},
            {"label":"Use case"},
            {"label":"Profile"},
            {"label":"Workspace"},
            {"label":"Team"},
            {"label":"Integrations"}
          ]'></fresh-stepper>
        </div>

        <div class="onb-eyebrow">Step 3 of 6</div>
        <h1 class="onb-title">Set up your profile</h1>
        <p class="onb-sub">Let your teammates know who they're working with.</p>

        <div class="avatar-upload" style="margin-bottom:var(--space-6)">
          <div class="avatar-upload-placeholder" aria-hidden="true">
            <i class="ti ti-user"></i>
          </div>
          <div class="avatar-upload-info">
            <div class="avatar-upload-title">Profile photo</div>
            <div class="avatar-upload-sub">JPG, PNG or GIF · Max 5 MB</div>
          </div>
          <fresh-button variant="secondary" size="sm">Upload</fresh-button>
        </div>

        <div class="onb-field-stack">
          <div class="onb-field-row">
            <div class="onb-field">
              <label class="onb-label" for="first-name">First name</label>
              <fresh-input id="first-name" value="Jamie" autocomplete="given-name"></fresh-input>
            </div>
            <div class="onb-field">
              <label class="onb-label" for="last-name">Last name</label>
              <fresh-input id="last-name" value="Rivera" autocomplete="family-name"></fresh-input>
            </div>
          </div>
          <div class="onb-field">
            <label class="onb-label" for="job-title">Job title</label>
            <fresh-input id="job-title" placeholder="e.g. Product Designer" autocomplete="organization-title"></fresh-input>
          </div>
          <div class="onb-field">
            <label class="onb-label" for="timezone">Timezone</label>
            <fresh-select id="timezone">
              <option value="">Select your timezone…</option>
              <option value="pst" selected>Pacific Time (PT) | UTC-8</option>
              <option value="mst">Mountain Time (MT) | UTC-7</option>
              <option value="cst">Central Time (CT) | UTC-6</option>
              <option value="est">Eastern Time (ET) | UTC-5</option>
              <option value="gmt">Greenwich Mean Time (GMT)</option>
              <option value="cet">Central European Time (CET) | UTC+1</option>
              <option value="ist">India Standard Time (IST) | UTC+5:30</option>
            </fresh-select>
          </div>
        </div>

        <div class="onb-nav">
          <fresh-button variant="ghost"><i class="ti ti-arrow-left"></i> Back</fresh-button>
          <fresh-button variant="primary">Continue <i class="ti ti-arrow-right"></i></fresh-button>
        </div>

      </div>
    </div>

<script>
var _currentPattern='persistent-sidebar',_flyoutIdx=-1;
function _readNavCfg(){var cfg={nav_pattern:'persistent-sidebar',taxonomy:[]};try{var s=localStorage.getItem('freshds-nav-cfg');if(s)Object.assign(cfg,JSON.parse(s));}catch(e){}return cfg;}
function _getTax(cfg){return(Array.isArray(cfg.taxonomy)&&cfg.taxonomy.length>0)?cfg.taxonomy:(typeof DEFAULT_TAXONOMY!=='undefined'?DEFAULT_TAXONOMY:[]);}
function _buildIconRail(tax){var html='<fresh-nav-group label="Nav" open>';tax.forEach(function(item,idx){var ic=item.icon?' icon="'+item.icon+'"':'';html+='<fresh-nav-item'+ic+(idx===0?' active':'')+' data-tax-idx="'+idx+'">'+(item.label||'')+'</fresh-nav-item>';});return html+'</fresh-nav-group>';}
function _applyNavPattern(){var cfg=_readNavCfg();var tax=_getTax(cfg);_currentPattern=cfg.nav_pattern||'persistent-sidebar';var navbar=document.getElementById('opf-topbar');var sidebar=document.getElementById('opf-sidebar');var tabStrip=document.getElementById('opf-tab-strip');sidebar.style.display='none';tabStrip.style.display='none';sidebar.removeAttribute('collapsed');sidebar.style.position='';sidebar.style.zIndex='';sidebar.style.height='100%';sidebar.style.width='';(function(){var b=document.getElementById('_hd-bd');if(b)b.style.display='none';})();navbar.removeAttribute('hamburger');_closeFlyout();document.getElementById('opf-tab-dropdown').classList.remove('open');if(_currentPattern==='persistent-sidebar'){sidebar.style.display='';document.getElementById('opf-nav-content').innerHTML=buildSidebarHtml(tax);}else if(_currentPattern==='collapsible-sidebar'){sidebar.style.display='';navbar.setAttribute('hamburger','');sidebar.setAttribute('collapsed','');document.getElementById('opf-nav-content').innerHTML=_buildIconRail(tax);}else if(_currentPattern==='top-nav-tabs'){tabStrip.style.display='';var tabsEl=document.getElementById('opf-top-tabs');tabsEl.setAttribute('tabs',buildTabsJson(tax));if(tax[0])tabsEl.setAttribute('active',tax[0].id);}else if(_currentPattern==='dual-level'){tabStrip.style.display='';sidebar.style.display='';var _dtabs=tabStrip.querySelector('fresh-topbar-menu');var _dnc=document.getElementById(sidebar.id.replace('-sidebar','-nav-content'));_dtabs.setAttribute('tabs',buildTabsJson(tax));if(tax[0])_dtabs.setAttribute('active',tax[0].id);_dnc.innerHTML=buildDualLevelSections(tax);var _dswitch=function(key){_dnc.querySelectorAll('.section-nav').forEach(function(el){el.style.display=el.id===('snav-'+key)?'contents':'none';});var _da=_dnc.querySelector('#snav-'+key);sidebar.style.display=(_da&&_da.dataset.hasChildren==='1')?'':'none';};_dswitch(tax[0]?tax[0].id:'');if(!_dtabs._dlWired){_dtabs._dlWired=true;_dtabs.addEventListener('change',function(e){_dswitch(e.detail.key);});}}else if(_currentPattern==='hamburger-drawer'){navbar.setAttribute('hamburger','');document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML=buildSidebarHtml(tax);(function(){var b=document.getElementById('_hd-bd');if(b)b.style.display='none';})();}else if(_currentPattern==='command-palette'){sidebar.style.display='';sidebar.setAttribute('collapsed','');document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML=_buildIconRail(tax);}else{sidebar.style.display='';document.getElementById(sidebar.id.replace('-sidebar','-nav-content')).innerHTML=buildSidebarHtml(tax);}}
function _closeFlyout(){_flyoutIdx=-1;document.getElementById('opf-icon-flyout').classList.remove('open');}
function _openFlyout(idx,anchorEl){var cfg=_readNavCfg();var tax=_getTax(cfg);var section=tax[idx];var kids=(section&&section.children)||[];if(!kids.length){_closeFlyout();return;}_flyoutIdx=idx;document.getElementById('opf-flyout-label').textContent=section.label||'';document.getElementById('opf-flyout-items').innerHTML=kids.map(function(child,ci){return'<div class="opf-flyout-item'+(ci===0?' active':'')+'">'+( child.label||'')+'</div>';}).join('');var rect=anchorEl.getBoundingClientRect();var flyout=document.getElementById('opf-icon-flyout');flyout.style.top=rect.top+'px';flyout.classList.add('open');requestAnimationFrame(function(){var fh=flyout.offsetHeight,vh=window.innerHeight;if(rect.top+fh>vh-8)flyout.style.top=Math.max(8,vh-fh-8)+'px';});}
var _tabDropKey=null,_tabPrevActive='',_tabClickX=0;
function _closeTabDrop(){_tabDropKey=null;document.getElementById('opf-tab-dropdown').classList.remove('open');}
function _openTabDrop(key,x){var cfg=_readNavCfg();var tax=_getTax(cfg);var item=null;for(var i=0;i<tax.length;i++){if(tax[i].id===key){item=tax[i];break;}}var kids=(item&&item.children)||[];if(!kids.length){_closeTabDrop();return;}_tabDropKey=key;var drop=document.getElementById('opf-tab-dropdown');var stripBot=document.getElementById('opf-tab-strip').getBoundingClientRect().bottom;drop.innerHTML=kids.map(function(child,ci){return'<div class="opf-tab-drop-item'+(ci===0?' active':'')+'">'+( child.label||'')+'</div>';}).join('');drop.style.top=stripBot+'px';drop.style.left='0';drop.classList.add('open');requestAnimationFrame(function(){var w=drop.offsetWidth,vw=window.innerWidth;drop.style.left=Math.max(8,Math.min(x-w/2,vw-w-8))+'px';});}
document.addEventListener('DOMContentLoaded',function(){_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();document.getElementById('opf-topbar').addEventListener('hamburger-click',function(){if(_currentPattern!=='collapsible-sidebar'&&_currentPattern!=='hamburger-drawer')return;var sb=document.getElementById('opf-sidebar');var tax=_getTax(_readNavCfg());if(_currentPattern==='hamburger-drawer'){var _hdbd=document.getElementById('_hd-bd');if(!_hdbd){_hdbd=document.createElement('div');_hdbd.id='_hd-bd';_hdbd.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99;display:none';var _sbRef=sb;_hdbd.addEventListener('click',function(){_sbRef.style.display='none';_sbRef.style.position='';_sbRef.style.zIndex='';_sbRef.style.height='100%';_sbRef.style.width='';_hdbd.style.display='none';});document.body.appendChild(_hdbd);}var _hdopen=sb.style.display!=='none';if(_hdopen){sb.style.display='none';sb.style.position='';sb.style.zIndex='';sb.style.height='100%';sb.style.width='';_hdbd.style.display='none';}else{sb.style.display='';sb.style.position='fixed';sb.style.left='0';sb.style.top='0';sb.style.height='100vh';sb.style.width='var(--sidebar-w,240px)';sb.style.zIndex='100';_hdbd.style.display='';}return;}if(sb.hasAttribute('collapsed')){sb.removeAttribute('collapsed');document.getElementById('opf-nav-content').innerHTML=buildSidebarHtml(tax);_closeFlyout();}else{sb.setAttribute('collapsed','');document.getElementById('opf-nav-content').innerHTML=_buildIconRail(tax);}});document.getElementById('opf-nav-content').addEventListener('nav-click',function(e){if(_currentPattern!=='collapsible-sidebar'&&_currentPattern!=='command-palette')return;var sb=document.getElementById('opf-sidebar');if(!sb.hasAttribute('collapsed'))return;var item=e.target;if(!item||item.tagName.toLowerCase()!=='fresh-nav-item')return;var idx=parseInt(item.dataset.taxIdx,10);if(isNaN(idx))return;Array.prototype.slice.call(document.querySelectorAll('#opf-nav-content fresh-nav-item')).forEach(function(el,i){if(i===idx)el.setAttribute('active','');else el.removeAttribute('active');});if(idx===_flyoutIdx){_closeFlyout();return;}_openFlyout(idx,item);});document.getElementById('opf-nav-content').addEventListener('click',function(e){e.stopPropagation();});document.getElementById('opf-icon-flyout').addEventListener('click',function(e){e.stopPropagation();});document.getElementById('opf-top-tabs').addEventListener('mousedown',function(e){_tabClickX=e.clientX;});document.getElementById('opf-top-tabs').addEventListener('click',function(e){if(_currentPattern!=='top-nav-tabs')return;e.stopPropagation();var activeNow=this.getAttribute('active');if(activeNow!==_tabPrevActive){_tabPrevActive=activeNow;_openTabDrop(activeNow,_tabClickX);}else{if(_tabDropKey===activeNow)_closeTabDrop();else _openTabDrop(activeNow,_tabClickX);}});document.getElementById('opf-tab-dropdown').addEventListener('click',function(e){e.stopPropagation();});document.addEventListener('click',function(){_closeFlyout();_closeTabDrop();});document.addEventListener('keydown',function(e){if(e.key==='Escape'){_closeFlyout();_closeTabDrop();spClose();spCloseModal();}});});
window.addEventListener('storage',function(e){if(e.key!=='freshds-nav-cfg')return;_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();});
var _lastNavCfgStr=null;(function _poll(){var s=localStorage.getItem('freshds-nav-cfg')||'';if(s!==_lastNavCfgStr){_lastNavCfgStr=s;_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();}setTimeout(_poll,400);}());
window.addEventListener('pageshow',function(e){if(e.persisted){_applyNavPattern();if(window.FreshNavApply)window.FreshNavApply.apply();}});
var SP_ZONES=[{key:'header',label:'Page header',el:'opf-header',on:true},{key:'content',label:'Page content',el:'opf-content',on:true}];
var SP_RULES={'LAYOUT':['Full app shell: dash-shell with fresh-navbar + fresh-sidebar from nav config.','dash-main: flex:1, overflow-y:auto, padding var(--space-5) var(--space-6).'],'PAGE HEADER':['dash-page-header: flex row, space-between, border-bottom. Title left, actions right.','Use fresh-button with appropriate variants for header actions.'],'CONTENT':['Wrap content sections in dash-card with dash-card-title.','Use FreshDS tokens for all spacing, color, and typography.']};
function spOpen(){document.getElementById('sp-panel').classList.add('open');document.getElementById('sp-panel').setAttribute('aria-hidden','false');_spRenderZones();_spRenderCats();var u=new URL(location.href);u.searchParams.set('spec','open');history.replaceState(null,'',u.toString());}
function spClose(){document.getElementById('sp-panel').classList.remove('open');document.getElementById('sp-panel').setAttribute('aria-hidden','true');var u=new URL(location.href);u.searchParams.delete('spec');history.replaceState(null,'',u.toString());}
function _spRenderZones(){var el=document.getElementById('sp-zones');el.innerHTML='';SP_ZONES.forEach(function(z){var row=document.createElement('div');row.className='sp-zone-row';row.innerHTML='<span class="sp-zone-label">'+z.label+'</span><label class="sp-toggle"><input type="checkbox"'+(z.on?' checked':'')+'><span class="sp-toggle-track"></span><span class="sp-toggle-thumb"></span></label>';row.querySelector('input').addEventListener('change',function(){z.on=this.checked;var t=document.getElementById(z.el);if(t)t.style.display=z.on?'':'none';});el.appendChild(row);});}
function _spRenderCats(){var el=document.getElementById('sp-cats');el.innerHTML='';Object.keys(SP_RULES).forEach(function(cat){var wrap=document.createElement('div');wrap.className='sp-cat';_spBuildCat(cat,wrap);el.appendChild(wrap);});}
function _spBuildCat(cat,wrap){wrap.innerHTML='';var label=document.createElement('div');label.className='sp-cat-label';label.textContent=cat;wrap.appendChild(label);SP_RULES[cat].forEach(function(rule,ri){wrap.appendChild(_spRuleRow(cat,ri,rule,wrap));});var addBtn=document.createElement('button');addBtn.className='sp-add-rule';addBtn.innerHTML='<i class="ti ti-plus"></i> Add rule';addBtn.addEventListener('click',function(){SP_RULES[cat].push('New rule');_spBuildCat(cat,wrap);var texts=wrap.querySelectorAll('.sp-rule-text');var last=texts[texts.length-1];if(last){last.focus();var r=document.createRange();r.selectNodeContents(last);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}});wrap.appendChild(addBtn);}
function _spRuleRow(cat,ri,text,wrap){var row=document.createElement('div');row.className='sp-rule';var dot=document.createElement('span');dot.className='sp-rule-dot';var span=document.createElement('span');span.className='sp-rule-text';span.contentEditable='true';span.textContent=text;span.addEventListener('input',function(){SP_RULES[cat][ri]=span.textContent;});var del=document.createElement('button');del.className='sp-rule-del';del.innerHTML='<i class="ti ti-trash"></i>';del.setAttribute('aria-label','Delete rule');del.addEventListener('click',function(){SP_RULES[cat].splice(ri,1);_spBuildCat(cat,wrap);});row.appendChild(dot);row.appendChild(span);row.appendChild(del);return row;}
function spShare(){var u=new URL(location.href);u.searchParams.set('spec','open');var btn=document.getElementById('sp-share-btn');navigator.clipboard.writeText(u.toString()).then(function(){var orig=btn.innerHTML;btn.innerHTML='<i class="ti ti-check"></i>';setTimeout(function(){btn.innerHTML=orig;},1800);}).catch(function(){});}
function spStartBuilding(){var lines=['Build this page using the FreshDS design system.',''];Object.keys(SP_RULES).forEach(function(cat){lines.push('## '+cat);SP_RULES[cat].forEach(function(rule){lines.push('- '+rule);});lines.push('');});lines.push('## ACTIVE ZONES');SP_ZONES.forEach(function(z){lines.push('- '+z.label+': '+(z.on?'SHOWN':'HIDDEN'));});document.getElementById('sp-modal-pre').textContent=lines.join('\n');document.getElementById('sp-modal-backdrop').classList.add('open');}
function spCloseModal(){document.getElementById('sp-modal-backdrop').classList.remove('open');}
function spCopyPrompt(){navigator.clipboard.writeText(document.getElementById('sp-modal-pre').textContent).then(function(){var ok=document.getElementById('sp-copy-ok');ok.classList.add('show');setTimeout(function(){ok.classList.remove('show');},1800);}).catch(function(){});}
if(new URL(location.href).searchParams.get('spec')==='open'){document.addEventListener('DOMContentLoaded',spOpen);}
</script>
