<!DOCTYPE html>
<html lang="en">
<head>
<!-- Auth guard: redirects to / if no session or unpaid -->
<script type="module" src="/js/auth-guard.js"></script>
<script type="module" src="/js/paid-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blank Slate (Logged Out) | Acme</title>
<link rel="icon" type="image/svg+xml" href="../../systems/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../../systems/tokens/primitives.css">
<link rel="stylesheet" href="../../systems/tokens/theme.css">
<link rel="stylesheet" href="../../systems/tokens/dataviz.css">
<link rel="stylesheet" href="../../systems/styles/reset.css">
<link rel="stylesheet" href="../../systems/styles/patterns/dashboard.css">
<script>if(location.href.indexOf('?thumb')!==-1)document.write('<style>#demo-bar{display:none!important}</style>');</script>
<script src="../../systems/js/freshds.js"></script>
<script src="../../systems/js/pattern-bar.js"></script>
<style>
.nav-logo-dark { display: none; }
[data-mode="dark"] .nav-logo-light { display: none; }
[data-mode="dark"] .nav-logo-dark  { display: block; }

/* ── Spec trigger button ── */</style>
<link rel="stylesheet" href="../../systems/styles/spec-panel.css">
</head>
<body>
<div id="app">

  <div class="demo-bar" id="demo-bar">
    <div class="demo-inner" id="demo-inner">
      <button class="demo-mode-btn" id="mode-toggle-btn" onclick="toggleDemoMode()" aria-label="Toggle dark mode">
        <i class="ti ti-moon"></i>
      </button>
      <div class="demo-sep"></div>
      <button class="demo-spec-btn" onclick="spOpen()" aria-label="Configure pattern">
        <i class="ti ti-layout-sidebar-right"></i> Configure
      </button>
    </div>
    <div class="demo-sep"></div>
    <button class="demo-collapse-btn" id="demo-collapse-btn" onclick="toggleDemoBar()" aria-label="Collapse toolbar">
      <i class="ti ti-minus"></i>
    </button>
  </div>

  <div class="dash-shell">
    <fresh-navbar id="bslo-topbar">
      <div slot="actions" style="display:flex;align-items:center;gap:8px;">
        <fresh-button variant="secondary" size="sm">Sign in</fresh-button>
        <fresh-button variant="primary" size="sm">Sign up</fresh-button>
      </div>
    </fresh-navbar>
    <div class="dash-body">
      <main class="dash-main" style="overflow-y:auto;"></main>
    </div>
  </div>

</div>

<!-- Spec panel -->
<aside class="sp-panel" id="sp-panel" aria-label="Pattern spec" aria-hidden="true">
  <div class="sp-hdr">
    <span class="sp-hdr-title">Configure</span>
    <button class="sp-hdr-close" onclick="spClose()" aria-label="Close"><i class="ti ti-x"></i></button>
  </div>
  <div class="sp-body">
    <div id="sp-zones" class="sp-zones"></div>
  </div>
  <div class="sp-bottom">
    <button class="sp-btn sp-btn-primary sp-btn-block" onclick="spCopyTo()">
      Copy to project <i class="ti ti-arrow-right"></i>
    </button>
  </div>
</aside>

<div class="sp-modal-backdrop" id="sp-modal-backdrop" onclick="spCloseModal()">
  <div class="sp-modal sp-copy-modal" onclick="event.stopPropagation()">
    <div class="sp-modal-hdr">
      <span>Copy to project</span>
      <button class="sp-modal-close" onclick="spCloseModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="sp-modal-body">
      <p class="sp-modal-desc">Zones turned off will be removed. The demo toolbar and configure panel will be stripped out.</p>
      <div class="sp-modal-field">
        <label class="sp-modal-label" for="sp-project-name">Project name</label>
        <input class="sp-modal-input" id="sp-project-name" type="text" placeholder="my-project" autocomplete="off">
      </div>
    </div>
    <div class="sp-modal-foot">
      <button class="sp-btn sp-btn-primary" onclick="spDoCopy()">
        <i class="ti ti-files"></i> Copy file
      </button>
    </div>
  </div>
</div>

<script src="../../systems/components/navigation/fresh-navbar.js"></script>
<script src="../../systems/components/core/fresh-button.js"></script>
<script src="../../systems/js/freshds-nav-apply.js"></script>

<script>
/* ── Spec panel ──────────────────────────────────────────── */

var SP_ZONES = [];

function spOpen() {
  document.getElementById('sp-panel').classList.add('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'false');
  _spRenderZones();
  var u = new URL(location.href); u.searchParams.set('spec', 'open');
  history.replaceState(null, '', u.toString());
}

function spClose() {
  document.getElementById('sp-panel').classList.remove('open');
  document.getElementById('sp-panel').setAttribute('aria-hidden', 'true');
  var u = new URL(location.href); u.searchParams.delete('spec');
  history.replaceState(null, '', u.toString());
}

function _spRenderZones() {
  var el = document.getElementById('sp-zones'); if (!el) return;
  el.innerHTML = '';
  SP_ZONES.forEach(function(z) {
    var row = document.createElement('div'); row.className = 'sp-zone-row';
    row.innerHTML = '<span class="sp-zone-label">' + z.label + '</span>' +
      '<label class="sp-toggle"><input type="checkbox"' + (z.on ? ' checked' : '') + '>' +
      '<span class="sp-toggle-track"></span><span class="sp-toggle-thumb"></span></label>';
    row.querySelector('input').addEventListener('change', function() {
      z.on = this.checked;
      var t = document.getElementById(z.el); if (t) t.style.display = z.on ? '' : 'none';
    });
    el.appendChild(row);
  });
}

function spCopyTo() {
  document.getElementById('sp-project-name').value = '';
  document.getElementById('sp-modal-backdrop').classList.add('open');
}

function spCloseModal() { document.getElementById('sp-modal-backdrop').classList.remove('open'); }

function spDoCopy() {
  var name = (document.getElementById('sp-project-name').value || '').trim().replace(/[^a-z0-9_-]/gi, '-').toLowerCase();
  if (!name) { document.getElementById('sp-project-name').focus(); return; }
  var clone = document.documentElement.cloneNode(true);
  SP_ZONES.forEach(function(z) {
    if (!z.on) { var el = clone.querySelector('#' + z.el); if (el) el.remove(); }
  });
  ['demo-bar', 'sp-panel', 'sp-modal-backdrop'].forEach(function(id) {
    var el = clone.querySelector('#' + id); if (el) el.remove();
  });
  clone.querySelectorAll('link[href*="spec-panel"]').forEach(function(l) { l.remove(); });
  ['pattern-bar', 'auth-guard', 'paid-guard', 'cloud-sync'].forEach(function(key) {
    clone.querySelectorAll('script[src*="' + key + '"]').forEach(function(s) { s.remove(); });
  });
  var filename = location.pathname.split('/').pop() || 'pattern.html';
  var html = '<!DOCTYPE html>\n' + clone.outerHTML;
  var blob = new Blob([html], {type: 'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  spCloseModal();
}

if (new URL(location.href).searchParams.get('spec') === 'open') {
  document.addEventListener('DOMContentLoaded', spOpen);
}
</script>
</body>
</html>
