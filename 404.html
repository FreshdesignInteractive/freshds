*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {

/* Nav */
.nav {

.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }

.nav-links a { font-size: 14px; font-weight: 450; color: var(--text-secondary); text-decoration: none; transition: color 0.15s; }
.nav-links a:hover { color: var(--text-primary); }
.btn-nav {
  display: inline-flex; align-items: center; padding: 8px 20px;
  border: 1.5px solid var(--text-primary); border-radius: var(--radius-pill);
  background: transparent; font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--text-primary); cursor: pointer; text-decoration: none;
  transition: background 0.15s, color 0.15s;
}
.btn-nav:hover { background: var(--text-primary); color: #fff; }

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px;
  text-align: center;

.error-code {

  line-height: 1;
  color: var(--purple);
  margin-bottom: 24px;
}
.error-title {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
.error-desc {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.7;
  max-width: 420px;
  margin-bottom: 40px;
}
.btn-home {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;
  background: var(--purple); color: #fff;
  border: none; border-radius: var(--radius-pill);
  font-family: inherit; font-size: 15px; font-weight: 600;
  text-decoration: none; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn-home:hover { background: var(--purple-dark); }
.btn-home:active { transform: scale(0.98); }
.btn-home svg { width: 16px; height: 16px; }

/* Footer */
.footer {
  border-top: 1px solid var(--border); background: var(--card);
  padding: 24px 40px; display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.footer-copy { font-size: 13px; color: var(--text-tertiary); }
.footer-links { display: flex; gap: 24px; list-style: none; }
.footer-links a { font-size: 13px; color: var(--purple); text-decoration: none; }
.footer-links a:hover { color: var(--purple-dark); }
.footer-social { display: flex; align-items: center; gap: 8px; }
.footer-social a {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border: 1.5px solid var(--border);
  border-radius: 50%; color: var(--text-tertiary); text-decoration: none;
  transition: border-color 0.15s, color 0.15s;
}
.footer-social a:hover { border-color: var(--purple); color: var(--purple); }
.footer-social svg { width: 13px; height: 13px; fill: currentColor; }

@media (max-width: 640px) {
  .nav { padding: 0 16px; }
  .nav-links { display: none; }
  .error-code { font-size: 80px; }
  .error-title { font-size: 22px; }
  .footer { flex-direction: column; gap: 16px; text-align: center; }
}
