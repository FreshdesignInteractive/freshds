<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshDS | Get Started</title>
<link rel="icon" type="image/svg+xml" href="/systems/favicon.svg">

<!-- Auth guard -->
<script type="module" src="/js/auth-guard.js"></script>
<script type="module" src="/js/cloud-sync.js"></script>
<link rel="stylesheet" href="/styles/site-header.css">
<script type="module" src="/js/site-header.js"></script>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red: #EA4350;
  --red-dark: #c73040;
  --red-light: #fde8ea;
  --text-primary: #111;
  --text-secondary: #555;
  --text-tertiary: #999;
  --border: #e4e4e7;
  --bg: #f7f7f8;
  --card: #fff;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* Nav */
.nav {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; height: 60px; flex-shrink: 0;
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-right { display: flex; align-items: center; }

/* Avatar */
.nav-avatar-wrap { position: relative; }
.nav-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--red); color: #fff;
  font-size: 14px; font-weight: 700; letter-spacing: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; font-family: inherit;
  overflow: hidden; transition: opacity 0.15s;
}
.nav-avatar:hover { opacity: 0.85; }

/* Dropdown */
.nav-avatar-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  min-width: 200px;
  overflow: hidden;
  z-index: 200;
}
.nav-avatar-dropdown.open { display: block; }
.nav-dropdown-name {
  padding: 14px 16px;
  font-size: 14px; font-weight: 500;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
}
.nav-dropdown-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 12px 16px;
  font-size: 14px; color: var(--text-secondary);
  background: none; border: none; text-align: left;
  font-family: inherit; cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.nav-dropdown-item:hover { background: var(--bg); color: var(--text-primary); }
.nav-dropdown-item i { font-size: 16px; }

/* Page */
.page {
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
  padding: 56px 24px 80px;
  flex: 1;
}

/* Section label */
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}

/* Demo section header */
.demo-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.btn-open-demo {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit; font-size: 14px; font-weight: 500;
  color: var(--text-secondary); background: none; border: none;
  cursor: pointer; text-decoration: none; transition: color 0.15s;
  padding: 0;
}
.btn-open-demo:hover { color: var(--text-primary); }
.btn-open-demo i { font-size: 14px; }

/* Demo cards */
.demo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.demo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
}
.demo-card-icon {
  width: 36px; height: 36px;
  background: var(--red-light);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
}
.demo-card-icon i { font-size: 18px; color: var(--red); }
.demo-card-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 8px; }
.demo-card-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

/* Footer */
.footer {
  border-top: 1px solid var(--border); background: var(--card);
  padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
}
.footer-copy { font-size: 13px; color: var(--text-tertiary); }

@media (max-width: 768px) {
  .demo-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .nav { padding: 0 16px; }
  .footer { padding: 20px 16px; }
}
</style>
</head>
<body>

<div id="sh-mount"></div>

<div class="page">


</div>

<footer class="footer">
  <span class="footer-copy">© 2026 Freshdesign. All Rights Reserved, Freshdesign Interactive, Inc.</span>
</footer>

</body>
</html>
